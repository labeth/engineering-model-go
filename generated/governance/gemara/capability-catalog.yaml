title: "Engineering Model Go Repository Architecture - Capabilities"
metadata:
  id: ENGMOD-CAPABILITY-CATALOG
  type: CapabilityCatalog
  gemara-version: 1.1.0
  date: "2026-09-19T00:00:00Z"
  description: System capabilities of Engineering Model Go Repository Architecture
  author:
    id: engmod
    name: Engineering Model
    type: Human
capabilities:
- id: CAP-SYSTEM
  title: Engineering Model Go Repository Architecture
  description: "The system as a whole: Engineering Model Go Repository Architecture."
  group: system
- id: FU-MODEL-LOADER
  title: Model Loader
  description: Validates canonical YAML against the authoritative CUE contract before strict Go decoding and normalization.
  group: FG-MODEL-AUTHORING
- id: FU-VALIDATION-ENGINE
  title: Validation Engine
  description: Validates authored entities, IDs, references, and mapping consistency.
  group: FG-VALIDATION-ANALYSIS
- id: FU-CODEMAP-INFERENCE
  title: Codemap Inference
  description: Infers code/runtime ownership and verification links from source and tests.
  group: FG-VALIDATION-ANALYSIS
- id: FU-VIEW-PROJECTION
  title: View Projection
  description: Builds projection graphs for architecture, traceability, security, and flow views.
  group: FG-ARTIFACT-GENERATION
- id: FU-ASCIIDOC-GENERATOR
  title: AsciiDoc Generator
  description: Renders architecture publication docs and view narratives for human consumption.
  group: FG-ARTIFACT-GENERATION
- id: FU-THREAT-EXPORTER
  title: Threat Exporter
  description: Exports Threat Dragon and Open OTM model artifacts.
  group: FG-ARTIFACT-GENERATION
- id: FU-STRUCTURIZR-EXPORTER
  title: Structurizr Exporter
  description: Emits Structurizr DSL and deployment-aware model views.
  group: FG-ARTIFACT-GENERATION
- id: FU-SYSML-EXPORTER
  title: SysML Exporter
  description: Generates SysML v2 textual and project interchange artifacts from the canonical semantic model while reporting conformance coverage.
  group: FG-ARTIFACT-GENERATION
- id: FU-NAF-EXPORTER
  title: NAF Exporter
  description: Validates NAF 4.1 stakeholders, concerns, and viewpoint selections and renders architecture products from existing canonical views.
  group: FG-ARTIFACT-GENERATION
- id: FU-TRLC-EXPORTER
  title: TRLC Exporter
  description: Emits TRLC model and requirement artifacts.
  group: FG-TRACEABILITY-COMPLIANCE
- id: FU-LOBSTER-EXPORTER
  title: LOBSTER Exporter
  description: Generates LOBSTER traceability inputs and reports.
  group: FG-TRACEABILITY-COMPLIANCE
- id: FU-OSCAL-EXPORTER
  title: OSCAL Exporter
  description: Exports OSCAL System Security Plan (SSP), Assessment Results (AR), and Plan of Action and Milestones (POA&M).
  group: FG-TRACEABILITY-COMPLIANCE
- id: FU-GEMARA-EXPORTER
  title: Gemara Exporter
  description: Renders OpenSSF Gemara L1-L7 catalogs and logs (vector, principle, guidance, control, capability, threat, risk, evaluation, enforcement, audit) with an optional OSCAL catalog and assessment-results bridge, validated by the Gemara SDK.
  group: FG-TRACEABILITY-COMPLIANCE
- id: FU-AIRBORNE-ASSURANCE-EXPORTER
  title: Airborne Assurance Exporter
  description: Validates aviation assurance evidence-readiness profiles and generates clearly marked draft lifecycle-data indexes, trace matrices, gap reports, and certification-support summaries without claiming compliance or authority acceptance.
  group: FG-TRACEABILITY-COMPLIANCE
- id: FU-SYSTEM-COMPOSITION
  title: System Composition
  description: Resolves downward subsystem references from local paths, external git repositories, or exact-version CUE modules fetched from OCI registries into the .engmod cache, and composes a federated system-of-systems model.
  group: FG-MODEL-AUTHORING
- id: FU-ALLOCATION-TRACE
  title: Allocation Trace
  description: Materializes parent-to-subsystem allocation and bidirectional traceability across composed systems, without modifying subsystem models.
  group: FG-TRACEABILITY-COMPLIANCE
- id: FU-MCP-SERVER
  title: MCP Server
  description: Serves model-backed tools over MCP with path safety and structured errors.
  group: FG-MCP-INTEGRATION
- id: FU-CLI-ORCHESTRATION
  title: CLI Orchestration
  description: Command entrypoints orchestrating model load, validation, generation, and exports.
  group: FG-MODEL-AUTHORING
- id: FU-MODEL-CHANGE
  title: Model Change
  description: Plans, validates, summarizes, and atomically applies typed stable-ID changes to authored model documents.
  group: FG-MODEL-AUTHORING
groups:
- id: FG-MODEL-AUTHORING
  title: Model Authoring
  description: Inputs and model loading responsibilities.
- id: FG-VALIDATION-ANALYSIS
  title: Validation and Analysis
  description: Validation and inference responsibilities.
- id: FG-ARTIFACT-GENERATION
  title: Artifact Generation
  description: Publication and exchange artifact generation.
- id: FG-TRACEABILITY-COMPLIANCE
  title: Traceability and Compliance
  description: Trace and compliance export responsibilities.
- id: FG-MCP-INTEGRATION
  title: MCP Integration
  description: AI-agent integration and runtime API responsibilities.
- id: system
  title: System
  description: Whole-system capability scope.
