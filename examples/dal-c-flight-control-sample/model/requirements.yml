    title: Produce bounded rudder command
    text: When yaw rate input is received, the yaw damping software shall compute a bounded rudder command.
    notes: System-allocated behavior.
    category: system-capability
    rationale: The aircraft-level safety allocation requires bounded yaw damping authority.
    sourceRefs: [REF-SYSTEM-SAFETY-ASSESSMENT]
    verificationMethods: [analysis, test]
