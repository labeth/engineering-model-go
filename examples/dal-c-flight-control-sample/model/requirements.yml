    appliesTo: [FU-YAW-CONTROL]
  - id: REQ-YD-LLR-001
    title: Limit rudder command
    text: When yaw rate input is received, the yaw damping software shall limit the bounded rudder command.
    notes: Derived low-level limit requiring safety feedback.
    category: constraint
    rationale: The command limiter protects downstream actuator authority.
    sourceRefs: [REF-SYSTEM-SAFETY-ASSESSMENT]
    verificationMethods: [analysis, test]
    verificationCriteria: Commands at and beyond the input boundaries remain limited to plus or minus five units.
    priority: high
    criticality: safety-related
    status: approved
    derived: true
