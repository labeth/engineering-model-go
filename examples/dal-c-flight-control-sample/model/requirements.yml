    appliesTo: [FU-YAW-CONTROL]
  - id: REQ-YD-HLR-001
    title: Filter yaw rate input
    text: When yaw rate input is received, the yaw damping software shall filter the yaw rate input.
    notes: High-level software requirement.
    category: functional
    rationale: Filtering provides the stable signal required by the control law.
    sourceRefs: [REF-SYSTEM-SAFETY-ASSESSMENT]
    verificationMethods: [analysis, test]
    verificationCriteria: Filter output matches the reviewed reference response for nominal and boundary inputs.
    priority: high
    criticality: safety-related
    status: approved
