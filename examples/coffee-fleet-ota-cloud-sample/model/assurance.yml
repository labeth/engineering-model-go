    effectiveness: high
    owner: ACT-SECURITY-ANALYST
    notes: Device identity claims gate command and telemetry channels.
    verificationRefs:
    - CV-COFFEE-DEVICE-IDENTITY-TEST
    evidence:
    - path: src/telemetry_ingest.ts
      description: Identity verification guardrail.
  - id: MIT-COFFEE-TELEMETRY-REPLAY-WINDOW
    threatScenarioRef: TS-COFFEE-TELEMETRY-REPLAY
    controlRef: CTRL-COFFEE-DEVICE-IDENTITY
    status: partial
    effectiveness: medium
    owner: ACT-SECURITY-ANALYST
    notes: Replay window and dedup controls are active with ongoing burst tuning.
    verificationRefs:
    - CV-COFFEE-TELEMETRY-REPLAY
    evidence:
    - path: src/telemetry_ingest.ts
      description: Replay dedup behavior.
  - id: MIT-COFFEE-AUDIT-IMMUTABILITY
    threatScenarioRef: TS-COFFEE-LOG-TAMPERING
    controlRef: CTRL-COFFEE-DEVICE-IDENTITY
    status: planned
    effectiveness: medium
    owner: ACT-SECURITY-ANALYST
    notes: Planned immutable log retention and append-only controls for OTA incident trails.
    verificationRefs:
    - CV-COFFEE-AUDIT-INTEGRITY-ANALYSIS
    evidence:
    - path: docs/security/log-integrity-review.md
      description: Planned hardening backlog and analysis.
