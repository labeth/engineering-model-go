schemaVersion: 2
assurance:
  attackVectors:
  - id: AV-MALICIOUS-FIRMWARE-BUNDLE
    name: Malicious Firmware Bundle
    description: Tampered OTA payload targeting update agent execution.
  - id: AV-SPOOFED-DEVICE-IDENTITY
    name: Spoofed Device Identity
    description: Unauthorized identity attempting telemetry/command access.
  - id: AV-TELEMETRY-REPLAY-ABUSE
    name: Telemetry Replay Abuse
    description: Replayed telemetry intended to overload ingestion and corrupt insights.
  - id: AV-LOG-TAMPERING
    name: Log Tampering
    description: Attempts to suppress or alter audit/operational logs.
  controls:
  - id: CTRL-COFFEE-DEVICE-IDENTITY
    name: Device Identity Validation
    category: identity-access
    description: Require authenticated device identity for telemetry and OTA command channels.
  - id: CTRL-COFFEE-FIRMWARE-SIGNATURE
    name: Firmware Signature Enforcement
    category: integrity
    description: Require signed firmware bundles before applying OTA updates.
  risks:
  - id: RISK-COFFEE-DEVICE-SPOOFING
    title: Device identity spoofing risk
    statement: Spoofed devices may inject telemetry and OTA requests without strong identity controls.
    status: mitigating
    likelihood: medium
    impact: high
    response: mitigate
    owner: ACT-SECURITY-ANALYST
    appliesTo:
    - FU-FLEET-INGESTION-API
    - IF-COFFEE-TELEMETRY-INGEST
    relatedControls:
    - CTRL-COFFEE-DEVICE-IDENTITY
    attackVectors:
    - AV-SPOOFED-DEVICE-IDENTITY
    threatScenarios:
    - TS-COFFEE-OTA-COMMAND-SPOOF
    evidence:
    - path: src/telemetry_ingest.ts
    residualRisk: medium
    rationale: Identity validation is active; replay hardening remains under review.
  - id: RISK-COFFEE-MALICIOUS-OTA
    title: Malicious OTA payload execution risk
    statement: Tampered firmware artifacts could execute on fleet devices if signature enforcement drifts.
    status: mitigating
    likelihood: medium
    impact: high
    response: mitigate
    owner: ACT-SECURITY-ANALYST
    appliesTo:
    - FU-OTA-UPDATE-AGENT
    - FU-UPDATE-CAMPAIGN-ORCHESTRATION
    relatedControls:
    - CTRL-COFFEE-FIRMWARE-SIGNATURE
    attackVectors:
    - AV-MALICIOUS-FIRMWARE-BUNDLE
    threatScenarios:
    - TS-COFFEE-MALICIOUS-OTA-BUNDLE
    evidence:
    - path: src/ota_agent.rs
      description: Signature verification flow in OTA agent.
    residualRisk: low
    rationale: Verification and signer controls are strong with regular regression checks.
  - id: RISK-COFFEE-TELEMETRY-REPLAY
    title: Telemetry replay distortion risk
    statement: Replayed telemetry can distort observability and trigger noisy operational decisions.
    status: mitigating
    likelihood: medium
    impact: medium
    response: mitigate
    owner: ACT-SECURITY-ANALYST
    appliesTo:
    - FU-FLEET-INGESTION-API
    - DO-COFFEE-TELEMETRY-EVENT
    relatedControls:
    - CTRL-COFFEE-DEVICE-IDENTITY
    attackVectors:
    - AV-TELEMETRY-REPLAY-ABUSE
    threatScenarios:
    - TS-COFFEE-TELEMETRY-REPLAY
    evidence:
    - path: src/telemetry_ingest.ts
      description: Replay-window filtering and dedup checks.
    residualRisk: medium
    rationale: Replay controls are present but require aggressive tuning under burst traffic.
  - id: RISK-COFFEE-LOG-TAMPERING
    title: Audit log tampering risk
    statement: Log tampering could conceal OTA incident traces and delay response.
    status: open
    likelihood: low
    impact: high
    response: mitigate
    owner: ACT-SECURITY-ANALYST
    appliesTo:
    - FU-FLEET-OBSERVABILITY-REPORTING
    - REF-CLOUD-LOGGING-SERVICE
    relatedControls:
    - CTRL-COFFEE-DEVICE-IDENTITY
    attackVectors:
    - AV-LOG-TAMPERING
    threatScenarios:
    - TS-COFFEE-LOG-TAMPERING
    evidence:
    - path: docs/security/log-integrity-review.md
      description: Current audit immutability gap analysis.
    residualRisk: medium
    rationale: Core logging exists; immutability hardening is incomplete.
  poamItems:
  - id: POAM-COFFEE-REPLAY-WINDOW-HARDENING
    riskRef: RISK-COFFEE-DEVICE-SPOOFING
    milestone: Enforce tighter telemetry replay window constraints
    dueDate: 2026-08-01
    status: planned
    responsibleRole: ACT-SECURITY-ANALYST
    artifacts:
    - path: tickets/SEC-3301.md
  trustBoundaries:
  - id: TB-COFFEE-EDGE-DEVICE
    name: Edge Device Boundary
    description: Boundary between managed edge devices and cloud control plane.
    boundaryType: device-network
    members:
    - FU-OTA-UPDATE-AGENT
    - FU-MACHINE-TELEMETRY-COLLECTION
    - DEP-COFFEE-EDGE-FLEET
  - id: TB-COFFEE-CLOUD-CONTROL
    name: Cloud Control Boundary
    description: Boundary between cloud app workloads and privileged platform controls.
    boundaryType: control-plane
    members:
    - FU-CLOUD-RUNTIME-OPERATIONS
    - FU-DEVICE-IDENTITY-SECRETS
    - DEP-COFFEE-CLOUD-PROD
  threatScenarios:
  - id: TS-COFFEE-MALICIOUS-OTA-BUNDLE
    title: Tampered firmware bundle executes on edge fleet
    summary: Attacker attempts to deliver malicious firmware by replacing or tampering rollout artifact.
    category: supply-chain
    stride: tampering
    cwe:
    - CWE-353
    attackVectorRef: AV-MALICIOUS-FIRMWARE-BUNDLE
    appliesTo:
    - FU-OTA-UPDATE-AGENT
    - FU-UPDATE-CAMPAIGN-ORCHESTRATION
    - REF-FIRMWARE-BUNDLE-STORE
    flowRefs:
    - FLOW-COFFEE-OTA-ROLLOUT
    entryPoint: IF-COFFEE-OTA-COMMAND
    preconditions:
    - signature-check-bypass
    - compromised-artifact-store
    exploitPath:
    - plan-campaign
    - execute-update
    likelihood: medium
    impact: high
    severity: high
    status: mitigating
    owner: ACT-SECURITY-ANALYST
    riskRef: RISK-COFFEE-MALICIOUS-OTA
    relatedControls:
    - CTRL-COFFEE-FIRMWARE-SIGNATURE
    assumptionRefs:
    - ASM-COFFEE-DEVICE-ROOT-OF-TRUST
    outOfScopeRefs:
    - OOS-COFFEE-HARDWARE-PHYSICAL-TAMPER
    mitigationRefs:
    - MIT-COFFEE-FW-SIGNATURE-VERIFY
    verificationRefs:
    - CV-COFFEE-FW-SIGNATURE-TEST
    detection:
    - signature-failure-rate
    - firmware-hash-mismatch
    evidence:
    - path: src/ota_agent.rs
      description: Firmware signature verification path.
  - id: TS-COFFEE-OTA-COMMAND-SPOOF
    title: Spoofed OTA command triggers unauthorized rollout
    summary: Unauthorized sender attempts to push OTA command messages to device fleet topic.
    category: command-abuse
    stride: spoofing
    cwe:
    - CWE-287
    attackVectorRef: AV-SPOOFED-DEVICE-IDENTITY
    appliesTo:
    - FU-UPDATE-CAMPAIGN-ORCHESTRATION
    - IF-COFFEE-OTA-COMMAND
    - FU-OTA-UPDATE-AGENT
    flowRefs:
    - FLOW-COFFEE-OTA-ROLLOUT
    entryPoint: IF-COFFEE-OTA-COMMAND
    preconditions:
    - identity-validation-gap
    exploitPath:
    - operator-schedules-rollout
    - execute-update
    likelihood: medium
    impact: high
    severity: high
    status: mitigating
    owner: ACT-SECURITY-ANALYST
    riskRef: RISK-COFFEE-DEVICE-SPOOFING
    relatedControls:
    - CTRL-COFFEE-DEVICE-IDENTITY
    mitigationRefs:
    - MIT-COFFEE-DEVICE-IDENTITY-ENFORCEMENT
    verificationRefs:
    - CV-COFFEE-DEVICE-IDENTITY-TEST
    detection:
    - unauthorized-topic-publish
    - certificate-anomaly
    evidence:
    - path: src/ota_agent.rs
      description: OTA command identity validation.
  - id: TS-COFFEE-TELEMETRY-REPLAY
    title: Telemetry replay inflates ingest and distorts reporting
    summary: Replayed telemetry bursts attempt to pollute fleet metrics and trigger false alerts.
    category: data-abuse
    stride: replay
    cwe:
    - CWE-294
    attackVectorRef: AV-TELEMETRY-REPLAY-ABUSE
    appliesTo:
    - FU-FLEET-INGESTION-API
    - DO-COFFEE-TELEMETRY-EVENT
    - FU-FLEET-OBSERVABILITY-REPORTING
    flowRefs:
    - FLOW-COFFEE-TELEMETRY-INGEST
    entryPoint: IF-COFFEE-TELEMETRY-INGEST
    preconditions:
    - weak-replay-window
    - duplicate-id-acceptance
    exploitPath:
    - collect-and-send-telemetry
    - ingest-telemetry
    - publish-fleet-observability
    likelihood: medium
    impact: medium
    severity: medium
    status: mitigating
    owner: ACT-SECURITY-ANALYST
    riskRef: RISK-COFFEE-TELEMETRY-REPLAY
    relatedControls:
    - CTRL-COFFEE-DEVICE-IDENTITY
    mitigationRefs:
    - MIT-COFFEE-TELEMETRY-REPLAY-WINDOW
    verificationRefs:
    - CV-COFFEE-TELEMETRY-REPLAY
    detection:
    - duplicate-event-id-alert
    - ingest-rate-anomaly
    evidence:
    - path: src/telemetry_ingest.ts
      description: Replay window and dedup logic.
  - id: TS-COFFEE-LOG-TAMPERING
    title: Audit log tampering suppresses OTA incident visibility
    summary: Adversary attempts to alter or suppress security-relevant logs to hide malicious behavior.
    category: observability-abuse
    stride: repudiation
    cwe:
    - CWE-778
    attackVectorRef: AV-LOG-TAMPERING
    appliesTo:
    - FU-FLEET-OBSERVABILITY-REPORTING
    - REF-CLOUD-LOGGING-SERVICE
    flowRefs:
    - FLOW-COFFEE-TELEMETRY-INGEST
    - FLOW-COFFEE-OTA-ROLLOUT
    entryPoint: FU-FLEET-OBSERVABILITY-REPORTING
    preconditions:
    - insufficient-log-immutability
    exploitPath:
    - report-outcome
    - publish-fleet-observability
    likelihood: low
    impact: high
    severity: medium
    status: identified
    owner: ACT-SECURITY-ANALYST
    riskRef: RISK-COFFEE-LOG-TAMPERING
    relatedControls:
    - CTRL-COFFEE-DEVICE-IDENTITY
    mitigationRefs:
    - MIT-COFFEE-AUDIT-IMMUTABILITY
    verificationRefs:
    - CV-COFFEE-AUDIT-INTEGRITY-ANALYSIS
    detection:
    - audit-gap-alert
    - log-write-authz-failure
    evidence:
    - path: docs/security/log-integrity-review.md
      description: Audit integrity assessment notes.
  threatAssumptions:
  - id: ASM-COFFEE-DEVICE-ROOT-OF-TRUST
    title: Device trust anchors are provisioned securely
    statement: Device trust anchors and certificates are provisioned via controlled manufacturing and onboarding process.
    status: accepted
    owner: ACT-SECURITY-ANALYST
    appliesTo:
    - FU-DEVICE-IDENTITY-SECRETS
    - FU-OTA-UPDATE-AGENT
    - TB-COFFEE-EDGE-DEVICE
    rationale: Secure provisioning path is audited by platform security and manufacturing controls.
    evidence:
    - path: docs/security/device-provisioning-trust.md
      description: Provisioning trust and key-injection process.
  threatOutOfScope:
  - id: OOS-COFFEE-HARDWARE-PHYSICAL-TAMPER
    title: Physical tamper resistance of device enclosure
    reason: Hardware anti-tamper sensor design and physical sealing are owned by hardware product teams.
    status: approved
    owner: ACT-SECURITY-ANALYST
    appliesTo:
    - DEP-COFFEE-EDGE-FLEET
    expiresOn: 2027-12-31
    evidence:
    - path: docs/security/hardware-shared-responsibility.md
      description: Hardware vs cloud security shared ownership statement.
  threatMitigations:
  - id: MIT-COFFEE-FW-SIGNATURE-VERIFY
    threatScenarioRef: TS-COFFEE-MALICIOUS-OTA-BUNDLE
    controlRef: CTRL-COFFEE-FIRMWARE-SIGNATURE
    status: verified
    effectiveness: high
    owner: ACT-SECURITY-ANALYST
    notes: OTA agent enforces signature verification with signer metadata checks.
    verificationRefs:
    - CV-COFFEE-FW-SIGNATURE-TEST
    evidence:
    - path: src/ota_agent.rs
      description: Signature validation implementation.
  - id: MIT-COFFEE-DEVICE-IDENTITY-ENFORCEMENT
    threatScenarioRef: TS-COFFEE-OTA-COMMAND-SPOOF
