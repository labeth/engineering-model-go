schemaVersion: 2
decisions:
- id: ADR-COFFEE-001
  title: Separate brew coordination from temperature regulation
  status: accepted
  date: 2026-09-19
  context: The appliance needs an understandable beverage workflow while the heater control loop remains independently testable.
  decision: Model brew coordination and temperature regulation as nested software components with typed interaction messages.
  consequences:
  - Process views show the operator-visible sequence without hiding the temperature self-message.
  - Implementation and deployment views retain separate software responsibilities.
