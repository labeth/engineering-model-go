<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="VIEW-COMMUNICATION-title" viewBox="0 0 602 1204" data-source="examples/bedrock-pr-review-github-app-sample/engmod.yml" data-view="VIEW-COMMUNICATION">
  <title id="VIEW-COMMUNICATION-title">VIEW-COMMUNICATION — communication view</title>
  <metadata>source=examples/bedrock-pr-review-github-app-sample/engmod.yml; view=VIEW-COMMUNICATION; kind=communication</metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#455a64"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="36" y="30" font-family="sans-serif" font-size="18" font-weight="bold">VIEW-COMMUNICATION</text>
  <line x1="146" y1="122" x2="146" y2="416" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="264" text-anchor="middle" font-family="sans-serif" font-size="11">interacts_with: Developer push/update activity triggers pull request webhook events.</text>
  <line x1="456" y1="122" x2="456" y2="416" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="264" text-anchor="middle" font-family="sans-serif" font-size="11">interacts_with: Operates deployments, scaling controls, and runtime observability.</text>
  <line x1="456" y1="122" x2="146" y2="710" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">interacts_with: Rotates credentials and manages secure configuration lifecycle.</text>
  <line x1="146" y1="220" x2="456" y2="612" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">interacts_with: Reviews findings and gate decisions before merge.</text>
  <line x1="456" y1="220" x2="146" y2="514" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="362" text-anchor="middle" font-family="sans-serif" font-size="11">interacts_with: Maintains and evolves deterministic security checks.</text>
  <line x1="146" y1="416" x2="456" y2="514" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="460" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Forwards authenticated PR events for context assembly.</text>
  <line x1="146" y1="416" x2="146" y2="808" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="607" text-anchor="middle" font-family="sans-serif" font-size="11">calls: Receives webhook payload through signed API endpoint.</text>
  <line x1="456" y1="416" x2="146" y2="710" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="558" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Requires secure runtime configuration and credential access.</text>
  <line x1="456" y1="416" x2="456" y2="906" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="656" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Uses managed secret store for runtime credentials.</text>
  <line x1="146" y1="514" x2="146" y2="1102" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="803" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Evaluates repository policy and risk rules.</text>
  <line x1="456" y1="514" x2="146" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">writes: Persists normalized context payload.</text>
  <line x1="456" y1="514" x2="146" y2="612" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="558" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Sends normalized review context.</text>
  <line x1="456" y1="514" x2="146" y2="1004" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="754" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Fetches pull request files and metadata.</text>
  <line x1="456" y1="514" x2="456" y2="1004" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="754" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Uses the GitHub REST SDK to fetch pull request files and metadata.</text>
  <line x1="146" y1="612" x2="146" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="460" text-anchor="middle" font-family="sans-serif" font-size="11">reads: Reads normalized context before model call.</text>
  <line x1="146" y1="612" x2="456" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="460" text-anchor="middle" font-family="sans-serif" font-size="11">writes: Persists merged deterministic and AI findings.</text>
  <line x1="146" y1="612" x2="146" y2="514" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="558" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Merges deterministic policy findings with model output.</text>
  <line x1="146" y1="612" x2="456" y2="612" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="607" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Submits final findings for publication.</text>
  <line x1="146" y1="612" x2="146" y2="710" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="656" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Retrieves model configuration and safety settings.</text>
  <line x1="146" y1="612" x2="456" y2="808" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="705" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Requests model analysis for code review findings.</text>
  <line x1="456" y1="612" x2="456" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="460" text-anchor="middle" font-family="sans-serif" font-size="11">reads: Reads final findings for publication.</text>
  <line x1="456" y1="612" x2="146" y2="710" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="656" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Retrieves app credentials and redaction rules.</text>
  <line x1="456" y1="612" x2="456" y2="710" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="656" text-anchor="middle" font-family="sans-serif" font-size="11">calls: Calls publication API for check-run output.</text>
  <line x1="456" y1="612" x2="146" y2="1004" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="803" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Publishes check runs and inline review comments.</text>
  <line x1="146" y1="710" x2="146" y2="906" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="803" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Uses AWS SDK for Go clients to load managed secret configuration.</text>
