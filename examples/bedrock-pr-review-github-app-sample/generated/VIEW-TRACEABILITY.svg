  <text x="456" y="460" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Evaluates repository policy and risk rules.</text>
  <line x1="146" y1="318" x2="456" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="313" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Sends normalized review context.</text>
  <line x1="146" y1="318" x2="456" y2="612" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="460" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Fetches pull request files and metadata.</text>
