  <text x="146" y="509" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Uses the GitHub REST SDK to fetch pull request files and metadata.</text>
  <line x1="456" y1="318" x2="146" y2="122" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">deployed_to: Orchestration executes in primary lambda runtime.</text>
  <line x1="456" y1="318" x2="456" y2="220" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="264" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Merges deterministic policy findings with model output.</text>
  <line x1="456" y1="318" x2="146" y2="416" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="362" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Submits final findings for publication.</text>
  <line x1="456" y1="318" x2="456" y2="416" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="362" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Retrieves model configuration and safety settings.</text>
  <line x1="456" y1="318" x2="146" y2="514" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Requests model analysis for code review findings.</text>
  <line x1="146" y1="416" x2="456" y2="416" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Retrieves app credentials and redaction rules.</text>
  <line x1="146" y1="416" x2="456" y2="612" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="509" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Publishes check runs and inline review comments.</text>
