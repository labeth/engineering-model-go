  <title id="VIEW-TRACEABILITY-title">VIEW-TRACEABILITY — traceability view</title>
  <metadata>source=examples/bedrock-pr-review-github-app-sample/engmod.yml; view=VIEW-TRACEABILITY; kind=traceability</metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#455a64"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="36" y="30" font-family="sans-serif" font-size="18" font-weight="bold">VIEW-TRACEABILITY</text>
  <line x1="456" y1="122" x2="146" y2="122" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="117" text-anchor="middle" font-family="sans-serif" font-size="11">deployed_to: Webhook ingress executes in primary lambda runtime.</text>
  <line x1="456" y1="122" x2="146" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Forwards authenticated PR events for context assembly.</text>
  <line x1="146" y1="220" x2="456" y2="416" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="313" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Requires secure runtime configuration and credential access.</text>
  <line x1="146" y1="220" x2="146" y2="612" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Uses managed secret store for runtime credentials.</text>
