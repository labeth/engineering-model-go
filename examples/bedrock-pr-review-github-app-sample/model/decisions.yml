schemaVersion: 2
decisions:
- id: ADR-PRR-001
  title: Separate webhook ingress from review orchestration
  status: accepted
  date: 2026-04-29
  context: 'GitHub webhook handling has different trust-boundary and failure-mode concerns than AI review

    orchestration and publication back to GitHub.

    '
  decision: 'Model webhook ingress, review orchestration, policy checks, and publication as separate

    functional units with explicit interface and flow relationships.

    '
  consequences:
  - Signature verification and event intake stay isolated from Bedrock review behavior.
  - Deterministic policy checks can be traced independently from AI-generated findings.
  - Review publication contracts remain visible as a separate integration boundary.
- id: DEC-TIER-MVP
  title: bedrock pr review github app sample runs at the mvp tier with the foundation bundle
  status: accepted
  date: 2026-11-12
  context: The example is a complete model at one stated tier so that the required lifecycle switches (ADR-EMG-061) are met and its generated artifacts show the diagnostics of that tier.
  decision: |-
    Tier: MVP
    Bundles: foundation
    The example declares lifecycle tier mvp with requirementLinks strict and lintRun mode strict.
  consequences:
  - The strict requirement link rules apply from the mvp tier.
  - The tier rules of mvp key the severity of the example's findings.
