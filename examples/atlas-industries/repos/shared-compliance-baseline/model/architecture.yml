schemaVersion: 2
architecture:
  functionalGroups:
  - id: FG-COMP
    name: Compliance Assurance
    description: Shared control and evidence lifecycle.
  functionalUnits:
  - id: FU-COMP-EVIDENCE
    name: Compliance Evidence Service
    group: FG-COMP
    prose: Collects, retains, and reports control assessment evidence.
  - id: FU-COMP-PEOPLE
    name: People Security and Awareness
    group: FG-COMP
    prose: Governs screening, employment responsibilities, awareness training, role changes, and offboarding.
  actors:
  - id: ACT-EMPLOYEE
    name: Employee
    description: Completes policy acknowledgment and security awareness obligations.
  - id: ACT-LINE-MANAGER
    name: Line Manager
    description: Initiates and confirms role-change access reviews.
  - id: ACT-PEOPLE-OPERATIONS
    name: People Operations Partner
    description: Coordinates personnel screening, employment records, and offboarding.
  - id: ACT-COMP-OFFICER
    name: Compliance Officer
    description: Approves controls and remediation plans.
  dataObjects:
