    - iso-27001
    retention: 2555_days
    confidentiality: high
    integrity: high
    availability: medium
  - id: DO-COMP-PERSONNEL-RECORD
    name: Personnel Lifecycle Record
    termRef: DATA-PERSONNEL-RECORD
    sensitivity: restricted
    classification: personal
    regulatoryTags:
    - nist-800-53
    - iso-27001
    retention: employment_plus_7_years
    confidentiality: high
    integrity: high
    availability: medium
  - id: DO-COMP-TRAINING-RECORD
    name: Security Awareness Training Record
    termRef: DATA-TRAINING-RECORD
    sensitivity: internal
    classification: assurance
    regulatoryTags:
    - nist-800-53
    - iso-27001
    retention: 2555_days
    confidentiality: medium
    integrity: high
    availability: medium
  contract:
    provides:
