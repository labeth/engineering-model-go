schemaVersion: 2
decisions:
- id: ADR-COMP-001
  title: Model the company baseline as a reusable module
  status: accepted
  date: 2026-09-19
  context: Every product must demonstrate the same foundational controls.
  decision: Publish control implementations, verification, evidence, risk, and POA&M together.
  consequences:
  - Products allocate assurance requirements to one stable contract.
- id: ADR-COMP-002
  title: Centralize employee lifecycle controls
  status: accepted
  date: 2026-09-19
  context: Personnel screening, awareness training, role changes, and offboarding are company responsibilities shared by every
    product.
  decision: Model people-security controls once in the shared compliance module and inherit them through the company control-baseline
    capability.
  consequences:
  - Products reuse consistent organizational controls and evidence without copying human-resources processes.
- id: DEC-TIER-MVP
  title: shared compliance baseline runs at the mvp tier with the foundation bundle
  status: accepted
  date: 2026-11-12
  context: The example is a complete model at one stated tier so that the required lifecycle switches (ADR-EMG-061) are met and its generated artifacts show the diagnostics of that tier.
  decision: |-
    Tier: MVP
    Bundles: foundation
    The example declares lifecycle tier mvp with requirementLinks strict and lintRun mode strict.
  consequences:
  - The strict requirement link rules apply from the mvp tier.
  - The tier rules of mvp key the severity of the example's findings.
