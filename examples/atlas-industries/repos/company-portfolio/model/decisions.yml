schemaVersion: 3
decisions:
- id: ADR-PORT-001
  title: Compose products through published contracts
  status: accepted
  date: 2026-09-19
  context: Portfolio governance must not depend on product internals.
  decision: Allocate company requirements only to product contract capabilities.
  consequences:
  - Products and shared modules can version independently behind stable contracts.
- id: DEC-TIER-MVP
  title: company portfolio runs at the mvp tier with the foundation bundle
  status: accepted
  date: 2026-11-12
  context: The example is a complete model at one stated tier so that the required lifecycle switches (ADR-EMG-061) are met and its generated artifacts show the diagnostics of that tier.
  decision: |-
    Tier: MVP
    Bundles: foundation
    The example declares lifecycle tier mvp with requirementLinks strict and lintRun mode strict.
  consequences:
  - The strict requirement link rules apply from the mvp tier.
  - The tier rules of mvp key the severity of the example's findings.
