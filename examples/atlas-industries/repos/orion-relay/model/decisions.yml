schemaVersion: 3
decisions:
- id: ADR-ORI-001
  title: Keep adaptive radio scheduling product-specific
  status: accepted
  date: 2026-09-19
  context: Orion radio behavior and constrained-link scheduling define product differentiation.
  decision: Reuse company platforms while retaining link scheduling and routing locally.
  consequences:
  - Shared controls evolve independently from radio algorithms.
- id: DEC-TIER-MVP
  title: orion relay runs at the mvp tier with the foundation bundle
  status: accepted
  date: 2026-11-12
  context: The example is a complete model at one stated tier so that the required lifecycle switches (ADR-EMG-061) are met and its generated artifacts show the diagnostics of that tier.
  decision: |-
    Tier: MVP
    Bundles: foundation
    The example declares lifecycle tier mvp with requirementLinks strict and lintRun mode strict.
  consequences:
  - The strict requirement link rules apply from the mvp tier.
  - The tier rules of mvp key the severity of the example's findings.
