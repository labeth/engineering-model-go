schemaVersion: 3
decisions:
- id: ADR-CLOUD-001
  title: Use a shared event-driven cloud foundation
  status: accepted
  date: 2026-09-19
  context: Product services need consistent resilience and observability.
  decision: Publish event ingestion and managed runtime as a reusable module.
  consequences:
  - Products share operational controls while retaining separate data domains.
- id: DEC-TIER-MVP
  title: shared cloud platform runs at the mvp tier with the foundation bundle
  status: accepted
  date: 2026-11-12
  context: The example is a complete model at one stated tier so that the required lifecycle switches (ADR-EMG-061) are met and its generated artifacts show the diagnostics of that tier.
  decision: |-
    Tier: MVP
    Bundles: foundation
    The example declares lifecycle tier mvp with requirementLinks strict and lintRun mode strict.
  consequences:
  - The strict requirement link rules apply from the mvp tier.
  - The tier rules of mvp key the severity of the example's findings.
