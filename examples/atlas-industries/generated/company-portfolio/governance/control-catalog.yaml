controls:
- id: aegis::CTRL-AEG-TRACK-CONFIDENCE
  title: Track Confidence Gate
  objective: Requires multi-sensor confidence before operator presentation.
  group: mission-integrity
  assessment-requirements:
  - id: aegis::CV-AEG-TRACK-CONFIDENCE
    text: The control "Track Confidence Gate" MUST be verified by test.
    applicability:
    - all-systems
    recommendation: Single-source false observations were rejected.
    state: Active
  guidelines:
  - entries:
    - reference-id: GL-mission-integrity
    reference-id: ENGMOD-GUIDANCE-CATALOG
  threats:
  - entries:
    - reference-id: aegis::TS-AEG-SENSOR-SPOOF
    reference-id: ENGMOD-THREAT-CATALOG
  state: Active
- id: orion::CTRL-ORI-ADMISSION
  title: Priority Admission Control
  objective: Reserves capacity for authenticated priority messages.
  group: availability
  assessment-requirements:
  - id: orion::CV-ORI-ADMISSION
    text: The control "Priority Admission Control" MUST be verified by test.
    applicability:
    - all-systems
    recommendation: Single-band priority traffic remained available during flooding.
    state: Active
  guidelines:
  - entries:
    - reference-id: GL-availability
    reference-id: ENGMOD-GUIDANCE-CATALOG
  state: Active
