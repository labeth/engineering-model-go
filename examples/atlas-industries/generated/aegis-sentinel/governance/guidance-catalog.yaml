guidelines:
- id: GL-mission-integrity
  title: Mission-Integrity Guidance
  objective: Design, implement, and verify mission-integrity controls so their objectives are demonstrably met.
  group: control-guidance
  recommendations:
  - Define a verifiable assessment requirement for each control objective.
  - Capture objective evidence for every assessment.
  principles:
