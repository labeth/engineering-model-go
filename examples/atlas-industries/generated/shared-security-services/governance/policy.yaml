  date: "2026-09-19T00:00:00Z"
  description: Security policy for Atlas Shared Security Services
  author:
    id: atlas-industries
    name: Atlas Industries
    type: Human
  mapping-references:
  - id: ENGMOD-CONTROL-CATALOG
    title: Control Catalog
    version: 1.1.0
  - id: ENGMOD-GUIDANCE-CATALOG
    title: Guidance Catalog
    version: 1.1.0
  - id: ENGMOD-RISK-CATALOG
    title: Risk Catalog
    version: 1.1.0
contacts:
  responsible:
  - name: Atlas Industries
  accountable:
  - name: Atlas Industries
scope:
