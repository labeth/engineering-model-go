title: "Atlas Shared Cloud Platform - Security Policy"
metadata:
  id: atlas-shared-cloud-platform-POLICY
  type: Policy
  gemara-version: 1.1.0
  version: v0.1.0
  date: "2026-09-19T00:00:00Z"
  description: Security policy for Atlas Shared Cloud Platform
  author:
    id: atlas-industries
    name: Atlas Industries
    type: Human
  mapping-references:
  - id: ENGMOD-CONTROL-CATALOG
    title: Control Catalog
    version: 1.1.0
  - id: ENGMOD-GUIDANCE-CATALOG
    title: Guidance Catalog
    version: 1.1.0
  - id: ENGMOD-RISK-CATALOG
    title: Risk Catalog
    version: 1.1.0
contacts:
  responsible:
  - name: Atlas Industries
  accountable:
  - name: Atlas Industries
scope:
  in:
    technologies:
    - https
    sensitivity:
    - product-operations
    users:
    - Cloud Operator
imports:
  catalogs:
  - reference-id: ENGMOD-CONTROL-CATALOG
  guidance:
  - reference-id: ENGMOD-GUIDANCE-CATALOG
implementation-plan:
  evaluation-timeline:
    start: "2026-09-19T00:00:00Z"
    notes: Controls are evaluated continuously from inferred verification.
  enforcement-timeline:
    start: "2026-09-19T00:00:00Z"
    notes: Non-compliant changes are gated and remediated via POA&M.
adherence:
  evaluation-methods:
  - id: EM-INTENT
    type: Intent
    mode: Automated
    required: true
    description: Static analysis of code, configuration, and test evidence.
  - id: EM-BEHAVIORAL
    type: Behavioral
    mode: Manual
    required: false
    description: Exercise and review of runtime behavior.
  enforcement-methods:
  - id: ENM-GATE
    type: Gate
    mode: Automated
    required: true
    description: Preventive change-control gate.
  - id: ENM-REMEDIATION
    type: Remediation
    mode: Manual
    required: false
    description: Remediation tracked via POA&M.
  non-compliance: Non-compliant findings are tracked as POA&M items with an owner and due date; unresolved high-severity findings block release.
