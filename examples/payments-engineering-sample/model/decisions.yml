schemaVersion: 3
decisions:
- id: ADR-PAY-001
  title: Keep payment authorization separate from checkout handling
  status: accepted
  date: 2026-04-29
  context: 'Checkout handling owns the customer-facing payment journey, while payment authorization owns

    transaction decisions that depend on fraud scoring and external bank behavior.

    '
  decision: 'Model checkout handling and payment authorization as separate functional units with explicit

    calls and dependency mappings between them.

    '
  consequences:
  - Customer messaging can remain stable while authorization logic changes independently.
  - Fraud scoring and support review stay closer to authorization decisions than UI flow.
  - Traceability can distinguish customer experience requirements from transaction decision requirements.
- id: DEC-TIER-MVP
  title: payments engineering sample runs at the mvp tier with the foundation bundle
  status: accepted
  date: 2026-11-12
  context: The example is a complete model at one stated tier so that the required lifecycle switches (ADR-EMG-061) are met and its generated artifacts show the diagnostics of that tier.
  decision: |-
    Tier: MVP
    Bundles: foundation
    The example declares lifecycle tier mvp with requirementLinks strict and lintRun mode strict.
  consequences:
  - The strict requirement link rules apply from the mvp tier.
  - The tier rules of mvp key the severity of the example's findings.
