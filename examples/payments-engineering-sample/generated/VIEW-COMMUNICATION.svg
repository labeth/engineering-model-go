<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="VIEW-COMMUNICATION-title" viewBox="0 0 602 910" data-source="examples/payments-engineering-sample/engmod.yml" data-view="VIEW-COMMUNICATION">
  <title id="VIEW-COMMUNICATION-title">VIEW-COMMUNICATION — communication view</title>
  <metadata>source=examples/payments-engineering-sample/engmod.yml; view=VIEW-COMMUNICATION; kind=communication</metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#455a64"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="36" y="30" font-family="sans-serif" font-size="18" font-weight="bold">VIEW-COMMUNICATION</text>
  <line x1="146" y1="122" x2="146" y2="416" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="264" text-anchor="middle" font-family="sans-serif" font-size="11">interacts_with: Submits payment at checkout.</text>
  <line x1="456" y1="122" x2="456" y2="514" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="313" text-anchor="middle" font-family="sans-serif" font-size="11">interacts_with: Performs manual payment reviews.</text>
  <line x1="146" y1="416" x2="146" y2="220" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="313" text-anchor="middle" font-family="sans-serif" font-size="11">reads: Reads final authorization decision for user-facing response.</text>
  <line x1="146" y1="416" x2="456" y2="220" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="313" text-anchor="middle" font-family="sans-serif" font-size="11">writes: Persists normalized authorization request.</text>
  <line x1="146" y1="416" x2="456" y2="416" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Delegates payment authorization.</text>
  <line x1="146" y1="416" x2="456" y2="612" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="509" text-anchor="middle" font-family="sans-serif" font-size="11">calls: Receives and validates checkout request payload.</text>
  <line x1="456" y1="416" x2="146" y2="220" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="313" text-anchor="middle" font-family="sans-serif" font-size="11">writes: Persists final authorization decision.</text>
  <line x1="456" y1="416" x2="456" y2="220" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="313" text-anchor="middle" font-family="sans-serif" font-size="11">reads: Reads normalized request for authorization pipeline.</text>
  <line x1="456" y1="416" x2="146" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="362" text-anchor="middle" font-family="sans-serif" font-size="11">reads: Reads manual review outcome before returning decision.</text>
  <line x1="456" y1="416" x2="456" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="362" text-anchor="middle" font-family="sans-serif" font-size="11">reads: Reads risk signal before final authorization decision.</text>
  <line x1="456" y1="416" x2="146" y2="514" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="460" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Requests fraud scoring before final authorization.</text>
  <line x1="456" y1="416" x2="456" y2="514" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="460" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Escalates high-risk payments for manual review.</text>
  <line x1="456" y1="416" x2="146" y2="612" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="509" text-anchor="middle" font-family="sans-serif" font-size="11">calls: Calls external bank authorization interface.</text>
  <line x1="456" y1="416" x2="146" y2="710" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="558" text-anchor="middle" font-family="sans-serif" font-size="11">calls: Calls risk scoring interface for fraud decision support.</text>
  <line x1="456" y1="416" x2="456" y2="710" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="558" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Calls external bank authorization endpoint.</text>
  <line x1="146" y1="514" x2="456" y2="220" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="362" text-anchor="middle" font-family="sans-serif" font-size="11">reads: Reads normalized request to compute risk signal.</text>
  <line x1="146" y1="514" x2="456" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">publishes: Publishes risk signal updates for downstream consumers.</text>
  <line x1="146" y1="514" x2="456" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">writes: Persists computed risk signal.</text>
  <line x1="146" y1="514" x2="146" y2="808" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="146" y="656" text-anchor="middle" font-family="sans-serif" font-size="11">depends_on: Uses external library for audit persistence.</text>
  <line x1="456" y1="514" x2="146" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="301" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">writes: Persists manual review ticket records.</text>
  <line x1="456" y1="514" x2="456" y2="318" stroke="#455a64" marker-end="url(#arrow)"/>
  <text x="456" y="411" text-anchor="middle" font-family="sans-serif" font-size="11">subscribes: Subscribes to high-risk signal updates.</text>
