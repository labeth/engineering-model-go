schemaVersion: 2
architecture:
  functionalGroups:
  - id: FG-MODEL-AUTHORING
    name: Model Authoring
    description: Inputs and model loading responsibilities.
    prose: Maintains authored architecture, requirements, design, and catalog handling.
  - id: FG-VALIDATION-ANALYSIS
    name: Validation and Analysis
    description: Validation and inference responsibilities.
    prose: Performs consistency checks and derives runtime, code, and verification evidence.
  - id: FG-ARTIFACT-GENERATION
    name: Artifact Generation
    description: Publication and exchange artifact generation.
    prose: Produces AsciiDoc publication docs and external modeling outputs.
  - id: FG-TRACEABILITY-COMPLIANCE
    name: Traceability and Compliance
    description: Trace and compliance export responsibilities.
    prose: Produces TRLC, LOBSTER, and OSCAL outputs from modeled content.
  - id: FG-MCP-INTEGRATION
    name: MCP Integration
    description: AI-agent integration and runtime API responsibilities.
    prose: Exposes model-aware tools over MCP with strict input and error contracts.
  functionalUnits:
  - id: FU-MODEL-LOADER
    name: Model Loader
    group: FG-MODEL-AUTHORING
    prose: Validates canonical YAML against the authoritative CUE contract before strict Go decoding and normalization.
  - id: FU-VALIDATION-ENGINE
    name: Validation Engine
    group: FG-VALIDATION-ANALYSIS
    prose: Validates authored entities, IDs, references, and mapping consistency.
  - id: FU-CODEMAP-INFERENCE
    name: Codemap Inference
    group: FG-VALIDATION-ANALYSIS
    prose: Infers code/runtime ownership and verification links from source and tests.
  - id: FU-CODE-HEALTH
    name: Code health analysis
    group: FG-VALIDATION-ANALYSIS
    prose: Analyses source functions for maintainability smells, scores files with our own explainable model, rolls the scores
      up to functional units, requirements and the project, and checks new or worsened findings against a base revision.
  - id: FU-VIEW-PROJECTION
    name: View Projection
    group: FG-ARTIFACT-GENERATION
    prose: Builds projection graphs for architecture, traceability, security, and flow views.
  - id: FU-ASCIIDOC-GENERATOR
    name: AsciiDoc Generator
    group: FG-ARTIFACT-GENERATION
    prose: Renders architecture publication docs and view narratives for human consumption.
  - id: FU-THREAT-EXPORTER
    name: Threat Exporter
    group: FG-ARTIFACT-GENERATION
    prose: Exports Threat Dragon and Open OTM model artifacts.
  - id: FU-STRUCTURIZR-EXPORTER
    name: Structurizr Exporter
    group: FG-ARTIFACT-GENERATION
    prose: Emits Structurizr DSL and deployment-aware model views.
  - id: FU-SYSML-EXPORTER
    name: SysML Exporter
    group: FG-ARTIFACT-GENERATION
    prose: Generates SysML v2 textual and project interchange artifacts from the canonical semantic model while reporting
      conformance coverage.
  - id: FU-QUINT-EXPORTER
    name: Quint Exporter
    group: FG-ARTIFACT-GENERATION
    prose: Generates Quint specifications from behavior machines and runs or verifies them as formal evidence.
  - id: FU-NAF-EXPORTER
    name: NAF Exporter
    group: FG-ARTIFACT-GENERATION
    prose: Validates NAF 4.1 stakeholders, concerns, and viewpoint selections and renders architecture products from existing
      canonical views.
  - id: FU-TRLC-EXPORTER
    name: TRLC Exporter
    group: FG-TRACEABILITY-COMPLIANCE
    prose: Emits TRLC model and requirement artifacts.
  - id: FU-LOBSTER-EXPORTER
    name: LOBSTER Exporter
    group: FG-TRACEABILITY-COMPLIANCE
    prose: Generates LOBSTER traceability inputs and reports.
  - id: FU-OSCAL-EXPORTER
    name: OSCAL Exporter
    group: FG-TRACEABILITY-COMPLIANCE
    prose: Exports OSCAL System Security Plan (SSP), Assessment Results (AR), and Plan of Action and Milestones (POA&M).
  - id: FU-GEMARA-EXPORTER
    name: Gemara Exporter
    group: FG-TRACEABILITY-COMPLIANCE
    prose: Renders OpenSSF Gemara L1-L7 catalogs and logs (vector, principle, guidance, control, capability, threat, risk,
      evaluation, enforcement, audit) with an optional OSCAL catalog and assessment-results bridge, validated by the Gemara
      SDK.
  - id: FU-AIRBORNE-ASSURANCE-EXPORTER
    name: Airborne Assurance Exporter
    group: FG-TRACEABILITY-COMPLIANCE
    prose: Validates aviation assurance evidence-readiness profiles and generates clearly marked draft lifecycle-data indexes,
      trace matrices, gap reports, and certification-support summaries without claiming compliance or authority acceptance.
  - id: FU-SYSTEM-COMPOSITION
    name: System Composition
    group: FG-MODEL-AUTHORING
    prose: Resolves downward subsystem references from local paths, workspace replacements, or exact-version CUE modules
      fetched from OCI registries into the .engmod cache, and composes a federated system-of-systems model.
  - id: FU-ALLOCATION-TRACE
    name: Allocation Trace
    group: FG-TRACEABILITY-COMPLIANCE
    prose: Traces requirements across composed systems without modifying subsystem models - each child requirement up to the
      contract items it realizes, each system requirement down through its requirement links (pinned, fingerprinted and
      reviewed) to the child items and their realizing requirements - and rolls a system requirement up from its reviewed,
      unchanged links; materializes the deprecated allocations for one release.
  - id: FU-MCP-SERVER
    name: MCP Server
    group: FG-MCP-INTEGRATION
    prose: Serves model-backed tools over MCP with path safety and structured errors.
  - id: FU-CLI-ORCHESTRATION
    name: CLI Orchestration
    group: FG-MODEL-AUTHORING
    prose: Command entrypoints orchestrating model load, validation, generation, and exports.
  - id: FU-MODEL-CHANGE
    name: Model Change
    group: FG-MODEL-AUTHORING
    prose: Plans, validates, summarizes, and atomically applies typed stable-ID changes to authored model documents.
  actors:
  - id: ACT-ARCHITECTURE-AUTHOR
    name: Architecture Author
    description: Maintains modeled structure, mappings, and architecture intent.
  - id: ACT-IMPLEMENTATION-ENGINEER
    name: Implementation Engineer
    description: Implements code and tests guided by requirement support paths.
  - id: ACT-COMPLIANCE-ENGINEER
    name: Compliance Engineer
    description: Uses control/risk and traceability outputs for assurance workflows.
  - id: ACT-AI-AGENT
    name: AI Agent
    description: Uses MCP tools to plan and execute scoped implementation work.
  - id: ACT-CI-PIPELINE
    name: CI Pipeline
    description: Executes regression tests, validation checks, and artifact generation.
  referencedElements:
  - id: REF-GO-TOOLCHAIN
    kind: platform_service
    layer: code
    name: Go Toolchain
  - id: REF-THREAT-DRAGON-SCHEMAS
    kind: external_service_endpoint
    layer: runtime
    name: Threat Dragon Schemas
  - id: REF-OPEN-OTM-SCHEMA
    kind: external_service_endpoint
    layer: runtime
    name: Open OTM Schema
  - id: REF-STRUCTURIZR-VALIDATOR
    kind: external_service_endpoint
    layer: runtime
    name: Structurizr Validator
  - id: REF-SYSML-V2-TOOLCHAIN
    kind: external_service_endpoint
    layer: runtime
    name: Pinned SysML 2.0 / KerML 1.0 Toolchain
  - id: REF-CUE-OCI-MODULE-REGISTRY
    kind: external_service_endpoint
    layer: runtime
    name: CUE OCI Module Registry
  - id: REF-TRLC-TOOLCHAIN
    kind: external_service_endpoint
    layer: runtime
    name: TRLC Toolchain
  - id: REF-LOBSTER-TOOLCHAIN
    kind: external_service_endpoint
    layer: runtime
    name: LOBSTER Toolchain
  - id: REF-NAF-V4-1-SPECIFICATION
    kind: external_standard
    layer: architecture
    name: NATO Architecture Framework v4.1
