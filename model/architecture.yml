    endpoint: cmd/engsysml
    schemaRef: sysml_export.go
    owner: FU-SYSML-EXPORTER
  - id: IF-CLI-ENGNAF
    name: engnaf CLI
    protocol: cli
    endpoint: cmd/engnaf
    schemaRef: naf_export.go
    owner: FU-NAF-EXPORTER
  - id: IF-CLI-ENGTRLC
    name: engtrlc CLI
    protocol: cli
    endpoint: cmd/engtrlc
    schemaRef: trlc_export.go
    owner: FU-TRLC-EXPORTER
  - id: IF-CLI-ENGTRACE
    name: engtrace CLI
    protocol: cli
    endpoint: cmd/engtrace
    schemaRef: trace_matrix.go
    owner: FU-ALLOCATION-TRACE
  - id: IF-CLI-ENGGEMARA
    name: enggemara CLI
    protocol: cli
    endpoint: cmd/enggemara
    schemaRef: gemara_export.go
    owner: FU-GEMARA-EXPORTER
  - id: IF-CLI-ENGLOBSTER
    name: englobster CLI
    protocol: cli
    endpoint: cmd/englobster
    schemaRef: lobster_export.go
    owner: FU-LOBSTER-EXPORTER
  - id: IF-CLI-ENGOSCAL
    name: engoscal CLI
    protocol: cli
    endpoint: cmd/engoscal
    schemaRef: oscal_ssp.go
    owner: FU-OSCAL-EXPORTER
  - id: IF-CLI-ENGAIR
    name: engair CLI
    protocol: cli
    endpoint: cmd/engair
    schemaRef: airborne_assurance.go
    owner: FU-AIRBORNE-ASSURANCE-EXPORTER
  - id: IF-CLI-ENGVIEW
    name: engview CLI
    protocol: cli
    endpoint: cmd/engview
    schemaRef: view/project.go
    owner: FU-VIEW-PROJECTION
  - id: IF-CLI-ENGCHANGE
    name: engchange CLI
    protocol: cli
    endpoint: cmd/engchange
    schemaRef: requirements_delta.go
    owner: FU-MODEL-CHANGE
