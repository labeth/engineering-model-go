schemaVersion: 2
views:
- id: VIEW-ARCHITECTURE-INTENT
  kind: architecture-intent
  roots:
  - FG-MODEL-AUTHORING
  - FG-VALIDATION-ANALYSIS
  - FG-ARTIFACT-GENERATION
  - FG-TRACEABILITY-COMPLIANCE
  - FG-MCP-INTEGRATION
  authoredStatus: in-review
  authoredStatusExplanation: Initial repository self-model with stable top-level domains; implementation details will be expanded
    iteratively.
- id: VIEW-TRACEABILITY
  kind: traceability
  roots:
  - FU-MODEL-LOADER
  - FU-MODEL-CHANGE
  - FU-VALIDATION-ENGINE
  - FU-CODEMAP-INFERENCE
  - FU-TRLC-EXPORTER
  - FU-LOBSTER-EXPORTER
  authoredStatus: in-review
  authoredStatusExplanation: Traceability scope is seeded and will be tightened as requirements are added.
- id: VIEW-SECURITY
  kind: security
  roots:
  - FU-MCP-SERVER
  - AV-PATH-TRAVERSAL-IN-MCP
  - AV-SCHEMA-SUPPLY-CHAIN-TAMPER
  - CTRL-MCP-PATH-BOUNDARY
  - CTRL-STRICT-MCP-INPUT-SCHEMA
  authoredStatus: in-review
  authoredStatusExplanation: Security scope starts from MCP boundary and export-validation supply chain paths.
- id: VIEW-INTERACTION-FLOW
  kind: interaction-flow
  roots:
  - FLOW-MODEL-CHANGE-TO-VERIFIED-ARTIFACTS
  includeKinds:
  - flow
  - flow_step
  - actor
  - functional_unit
  - data_object
  includeMappings:
  - flow_next
  - flow_error
  - flow_async
  - flow_ref
  - contains
  - depends_on
  - reads
  - writes
  authoredStatus: draft
  authoredStatusExplanation: Core implementation workflow is captured to guide model-driven repository changes.
- id: VIEW-STATE-LIFECYCLE
  kind: state-lifecycle
  roots:
  - STATE-MODEL-INVALID
  includeKinds:
  - state
  - event
  - control
  includeMappings:
  - transitions_to
  - triggered_by
  - guarded_by
  authoredStatus: draft
  authoredStatusExplanation: Captures model validity and artifact freshness lifecycle behavior.
naf:
  framework: NAF
  version: '4.1'
  architectureDescription: Engineering Model Go NAF 4.1 Architecture Description
  stakeholders:
  - actorRef: ACT-ARCHITECTURE-AUTHOR
    role: Owns architecture scope, viewpoints, and model decisions.
  - actorRef: ACT-IMPLEMENTATION-ENGINEER
    role: Uses architecture products to implement and assess change impact.
  - actorRef: ACT-COMPLIANCE-ENGINEER
    role: Uses correspondence and evidence views for assurance.
  concerns:
  - id: NAF-CONCERN-ARCHITECTURE-COVERAGE
    name: Architecture coverage
    description: The architecture must communicate model responsibilities and generated products.
    stakeholderRefs:
    - ACT-ARCHITECTURE-AUTHOR
    - ACT-IMPLEMENTATION-ENGINEER
  - id: NAF-CONCERN-TRACEABILITY
    name: Architecture correspondence
    description: Requirements, implementation ownership, and verification evidence must remain traceable.
    stakeholderRefs:
    - ACT-ARCHITECTURE-AUTHOR
    - ACT-COMPLIANCE-ENGINEER
  - id: NAF-CONCERN-LIFECYCLE
    name: Generation lifecycle
    description: Model changes must progress through validation and deterministic artifact generation.
    stakeholderRefs:
    - ACT-ARCHITECTURE-AUTHOR
    - ACT-IMPLEMENTATION-ENGINEER
  products:
  - id: NAF-A2-ARCHITECTURE-PRODUCTS
    viewpoint: A2
    title: Engineering Model architecture products
    viewRef: VIEW-ARCHITECTURE-INTENT
    concernRefs:
    - NAF-CONCERN-ARCHITECTURE-COVERAGE
  - id: NAF-A3-ARCHITECTURE-CORRESPONDENCE
    viewpoint: A3
    title: Requirements and implementation correspondence
    viewRef: VIEW-TRACEABILITY
    concernRefs:
    - NAF-CONCERN-TRACEABILITY
  - id: NAF-L6-LOGICAL-SEQUENCE
    viewpoint: L6
    title: Model change to verified artifact sequence
    viewRef: VIEW-INTERACTION-FLOW
    concernRefs:
    - NAF-CONCERN-LIFECYCLE
  - id: NAF-P5-RESOURCE-STATES
    viewpoint: P5
    title: Model validation and artifact freshness states
    viewRef: VIEW-STATE-LIFECYCLE
    concernRefs:
    - NAF-CONCERN-LIFECYCLE
design:
  id: engineering-model-go-design
  title: Engineering Model Go Repository Design
  functionalGroups:
  - id: FG-MODEL-AUTHORING
    views:
      architecture_intent:
        title: Model Authoring Architecture Intent
        narrative: 'Model Authoring defines how authored architecture inputs remain stable and composable across the repository.

          It establishes document contracts for catalog, architecture, requirements, and design files.

          '
      communication:
        title: Model Authoring Communication
        narrative: 'Model Authoring coordinates loading and command entrypoints so downstream generation and validation receive
          normalized inputs.

          '
      deployment:
        title: Model Authoring Deployment
        narrative: 'Model Authoring is deployed as CLI and package boundaries that can evolve without disrupting validation
          and export engines.

          '
      security:
        title: Model Authoring Security
        narrative: 'Model Authoring enforces input sanity and reference consistency to reduce malformed model ingestion risk.

          '
      traceability:
        title: Model Authoring Traceability
        narrative: 'Model Authoring maintains stable IDs that anchor requirement and ownership traces across generated artifacts.

          '
  - id: FG-VALIDATION-ANALYSIS
    views:
      architecture_intent:
        title: Validation and Analysis Architecture Intent
        narrative: 'Validation and Analysis preserves model correctness and derives implementation evidence from repository
          artifacts.

          '
      communication:
        title: Validation and Analysis Communication
        narrative: 'Validation and Analysis exchanges diagnostics and inferred evidence with generation and MCP surfaces.

          '
      deployment:
        title: Validation and Analysis Deployment
        narrative: 'Validation and Analysis ships as shared libraries consumed by CLIs and server workflows.

          '
      security:
        title: Validation and Analysis Security
        narrative: 'Validation and Analysis defends against ambiguous references and stale traces through strict checks.

          '
      traceability:
        title: Validation and Analysis Traceability
        narrative: 'Validation and Analysis links requirements to code/runtime/test evidence for impact-oriented planning.

          '
  - id: FG-ARTIFACT-GENERATION
    views:
      architecture_intent:
        title: Artifact Generation Architecture Intent
        narrative: 'Artifact Generation turns modeled intent into publication and exchange outputs used by engineers and tools.

          '
      communication:
        title: Artifact Generation Communication
        narrative: 'Artifact Generation coordinates projections, templates, and exporters while preserving stable output contracts.

          '
      deployment:
        title: Artifact Generation Deployment
        narrative: 'Artifact Generation runs in local and CI contexts with deterministic output expectations.

          '
      security:
        title: Artifact Generation Security
        narrative: 'Artifact Generation validates output schema boundaries before publishing external artifacts.

          '
      traceability:
        title: Artifact Generation Traceability
        narrative: 'Artifact Generation carries stable IDs and evidence references into AI, docs, and exchange formats.

          '
  - id: FG-TRACEABILITY-COMPLIANCE
    views:
      architecture_intent:
        title: Traceability and Compliance Architecture Intent
        narrative: 'Traceability and Compliance ensures requirement lineage and assurance artifacts remain verifiable.

          '
      communication:
        title: Traceability and Compliance Communication
        narrative: 'Traceability and Compliance integrates requirement, test, and report surfaces through shared ID contracts.

          '
      deployment:
        title: Traceability and Compliance Deployment
        narrative: 'Traceability and Compliance components execute in export pipelines and are validated against external
          toolchains.

          '
      security:
        title: Traceability and Compliance Security
        narrative: 'Traceability and Compliance protects evidence integrity and detects drift in requirement-test links.

          '
      traceability:
        title: Traceability and Compliance Traceability
        narrative: 'Traceability and Compliance is the system-of-record path for requirement linkage quality.

          '
  - id: FG-MCP-INTEGRATION
    views:
      architecture_intent:
        title: MCP Integration Architecture Intent
        narrative: 'MCP Integration exposes model-aware APIs for AI agents with explicit tool contracts.

          '
      communication:
        title: MCP Integration Communication
        narrative: 'MCP Integration processes JSON-RPC requests and returns structured, schema-versioned tool payloads.

          '
      deployment:
        title: MCP Integration Deployment
        narrative: 'MCP Integration runs as stdio server endpoints invoked by agent runtimes.

          '
      security:
        title: MCP Integration Security
        narrative: 'MCP Integration enforces strict argument validation and repository path boundaries.

          '
      traceability:
        title: MCP Integration Traceability
        narrative: 'MCP Integration reports tool-specific IDs to keep agent actions tied to model entities.

          '
  functionalUnits:
  - id: FU-MODEL-LOADER
    group: FG-MODEL-AUTHORING
    views:
      architecture_intent:
        title: Model Loader Intent
        narrative: Validates schema-versioned canonical YAML inputs, resolves explicit companion-document references with
          legacy defaults, and assembles one normalized bundle.
      communication:
        title: Model Loader Communication
        narrative: Provides canonical model structures to validators, generators, and MCP handlers.
      deployment:
        title: Model Loader Deployment
        narrative: Shipped as reusable package APIs consumed by command entrypoints.
      security:
        title: Model Loader Security
        narrative: Rejects unknown fields, invalid cross-field constraints, invalid parsing states, and unresolved core model
          references with path-aware diagnostics.
      traceability:
        title: Model Loader Traceability
        narrative: Preserves stable ID fidelity from source YAML through runtime structures.
  - id: FU-VALIDATION-ENGINE
    group: FG-VALIDATION-ANALYSIS
    views:
      architecture_intent:
        title: Validation Engine Intent
        narrative: Enforces correctness of IDs, mappings, and cross-reference relationships.
      communication:
        title: Validation Engine Communication
        narrative: Emits diagnostics consumed by CLIs, CI, and MCP preflight logic.
      deployment:
        title: Validation Engine Deployment
        narrative: Runs as core library checks in local and CI execution paths.
      security:
        title: Validation Engine Security
        narrative: Blocks malformed or unsafe model transitions before downstream processing.
      traceability:
        title: Validation Engine Traceability
        narrative: Ensures requirement/entity links remain analyzable and deterministic.
  - id: FU-CODEMAP-INFERENCE
    group: FG-VALIDATION-ANALYSIS
    views:
      architecture_intent:
        title: Codemap Inference Intent
        narrative: Infers runtime/code/verification evidence to connect authored intent with implementation reality.
      communication:
        title: Codemap Inference Communication
        narrative: Supplies inferred ownership and trace candidates to documentation, MCP, and reporting flows.
      deployment:
        title: Codemap Inference Deployment
        narrative: Executes during generation and analysis workflows using repository-local sources.
      security:
        title: Codemap Inference Security
        narrative: Limits inference scope to trusted repo paths and evidence formats.
      traceability:
        title: Codemap Inference Traceability
        narrative: Converts TRLC-LINKS (requirement) and ENGMODEL-LINKS (model element) markers into stable evidence relationships,
          existence-checked and scoped to the owning model.
  - id: FU-VIEW-PROJECTION
    group: FG-ARTIFACT-GENERATION
    views:
      architecture_intent:
        title: View Projection Intent
        narrative: Projects architecture graphs for view-specific rendering and analysis.
      communication:
        title: View Projection Communication
        narrative: Delivers filtered entities and mappings to documentation and exports.
      deployment:
        title: View Projection Deployment
        narrative: Embedded as reusable generation pipeline functionality.
      security:
        title: View Projection Security
        narrative: Ensures views respect include/exclude boundaries and stable root scopes.
      traceability:
        title: View Projection Traceability
        narrative: Maintains link continuity across architecture, security, and traceability projections.
  - id: FU-ASCIIDOC-GENERATOR
    group: FG-ARTIFACT-GENERATION
    views:
      architecture_intent:
        title: AsciiDoc Generator Intent
        narrative: Renders authoritative human-facing architecture documents from modeled content.
      communication:
        title: AsciiDoc Generator Communication
        narrative: Integrates projections and design narratives into publication templates.
      deployment:
        title: AsciiDoc Generator Deployment
        narrative: Invoked through engdoc for local and CI document generation.
      security:
        title: AsciiDoc Generator Security
        narrative: Carries security model sections in deterministic, reviewable output format.
      traceability:
        title: AsciiDoc Generator Traceability
        narrative: Preserves requirement and evidence identifiers in generated docs.
  - id: FU-THREAT-EXPORTER
    group: FG-ARTIFACT-GENERATION
    views:
      architecture_intent:
        title: Threat Exporter Intent
        narrative: Converts modeled security content into Threat Dragon and Open OTM artifacts.
      communication:
        title: Threat Exporter Communication
        narrative: Maps flows, boundaries, threats, and controls into external schema structures.
      deployment:
        title: Threat Exporter Deployment
        narrative: Executed via engdragon with schema validation scripts in CI.
      security:
        title: Threat Exporter Security
        narrative: Protects export integrity through strict schema validation and deterministic mapping.
      traceability:
        title: Threat Exporter Traceability
        narrative: Maintains stable threat and control IDs through export outputs.
  - id: FU-STRUCTURIZR-EXPORTER
    group: FG-ARTIFACT-GENERATION
    views:
      architecture_intent:
        title: Structurizr Exporter Intent
        narrative: Projects architecture and deployment metadata into Structurizr DSL.
      communication:
        title: Structurizr Exporter Communication
        narrative: Builds templated DSL artifacts validated by external Structurizr tooling.
      deployment:
        title: Structurizr Exporter Deployment
        narrative: Runs via engstruct in local and CI validation pipelines.
      security:
        title: Structurizr Exporter Security
        narrative: Ensures exported topology reflects intended trust boundaries and relationships.
      traceability:
        title: Structurizr Exporter Traceability
        narrative: Preserves architecture IDs across DSL elements for cross-tool alignment.
  - id: FU-SYSML-EXPORTER
    group: FG-ARTIFACT-GENERATION
    views:
      architecture_intent:
        title: SysML Exporter Intent
        narrative: Projects the canonical semantic model into SysML v2 without introducing a parallel authoring vocabulary.
      communication:
        title: SysML Exporter Communication
        narrative: Resolves standard SysML and KerML concepts through one mapping registry and exposes engineering-specific
          concepts as typed extensions.
      deployment:
        title: SysML Exporter Deployment
        narrative: Runs through engsysml locally and in CI with deterministic textual and project interchange outputs.
      security:
        title: SysML Exporter Security
        narrative: Rejects unknown, duplicate, and lossy mappings before publishing an artifact with a conformance claim.
      traceability:
        title: SysML Exporter Traceability
        narrative: Preserves stable Engineering Model identifiers and emits executable coverage evidence for every mapped
          concept.
  - id: FU-NAF-EXPORTER
    group: FG-ARTIFACT-GENERATION
    views:
      architecture_intent:
        title: NAF Exporter Intent
        narrative: Applies NAF 4.1 stakeholder, concern, and viewpoint metadata to canonical model views without creating
          duplicate capability, service, logical, or resource concepts.
      communication:
        title: NAF Exporter Communication
        narrative: Generates deterministic architecture products organized by official NAF 4.1 viewpoint codes.
      deployment:
        title: NAF Exporter Deployment
        narrative: Runs through engnaf locally and in CI using the same YAML and CUE validated model as every other exporter.
      security:
        title: NAF Exporter Security
        narrative: Rejects unsupported framework versions, unknown viewpoint codes, and dangling stakeholder, concern, actor,
          or model-view references.
      traceability:
        title: NAF Exporter Traceability
        narrative: Preserves canonical IDs from each referenced Engmod view in the generated NAF architecture product.
  - id: FU-TRLC-EXPORTER
    group: FG-TRACEABILITY-COMPLIANCE
    views:
      architecture_intent:
        title: TRLC Exporter Intent
        narrative: Exports requirements and model metadata for formal traceability processing.
      communication:
        title: TRLC Exporter Communication
        narrative: Produces package and requirement artifacts consumed by LOBSTER and checks.
      deployment:
        title: TRLC Exporter Deployment
        narrative: Executed through engtrlc in CI and local assurance workflows.
      security:
        title: TRLC Exporter Security
        narrative: Enforces stable requirement IDs and deterministic formatting for downstream verification.
      traceability:
        title: TRLC Exporter Traceability
        narrative: Serves as canonical requirement export for trace-chain continuity.
  - id: FU-LOBSTER-EXPORTER
    group: FG-TRACEABILITY-COMPLIANCE
    views:
      architecture_intent:
        title: LOBSTER Exporter Intent
        narrative: Converts requirement and test link evidence into LOBSTER activity traces.
      communication:
        title: LOBSTER Exporter Communication
        narrative: Integrates TRLC outputs and inferred verification links for report generation.
      deployment:
        title: LOBSTER Exporter Deployment
        narrative: Runs through englobster and report scripts in validation workflows.
      security:
        title: LOBSTER Exporter Security
        narrative: Protects trace integrity by surfacing missing or inconsistent requirement coverage.
      traceability:
        title: LOBSTER Exporter Traceability
        narrative: Produces requirement-to-test visibility and coverage diagnostics.
  - id: FU-OSCAL-EXPORTER
    group: FG-TRACEABILITY-COMPLIANCE
    views:
      architecture_intent:
        title: OSCAL Exporter Intent
        narrative: Maps modeled controls, risks, and implementations into OSCAL system security plan, assessment results,
          and plan of action and milestones structures.
      communication:
        title: OSCAL Exporter Communication
        narrative: Publishes compliance-focused output for security and audit consumers.
      deployment:
        title: OSCAL Exporter Deployment
        narrative: Executed via engoscal as part of assurance pipelines.
      security:
        title: OSCAL Exporter Security
        narrative: Preserves control and risk semantics during model-to-OSCAL transformation.
      traceability:
        title: OSCAL Exporter Traceability
        narrative: Carries control references and evidence links into SSP outputs.
  - id: FU-MCP-SERVER
    group: FG-MCP-INTEGRATION
    views:
      architecture_intent:
        title: MCP Server Intent
        narrative: Exposes model-aware operations for AI agents using a stable tool contract.
      communication:
        title: MCP Server Communication
        narrative: Processes initialize/list/call JSON-RPC messages and returns structured payloads, including a compact machine-readable
          model authoring contract.
      deployment:
        title: MCP Server Deployment
        narrative: Runs as stdio server executable in local and automated agent environments.
      security:
        title: MCP Server Security
        narrative: Enforces strict schemas, panic containment, and repo-root path constraints.
      traceability:
        title: MCP Server Traceability
        narrative: Keeps tool results tied to stable architecture IDs for explainable agent actions.
  - id: FU-CLI-ORCHESTRATION
    group: FG-MODEL-AUTHORING
    views:
      architecture_intent:
        title: CLI Orchestration Intent
        narrative: Coordinates generation and validation command workflows from repo entrypoints.
      communication:
        title: CLI Orchestration Communication
        narrative: Connects user/CI invocation context to loader, validator, and exporter units.
      deployment:
        title: CLI Orchestration Deployment
        narrative: Shipped as command binaries under cmd for task-specific execution.
      security:
        title: CLI Orchestration Security
        narrative: Applies validation gates before producing or publishing artifacts.
      traceability:
        title: CLI Orchestration Traceability
        narrative: Maintains deterministic invocation paths for reproducible artifact updates.
  - id: FU-MODEL-CHANGE
    group: FG-MODEL-AUTHORING
    views:
      architecture_intent:
        title: Model Change Intent
        narrative: Provides a typed mutation boundary for authored model documents without duplicating model validation semantics.
      communication:
        title: Model Change Communication
        narrative: Accepts versioned stable-ID operations and returns deterministic summaries plus structured diagnostics.
      deployment:
        title: Model Change Deployment
        narrative: Runs through the engchange CLI or reusable Go API in local developer workflows.
      security:
        title: Model Change Security
        narrative: Rejects unknown fields, conflicting operations, stale source content, and invalid candidates before replacement.
      traceability:
        title: Model Change Traceability
        narrative: Links each mutation behavior to requirements and preserves stable identifiers through the YAML AST merge.
  - id: FU-SYSTEM-COMPOSITION
    group: FG-MODEL-AUTHORING
    views:
      architecture_intent:
        title: System Composition Intent
        narrative: Resolves a parent model's downward subsystem references into a federated system-of-systems from local paths,
          external git repositories, or exact-version CUE modules in OCI registries.
      communication:
        title: System Composition Communication
        narrative: Binds each subsystem's provides/requires contract to the parent's allocations and satisfactions without
          modifying the subsystem.
      deployment:
        title: System Composition Deployment
        narrative: Git repositories and OCI modules are materialized in the gitignored .engmod cache; an engmod.work.yml file
          can replace module paths with sibling repositories for offline multi-repository development.
      security:
        title: System Composition Security
        narrative: Enforces workspace boundaries, exact semantic versions, one source kind per dependency, CUE module identity,
          and acyclic references.
      traceability:
        title: System Composition Traceability
        narrative: Reports cycle, path-boundary, source-conflict, module-fetch, module-identity, missing-ref, clone-failed,
          and unsatisfied-require diagnostics for every subsystem reference.
  - id: FU-ALLOCATION-TRACE
    group: FG-TRACEABILITY-COMPLIANCE
    views:
      architecture_intent:
        title: Allocation Trace Intent
        narrative: Materializes parent-to-subsystem requirement delegation and the consolidated traceability matrix without
          modifying subsystem models.
      communication:
        title: Allocation Trace Communication
        narrative: Emits the TRACE-MATRIX.json (and CSV) linking each requirement to its code, verification, and delegated
          subsystem requirement.
      deployment:
        title: Allocation Trace Deployment
        narrative: Run via engtrace or as part of engdoc; fails the build on dangling code trace links.
      security:
        title: Allocation Trace Security
        narrative: Scopes code to the nearest enclosing model root so a parent never claims a child model's links.
      traceability:
        title: Allocation Trace Traceability
        narrative: Rolls up requirement status as implemented, verified, delegated, or orphan, and flags untraceable delegations.
  - id: FU-GEMARA-EXPORTER
    group: FG-TRACEABILITY-COMPLIANCE
    views:
      architecture_intent:
        title: Gemara Exporter Intent
        narrative: Renders the model into OpenSSF Gemara L1-L7 catalogs and logs validated by the Gemara SDK.
      communication:
        title: Gemara Exporter Communication
        narrative: Publishes vector, principle, guidance, control, capability, threat, risk, evaluation, enforcement, and
          audit documents, with an optional OSCAL catalog and assessment-results bridge.
      deployment:
        title: Gemara Exporter Deployment
        narrative: Executed via enggemara and exposed through the MCP gemara tools.
      security:
        title: Gemara Exporter Security
        narrative: Preserves control, threat, and risk semantics during model-to-Gemara transformation.
      traceability:
        title: Gemara Exporter Traceability
        narrative: Carries control-to-threat mappings and verification evidence into the Gemara evaluation and audit logs.
