    notes: 'ADR-EMG-069. behavior.requirement_unmodeled, row DDWWE. The requirement pattern comes from the EARS lint. Only a model that declares at least one machine is asked, and retired, rejected and derived requirements are exempt.'
    verificationMethods: [test]
    verificationCriteria: When a model has a machine and an event-driven requirement that no invariant lists and whose appliesTo names no machine, state, transition, event or flow, then behavior.requirement_unmodeled is reported for it; a model without machines, a retired requirement and a requirement listed by an invariant are not reported.
    appliesTo:
      - FU-VALIDATION-ENGINE
    realizes: [CAP-EMG-MODEL-VALIDATION]
  - id: REQ-EMG-173
    status: implemented
    text: When model updated event is received, the engineering model go shall report a machine without an invariant and an invariant without a current formal result.
    notes: 'ADR-EMG-069. behavior.machine_unverified, row DDWWE. A pass or fail result counts as current and a stale or not-run result does not. Without an evidence file only the missing invariant is reported.'
    verificationMethods: [test]
    verificationCriteria: When a machine has no invariant, or the formal evidence file holds no current result for one of its invariants, then behavior.machine_unverified is reported at the machine or the invariant; with no evidence file a machine with invariants is not reported.
    appliesTo:
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-174
    status: implemented
    text: When model updated event is received, the engineering model go shall keep every model link marker stacked above one declaration.
    notes: 'ADR-EMG-069. The scanner accumulated stacked trace link lines and overwrote stacked model link lines, so a second line hid the first and element to code coverage would have missed links. Both now accumulate, in the order written, without duplicates.'
    verificationMethods: [test]
    verificationCriteria: When two model link marker lines sit above one declaration, then the symbol carries the identifiers of both lines; a repeated identifier is kept once.
    appliesTo:
      - FU-CODEMAP-INFERENCE
    realizes: [CAP-EMG-TRACEABILITY]
  - id: REQ-EMG-175
    status: implemented
    text: When model updated event is received, the engineering model go shall report a functional unit, machine or software interface that no source code names.
    notes: 'ADR-EMG-069. code.unit_unlinked, code.machine_unlinked and code.interface_unlinked, row DDWEE. An element counts as named when an owner marker, a model link marker or a trace part marker in scanned non-test source carries its identifier. Actors, attack vectors, trust boundaries, threat scenarios, assumptions, out-of-scope entries, risks, POA&M items, deployment targets, decisions, catalog terms, views and imported alias elements are never asked. A model without a code root is not asked.'
    verificationMethods: [test]
    verificationCriteria: When a functional unit, a machine or a software interface has no source file or declaration that names it, then the matching code.*_unlinked code is reported once for the element with a remedy; an element named by an owner marker or a model link marker, an element listed in codeCoverage.exempt and an element of a kind that is never asked are not reported.
    appliesTo:
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-TRACEABILITY]
  - id: REQ-EMG-176
    status: implemented
    text: When model updated event is received, the engineering model go shall accept a recorded exemption for a model element that is deliberately not implemented in this repository.
    notes: 'ADR-EMG-069. codeCoverage.exempt in engmod.yml is a list of an element identifier, a reason and an accepted decision, shaped like a health waiver. A missing or unaccepted decision is the untiered error code.exemption_unjustified, and an exemption that matches no unlinked element is code.exemption_unused (a warning, an error at operational).'
    verificationMethods: [test]
    verificationCriteria: When an exemption names an unlinked element and an accepted decision, then that element is not reported and the exemption is used; an exemption whose decision is missing or not accepted is code.exemption_unjustified; an exemption that names no unlinked element is code.exemption_unused; an unknown key or a missing reason fails loading.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-TRACEABILITY]
  - id: REQ-EMG-177
    status: implemented
    text: When model updated event is received, the engineering model go shall accept a list of requirements on every machine state, transition and event.
    notes: 'ADR-EMG-069. The optional requirements field on a machine state, a machine transition and an event names the requirements the element exists for, like the requirements field of an invariant. An unknown requirement identifier is the same dangling reference error an invariant gets, and an unknown key is still rejected.'
    verificationMethods: [test]
    verificationCriteria: When a state, a transition or an event lists an existing requirement, then the model loads and the list is part of the authored element; an unknown requirement identifier is reported as a dangling reference naming the element; an unknown key or a list of the wrong type fails loading.
    appliesTo:
      - FU-MODEL-LOADER
    realizes: [CAP-EMG-MODEL-AUTHORING]
  - id: REQ-EMG-178
    status: implemented
    text: When model updated event is received, the engineering model go shall report a machine state, transition or event that lists no requirement.
    notes: 'ADR-EMG-069. behavior.state_unlinked, behavior.transition_unlinked and behavior.event_unlinked, row DDWWE. Only a model that declares at least one machine is asked, only events that a machine transition uses are asked, and an imported alias machine is skipped. The element is linked only by its own requirements list; an invariant of the machine does not link it. The remedy names the ef-behavior skill.'
    verificationMethods: [test]
    verificationCriteria: When a machine state, a machine transition or an event that a transition uses lists no requirement, then the matching behavior.*_unlinked code is reported once for the element with a remedy; an element with a non-empty list, a model without machines, an event that no transition uses and an imported alias machine are not reported.
    appliesTo:
      - FU-VALIDATION-ENGINE
    realizes: [CAP-EMG-MODEL-VALIDATION]
  - id: REQ-EMG-179
    status: implemented
    text: When model updated event is received, the engineering model go shall report a composition lock whose schema version is not the current one.
    notes: 'ADR-EMG-072, removal plan phase 1. composition.lock_schema_outdated is a core error: the lock file schema version is read and compared with the version the engine writes, and an older or missing version is an error whose remedy names engws bump and engws sync instead of a mode that still works. Before this the version was never checked.'
    verificationMethods: [test]
    verificationCriteria: When engmod.lock.yml has no schemaVersion or another one than the current version, then composition.lock_schema_outdated is reported at the lock with a remedy; a lock at the current version is not reported.
    appliesTo:
      - FU-SYSTEM-COMPOSITION
    realizes: [CAP-EMG-SYSTEM-COMPOSITION]
  - id: REQ-EMG-180
    status: implemented
    text: When model updated event is received, the engineering model go shall report a repository check template that cannot take the workspace root instead of checking the repository with the library.
    notes: 'ADR-EMG-072, removal plan phase 1. engine.check_template_stale replaces the silent fallback of engws check to the in-process library: a repository whose .github/engmod-check lacks workspace root support is reported with the remedy to upgrade the check template with engflow upgrade, and it is not checked by another route. A repository with no .github/engmod-check at all is checked by the library only when the caller names the in-process option.'
    verificationMethods: [test]
    verificationCriteria: When a checked repository has a .github/engmod-check whose source lacks the workspace root flag, then its result is the error engine.check_template_stale with a remedy and no library check runs for it; with the in-process option the library check runs; a repository with a current template is checked by it.
    appliesTo:
      - FU-CLI-ORCHESTRATION
    realizes: [CAP-EMG-SYSTEM-COMPOSITION]
  - id: REQ-EMG-181
    status: implemented
    text: When model updated event is received, the engineering model go shall report an engine pin of a repository that is older than the engine that checks it.
    notes: 'ADR-EMG-072, removal plan phase 1. engine.pin_outdated compares the engineering-model-go version in the go.mod of the repository check template with the engine version of the running binary and reports an older pin with the remedy to bump the pin. An unparsable version or a local replacement is not compared.'
    verificationMethods: [test]
    verificationCriteria: When the go.mod of .github/engmod-check pins an engine version older than the running engine, then engine.pin_outdated is reported with a remedy; an equal or newer pin, a replace directive and a missing go.mod are not reported.
    appliesTo:
      - FU-CLI-ORCHESTRATION
    realizes: [CAP-EMG-SYSTEM-COMPOSITION]
  - id: REQ-EMG-182
    status: implemented
    text: When model updated event is received, the engineering model go shall provide one name for every argument of every tool and command.
    notes: 'ADR-EMG-073, removal plan phase 3. The aliases of the tool arguments (id for the typed identifier arguments, reqId, name, q, file, env, left, right, task, leftSchemaRef, rightSchemaRef, leftInterfaceId, rightInterfaceId, path for document), the duplicate tool entities.list, the deprecated flag --allow-suspect of engws and the flag --out of engoscal are removed. An old name is rejected by the strict argument check like any unknown argument. The model fields BaseCatalogRef and Compatibility, the trace summary counters Verified and LinksSuspect and the unused inert code source literals are removed.'
    verificationMethods: [test]
    verificationCriteria: When a tool is called with a former alias, then the call is rejected as an unknown argument and names the canonical argument; a tool called with its canonical arguments works; engws bump and engoscal reject --allow-suspect and --out; the authoring contract, the trace summary and the generated trace matrices carry no Compatibility, Verified or LinksSuspect field.
    appliesTo:
      - FU-MCP-SERVER
      - FU-CLI-ORCHESTRATION
    realizes: [CAP-EMG-MCP-INTEGRATION]
  - id: REQ-EMG-183
    status: implemented
    text: When model updated event is received, the engineering model go shall report a dependency without a declared tier as an error and report an incomplete aviation assessment and an unreferenced catalog term by tier.
    notes: 'ADR-EMG-074, removal plan phase 5. composition.dependency_tier_unknown is a core error at every tier (a dependency that declares no life-cycle tier cannot be compared with this system). The aviation codes incomplete_credit_assessment and incomplete_safety_feedback are errors from mvp, like the other aviation floors. catalog.term_unreferenced is a warning below product and an error from product, so a strict catalog is not left with unused vocabulary at the tiers that require clean models.'
    verificationMethods: [test]
    verificationCriteria: When a composed model has a dependency that declares no lifecycle, then composition.dependency_tier_unknown is an error at every tier and no row or POA&M item changes it; the two aviation codes are deferred below mvp and errors from mvp; catalog.term_unreferenced is a warning at poc, prototype and mvp and an error at product and operational.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-SYSTEM-COMPOSITION
    realizes: [CAP-EMG-LIFECYCLE-POLICY]
  - id: REQ-EMG-184
    status: implemented
    text: When model updated event is received, the engineering model go shall reject a deprecated pinned fingerprint and a deprecated provides reference with an error that names the remedy.
    notes: 'ADR-EMG-075, removal plan phase 4. A requirement link that carries pinned.fingerprint is the error model.pinned_fingerprint_removed and a contract provides entry that carries ref is the error model.provides_ref_removed. Each is an untiered error whose message names the field to delete, instead of the warning pinned.fingerprint was or a bare strict-decoding error. The two requires ref lines of the Atlas examples are deleted because nothing reads them.'
    verificationMethods: [test]
    verificationCriteria: When a link pins a fingerprint, then model.pinned_fingerprint_removed is reported at the link with the remedy delete pinned.fingerprint; when a provides entry carries ref, then model.provides_ref_removed is reported with the remedy to use realizes; a link without a fingerprint and a provides entry without ref are not reported, and the Atlas examples carry no ref on requires.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-REQUIREMENT-LINKS]
