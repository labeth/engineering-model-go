  - id: REQ-EMG-135
    status: implemented
    text: When model updated event is received, the engineering model go shall load each machine authored in a behavior document with its variables, states, initial state, final states, transitions and invariants.
    notes: 'ADR-EMG-037. behavior.yml gains a first-class machines block: each machine has an id SM-*, an owner functional unit, variables (type Integer, Boolean or String, each with an initial value), states that keep their STATE-* IDs (optional final true), exactly one machine-level initial, transitions TR-* with from, to and an optional on event of behavior.events, an optional guard and an optional effect as short strings, and invariants INV-* linked to one or more REQ-* with a Boolean expression string. Strict decoding rejects unknown fields. Schema and loader land in v0.11.0 (ADR-EMG-044).'
    verificationMethods: [test]
    verificationCriteria: When a behavior document holds one machine with two variables, three states one of them final, an initial state, two transitions one with an event, guard and effect, and one invariant linked to two requirements, then the loaded model holds the machine with every field and ID; an unknown machine field is refused by strict decoding.
    appliesTo:
      - FU-MODEL-LOADER
    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-136
    status: implemented
    text: When model updated event is received, the engineering model go shall parse each machine expression text into a structured expression that records the position of any syntax error.
    notes: 'ADR-EMG-039. One small built-in parser reads the operators and, or, not, implies, ==, !=, <, <=, >, >=, +, -, *, the assignment :=, effect lists separated by ; and the predicate in_state(STATE-ID). The result is a stored expression tree, not text. The operator table is one shared Go table used by the parser, the validator and the Quint generator. A syntax error is a diagnostic at the field with the line and column. A unary minus is the operator neg. A source over 8192 bytes or nested deeper than 64 levels is a diagnostic, not a crash (ADR-EMG-045 item 38).'
    verificationMethods: [test]
    verificationCriteria: When a guard reads count < 3 and in_state(STATE-IDLE), an effect reads count := count + 1; flag := true and an invariant reads count >= 0 implies not flag, then each parses to the expected tree; when a guard has an unbalanced parenthesis or an unknown token, then the diagnostic names the field and the line and column of the error.
    appliesTo:
      - FU-MODEL-LOADER
    derived: true
    derivedRationale: 'Mechanism of REQ-EMG-138: the structured expression is what the machine rules, the Quint generator and the semantic projection read; no user asks for the parser as such.'
  - id: REQ-EMG-137
    status: implemented
    text: When model updated event is received, the engineering model go shall project each loaded machine into elements of the canonical semantic model.
    notes: 'ADR-EMG-037 and ADR-EMG-040. A machine becomes a state_definition, its states state_usage elements, its transitions transition relationships carrying triggers, guard and effect, and its invariants constraint_usage elements with a Boolean result feature, because the generated SysML binding gives constraint_usage no authorable expression property. The initial state and each final state are projected as succession relationships (machine_initial, machine_final). Stable model IDs are preserved, so the views need no machine-specific code; the SysML exporter renders machines with its own writer (REQ-EMG-137, ADR-EMG-045 item 18).'
    verificationMethods: [test]
    verificationCriteria: When a machine with three states, two transitions and one invariant is loaded, then the canonical model holds one state_definition, three state_usage elements, two transition relationships with their trigger, guard and effect, and one constraint_usage with a Boolean result feature, all under the stable model IDs, and the SysML export of that model still validates.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-SYSML-EXPORTER
    derived: true
    derivedRationale: 'Mechanism of REQ-EMG-135 and REQ-EMG-141: projecting a machine into the canonical semantic model lets the exporters and the Quint generator share one representation.'
  - id: REQ-EMG-138
    status: implemented
    text: When model updated event is received, the engineering model go shall validate each machine against the machine rules.
    notes: 'ADR-EMG-039 and ADR-EMG-043. Structural errors are always errors: a machine whose initial state is missing or is not one of its states (initial is a single field, so two initial states cannot be written), a final state with an outgoing transition (behavior.final_state_has_transitions), a transition whose from or to is not a state of the same machine, an on that is not a behavior event, an undeclared variable, a type mismatch, an operator not in the table, in_state naming a state of another machine, and a duplicate state, transition or invariant ID. Advisory codes follow the tier policy: behavior.machine_deadlock (a non-final state without outgoing transition), behavior.transition_nondeterministic (two transitions from one state on the same event, or both without an event, that have no guard or the same guard text), behavior.transition_no_trigger (a transition without on and without guard), behavior.invariant_unlinked (an invariant without a REQ-*).'
    verificationMethods: [test]
    verificationCriteria: When a machine has no initial state, an initial state that is not one of its states, a final state with an outgoing transition, a transition to a state of another machine, an unknown event, an undeclared variable and a string compared with <, then each is an error at its field; when a non-final state has no outgoing transition, two transitions leave one state on one event without guards, a transition has no event and no guard, and an invariant has no requirement, then each advisory code is reported at its path; a final state without outgoing transition and a well-formed machine report nothing.
    appliesTo:
      - FU-VALIDATION-ENGINE
    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-139
    status: implemented
    text: When model updated event is received, the engineering model go shall reject free-floating behavior states with a diagnostic that names the machines block.
    notes: 'ADR-EMG-038. Every state belongs to exactly one machine and STATE-* IDs are kept. The free-floating list and the transitions_to and triggered_by relationship types are removed in v0.11.0 (ADR-EMG-044): the loader rejects a document that still uses them, with no opt-in mode and no automatic migration; the diagnostic message names machines: and the owner rewrites the model by hand. The own model/behavior.yml of this repository is rewritten to machines (SM-MODEL-VALIDATION, SM-ARTIFACT-FRESHNESS, SM-LINK-LIFECYCLE).'
    verificationMethods: [test]
    verificationCriteria: When a behavior document lists states outside a machine, then loading fails with an error at behavior.states naming machines:; when a relationship has the type transitions_to or triggered_by, then loading fails with an error at that field naming machines:; a document with only a machines block reports neither.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-MODEL-LOADER
    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-140
    status: implemented
    text: When model updated event is received, the engineering model go shall report each advisory machine diagnostic with the severity of the project life-cycle tier.
    notes: 'ADR-EMG-043 (OWNER decision). behavior.machine_deadlock, behavior.transition_nondeterministic, behavior.transition_no_trigger and behavior.invariant_unlinked are keyed in TierPolicy with the hygiene row DDWWE: deferred at poc and prototype (a warning with the deferred flag, the off of the owner decision), warning at mvp and product, error at operational. Structural machine errors (REQ-EMG-138) are never keyed and stay errors at every tier. The Quint requirements by tier of ADR-EMG-043 (mvp: the generated modules are fresh; product: engquint check in run mode when machines exist; operational: verify mode for machines in safety or mission flows) are enforced by the gate steps of engineering-flow, not by the engine; this repository CI runs both modes for every model with machines whatever the tier (ADR-EMG-045 item 26).'
    verificationMethods: [test]
    verificationCriteria: When the four advisory codes are reported at tiers poc to operational, then each is deferred, deferred, warning, warning, error; without lifecycle each keeps its authored severity; a structural machine error stays an error at poc; the authoring contract tierPolicy lists the four rows.
    appliesTo:
