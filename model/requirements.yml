  - id: REQ-EMG-073
    status: implemented
    text: When generation run is requested, the engineering model go shall warn about each control verification status that lags its existing tests.
    notes: 'A control verification may name its tests in verificationRefs: inferred CODE identifiers of test declarations (CODE-<PATH>--<NAME>) or requirement IDs whose linked test entry points verify it; any other entry is the error model.invalid_control_verification_ref. verification.status_stale is a warning at the status of a control verification whose status is unset or not-run while a referenced test declaration exists in the scanned code or a referenced requirement is test linked, and at the status of a threat mitigation whose status is unset or planned while a control verification it references has such tests. The status stays authored. The AsciiDoc generation and the trace matrix both report it.'
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-MODEL-VALIDATION]
  - id: REQ-EMG-080
    status: implemented
    text: When workspace staging is requested, the engineering model go shall publish every workspace checkout into the local staging area in dependency order.
    notes: 'engws stage [--version-from manifest|tag] [--serve] [--addr] writes only under <root>/.engmod/staging, never inside a checkout. registry/<module path>/ holds each CUE module as an OCI image layout with the content cue mod publish would push (source kind git: the committed files from git ls-files with VCS metadata; kind self: the directory). goproxy/ is a GOPROXY file tree (<module>/@v/<version>.info, .mod, .zip and list) for each checkout with go.mod at its top, zipped from committed files. The version is module.version from engmod.yml; with --version-from tag HEAD must be at tag v<module.version>. A checkout cue mod publish would refuse (dirty tree, no source field, module path mismatch) is reported, and then nothing is staged. A consumer pinning a family module at another version than the staged one is warned about. CUE has no file registry, so --serve loads the layouts into an in-memory read-only OCI registry on a loopback address only and serves it in the foreground until interrupted. stage prints the gate environment: CUE_REGISTRY routes for the staged modules merged with the current CUE_REGISTRY (with --serve), GOPROXY=file://<staging>/goproxy,off, GONOPROXY=none, GONOSUMDB with the staged Go modules plus the current GONOSUMDB or GOPRIVATE, GOWORK=off and ENGMOD_WORK=off; no -mod flag.'
    verificationCriteria: When a family of interface, service and system git checkouts is staged with --serve, then the printed CUE_REGISTRY lets the system compose with the workspace off from the staged registry only and its lock check pass, the printed GOPROXY lets an outside consumer build against the staged Go module, and no checkout changes.
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-SYSTEM-COMPOSITION
    realizes: [CAP-EMG-SYSTEM-COMPOSITION]
  - id: REQ-EMG-081
    status: implemented
    text: When spec delta is requested, the engineering model go shall render OpenSpec spec delta text from the selected model requirements.
    notes: 'engmodel.RenderSpecDelta and RenderSpecDeltaFromModel, and the engspec CLI (--model, --ids or --prefix, --capability, --modified, --out), render ## ADDED (or MODIFIED) Requirements and per requirement a ### Requirement heading (title, else ID; a repeated title names its ID), the line <ID>: <model text> with whitespace collapsed and whole-word shall and must upper-cased, so it starts with the model text under the engineering-flow consistency normalization (lower case, collapsed whitespace, no backticks or trailing period), and one #### Scenario from verificationCriteria: GIVEN, WHEN and THEN bullets when the criteria are shaped [given …,] when …, then …; otherwise WHEN the requirement is verified and THEN the criteria. Requirements without shall or must, or without verificationCriteria, are returned as warnings; an unknown ID is an error.'
    verificationCriteria: Golden tests render a fixture and check SHALL capitalization and criteria shaping, and the engspec output for a sample model starts each REQ line with the model text and passes openspec validate --strict when the openspec CLI is available.
    appliesTo:
      - FU-MODEL-CHANGE
    realizes: [CAP-EMG-MODEL-CHANGE]
  - id: REQ-EMG-082
    status: implemented
    text: When model updated event is received, the engineering model go shall report each assurance record whose verification links disagree.
    notes: 'threat.verification_missing is a warning at a threat scenario''s verificationRefs when it omits a control verification that one of its threat mitigations (threatScenarioRef) lists in verificationRefs or that names the threat in threatScenarioRefs. mitigation.verification_control_mismatch is an error at a threat mitigation verificationRefs entry naming a control verification whose controlRef is another control than the mitigation''s controlRef. verification.unlinked is a warning at the verificationRefs of a control verification with method test and status pass or partial that has no verificationRefs, so no test declaration or requirement evidences it; analysis, inspection and other methods are evidenced by their evidence entries and are not reported. Imported alias::ID records are skipped. The AsciiDoc generation, the trace and model.diagnose report them through validation.'
    verificationCriteria: When a threat scenario omits a control verification its mitigation references, a mitigation references a control verification of another control, and a passing test control verification has no verificationRefs, then validation reports one warning, one error and one warning at those fields, and none once the links agree.
    appliesTo:
      - FU-VALIDATION-ENGINE
    realizes: [CAP-EMG-MODEL-VALIDATION]
  - id: REQ-EMG-083
    status: implemented
    text: When model updated event is received, the engineering model go shall warn at each control that the gemara evaluation log would mark for review.
    notes: 'gemara.control_needs_review is a warning at a control that the Gemara L5 evaluation log gives the result Needs Review: no control verification names it in controlRef, or at least one of its control verifications has a status that needs review (partial, planned, in-progress, review, needs-review) and none failed or has an unrecognized status, since Failed and Unknown outrank Needs Review in the log''s aggregate. validate.ClassifyVerificationStatus and validate.ControlNeedsReview are the one status mapping the evaluation log and the warning share. When a control without verification has a threat mitigation that references another control''s verification, the message names it ("<CV> verifies <other control>"); for a control whose verifications need review it names them with their status. Validation emits it, so the check path (engdoc, the trace, model.diagnose) reports it without rendering Gemara.'
    verificationCriteria: When a control has no control verification and its mitigation references a verification of another control, and another control has only a partial verification, then validation warns at both controls, naming the other control's verification and the partial verification, and the warned controls are exactly those the evaluation log marks Needs Review.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-GEMARA-EXPORTER
    realizes: [CAP-EMG-MODEL-VALIDATION]
  - id: REQ-EMG-084
    status: implemented
    text: When model updated event is received, the engineering model go shall infer implementation coverage from trace markers in comments of build and documentation artifacts.
    notes: 'The code scanner reads TRLC-LINKS, ENGMODEL-LINKS and ENGMODEL-OWNER-UNIT in # comment lines of files named Dockerfile or Containerfile or ending in .Dockerfile or .Containerfile, and in HTML comments (<!-- TRLC-LINKS: REQ-… -->, also spanning lines) that start a line outside fenced code blocks of .md and .markdown files. The markers apply to the whole file: it becomes one symbol with its file CODE identifier (CODE-<PATH>) that implements the linked requirements, never verifies them, also under tests/. Markers are optional: such a file without them yields no item and no code.missing_trlc_link. The module code scope applies, including git-ignored files and inferenceHints.exclude; an invalid requirement ID is code.invalid_trlc_link.'
    verificationCriteria: When a Dockerfile and a README.md carry TRLC-LINKS comments, then the trace matrix lists each as implementing code of the linked requirement, and a Dockerfile without markers adds no diagnostic.
    appliesTo:
      - FU-CODEMAP-INFERENCE
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-TRACEABILITY]
  - id: REQ-EMG-085
    status: implemented
    text: When model updated event is received, the engineering model go shall report each accepted assurance record that lacks an owner acceptance record.
    notes: 'A risk with status accepted or response accept, and a threat scenario with status accepted, must carry acceptedBy with actor (an existing ACT-* actor), date (a YYYY-MM-DD calendar date, parsed, so 2026-13-45 is rejected) and statement (the owner''s own words) or decisionRef (an existing decision with status accepted whose context quotes the owner); otherwise risk.acceptance_unrecorded is an error at its acceptedBy field naming the missing parts. An acceptedBy actor, date or decisionRef that does not resolve, or a decisionRef to a decision that is not accepted, is model.invalid_acceptance (error). risk.acceptance_not_owner is a warning at the acceptedBy actor of a risk whose owner is set and differs from the actor. risk.accept_while_open is a warning at a risk status when response is accept and status is open, since the Gemara policy would otherwise list it as accepted while it is open. The Gemara policy lists a risk under risks.accepted only when its acceptance record is complete and resolves (validate.AcceptanceRefs, shared with validation) and its status is accepted, or its response is accept and its status is not open; gemara.validate (CheckGemaraModelConsistency) reports an accepted entry that does not meet this. Imported alias::ID records are skipped; the schema rejects :: in authored risk and threat scenario IDs, so a local ID cannot pose as imported. The record is an authored claim: these checks make it complete and consistent, and human review of the diff that adds it is the actual control that the owner gave it.'
    verificationCriteria: When a risk is accepted without acceptedBy, a risk has response accept with status open, and a threat scenario is accepted without acceptedBy, then validation reports risk.acceptance_unrecorded at both acceptedBy fields and risk.accept_while_open at the open risk, and the Gemara policy lists no accepted risk; once acceptedBy names an actor, a date and a statement, the error is gone and the accepted risk is listed.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-GEMARA-EXPORTER
    realizes: [CAP-EMG-MODEL-VALIDATION]
  - id: REQ-EMG-086
    status: implemented
    text: When workspace sync is requested, the engineering model go shall write a go workspace replace directive for each required version of a workspace go module.
    notes: 'engws sync writes, next to the use entries of the family go.work, one line replace <module> <version> => ./<dir> for every Go module of a checkout listed in use and every distinct version at which any checkout''s go.mod requires that module; a module no checkout requires gets no replace. go resolves the go.mod of a required version even when the module is in use, so an unpublished family module fails to build without it; an unversioned replace is rejected for a workspace module. The generated-file header and the hand-written file check are unchanged. A repository''s .github/engmod-check uses its own go.work or GOWORK=off and is not affected.'
    verificationCriteria: When an unpublished interface module with a third-party requirement is required by a service checkout at v0.1.0, then after engws sync go build in the service succeeds under the generated go.work with GOPROXY serving only the third-party module, and go.work holds exactly one replace for the required version.
    appliesTo:
