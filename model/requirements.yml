    realizes: [CAP-EMG-CODE-HEALTH]
  - id: REQ-EMG-158
    status: implemented
    text: When generation run is requested, the engineering model go shall run code health analysis with enghealth scan, check and baseline, exiting 0 when ok, 1 on blocking findings and 2 on a setup error.
    notes: 'ADR-EMG-046, ADR-EMG-052 and ADR-EMG-053. cmd/enghealth has the subcommands scan (report and roll-ups; it exits 1 only with --fail-on-error and an error finding that is neither waived nor baselined), baseline (write and --check the committed baseline) and check (delta between a base revision and the working tree, with the blocking decision of the tier policy). A setup error (unreadable model, missing base revision, unreadable or non-conforming imported report, a path outside the repository) exits 2 and never counts as a pass.'
    verificationMethods: [test]
    verificationCriteria: When enghealth scan runs on a model with a health block, then it writes the report and exits 0 (1 only with --fail-on-error and an error that is neither waived nor baselined); when enghealth check finds a new high finding at product tier it exits 1, and with only existing debt it exits 0; when the model does not load, the base is missing or the imported report does not conform it exits 2.
    appliesTo:
