    realizes: [CAP-EMG-CODE-HEALTH]
  - id: REQ-EMG-159
    status: implemented
    text: When generation run is requested, the engineering model go shall cache the code health result of each file by content hash and produce deterministic output.
    notes: 'ADR-EMG-054. The cache lives under .engmod/cache/health, keyed by the sha256 of the file content, the language, the thresholds and scoringVersion; a changed key is a miss. Output is sorted, and a committed report holds no timestamps and no absolute paths. The cache key also holds the path, the engine name and version and a key-layout version. The cache is used by check and by scan (--no-cache turns it off), it is off by default when CI is set, and it is refused when files under .engmod are tracked by git (an unprotected cache entry could hide a finding). Target: a check of one changed file under 1 s when warm (measured 0.2 to 0.4 s in docs/code-health-dogfood.md).'
    verificationMethods: [test]
    verificationCriteria: When a scan runs twice on unchanged files, then the second run reads every file result from the cache and the two reports are byte-identical, and with CI set or a tracked .engmod the cache is not used; when a file or a threshold changes, then only the affected entries are recomputed; the report holds no timestamp and no absolute path and lists files, functions and findings in sorted order.
    appliesTo:
      - FU-CODE-HEALTH
    derived: true
    derivedRationale: 'Mechanism of REQ-EMG-158: the content-hash cache only makes the scan fast; the promise is the scan result, which is unchanged by it.'
