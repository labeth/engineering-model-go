    verificationMethods: [test]
    verificationCriteria: When a model has a passing formal result for one requirement and a failed one for another, then the evaluation log holds one entry per requirement with the matching result and the machine and invariant in the evidence, and a stale result is not reported as passed.
    appliesTo:
