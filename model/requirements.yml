    notes: 'contract.unrealized (warning) names a published capability with no realizing requirement. A contract.provides entry that carries ref is the error model.provides_ref_removed (REQ-EMG-184) and the ref counts as no realizer; the realizing requirement names the capability with realizes.'
    verificationMethods: [test]
    verificationCriteria: When one published capability has no realizer and another names its requirement only in ref, then validation warns contract.unrealized for the first and reports model.provides_ref_removed at the ref of the second, which still has no realizer.
