schemaVersion: 2
lintRun:
  id: engineering-model-go-lint
  mode: strict
  commaAsAnd: true
  catalogRef: ./catalog.yml
requirements:
  - id: REQ-EMG-001
    text: While local development mode is active, when model updated event is received, the engineering model go shall validate architecture model before generation run is requested.
    notes: Validation must gate all generation flows.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-CLI-ORCHESTRATION
      - FU-VALIDATION-ENGINE
      - FU-ASCIIDOC-GENERATOR
      - FU-THREAT-EXPORTER
      - FU-STRUCTURIZR-EXPORTER
      - FU-OSCAL-EXPORTER
  - id: REQ-EMG-003
    text: While model is valid, when generation run is requested, the engineering model go shall produce AsciiDoc architecture publication output without whitespace-only lines.
    notes: Human-readable architecture output remains required and shall be clean for version control and downstream processing.
    appliesTo:
      - FU-ASCIIDOC-GENERATOR
      - FU-VIEW-PROJECTION
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-004
    text: Where threat export is enabled, when generation run is requested, the engineering model go shall export threat dragon json artifact plus open threat model artifact.
    notes: Threat model interchange output contract.
    appliesTo:
      - FU-THREAT-EXPORTER
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-005
    text: Where structurizr export is enabled, when generation run is requested, the engineering model go shall export structurizr dsl artifact.
    notes: Structurizr DSL is exported for C4 visualization; the exported DSL is validated best-effort by the validate-all gauntlet when a Structurizr validator is available.
    appliesTo:
      - FU-STRUCTURIZR-EXPORTER
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-006
    text: Where traceability export is enabled, when generation run is requested, the engineering model go shall produce trlc package and lobster trace report artifacts.
    notes: Traceability outputs required for assurance workflows.
    appliesTo:
      - FU-TRLC-EXPORTER
      - FU-LOBSTER-EXPORTER
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-007
    text: While mcp server is enabled, when mcp tool call is received and catalog references resolve successfully, the engineering model go shall return mcp tool result with schema version and structured error fields.
    notes: MCP response contract stability requirement.
    appliesTo:
      - FU-MCP-SERVER
  - id: REQ-EMG-008
    text: When mcp tool call is received, the engineering model go shall reject path arguments outside repository workspace boundary.
    notes: Filesystem trust boundary guardrail.
    appliesTo:
      - FU-MCP-SERVER
  - id: REQ-EMG-009
    text: While ci validation mode is active, when generation run is requested, the engineering model go shall execute validation plus tests before artifact generated event is raised.
    notes: CI installs only the runtimes required by validation, uses mutually compatible exact validator versions and supported command-line semantics for those versions, and configures dependency caches only when their native project metadata exists, so setup and validation do not fail before the validation gauntlet completes.
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-010
    text: Where requirement trace is complete, when model updated event is received, the engineering model go shall infer traceability coverage from trace markers.
    notes: Links runtime, code, and test markers to modeled requirement coverage. Python and JavaScript declarations and lexical Verilog modules support explicit source links. Python decorators preserve definition coordinates; strings cannot create trace or ownership markers, and syntax errors are diagnosed; Verilog extraction does not elaborate HDL or expand macros. Individual source files and overlapping source directories preserve distinct file identities without double counting. Code and metadata scanning excludes dependency caches (node_modules, vendor) and dot-directories (.git, .engmod, tool caches) so coverage reflects only committed first-party source and stays reproducible.
    appliesTo:
      - FU-CODEMAP-INFERENCE
  - id: REQ-EMG-011
    text: Where external schema dependencies are available, when generation run is requested, the engineering model go shall fail validation if schema checks do not match expected constraints.
    notes: Protect export integrity when schema trust fails.
    appliesTo:
      - FU-THREAT-EXPORTER
      - FU-STRUCTURIZR-EXPORTER
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-012
    text: When generation run is requested, the engineering model go shall generate artifacts deterministically so that regeneration is reproducible.
    notes: Generation uses stable ordering and controlled metadata so maintained artifacts are bit-for-bit reproducible. The validation gauntlet regenerates every maintained example and applies authoritative parsers or schemas where available plus semantic and idiomatic checks for each published format.
    appliesTo:
      - FU-ASCIIDOC-GENERATOR
      - FU-CODEMAP-INFERENCE
      - FU-ALLOCATION-TRACE
      - FU-GEMARA-EXPORTER
      - FU-LOBSTER-EXPORTER
      - FU-OSCAL-EXPORTER
      - FU-STRUCTURIZR-EXPORTER
      - FU-SYSML-EXPORTER
      - FU-THREAT-EXPORTER
      - FU-TRLC-EXPORTER
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-013
    text: Where traceability export is enabled, when generation run is requested, the engineering model go shall export an OSCAL aggregate profile plus SSP plus assessment plan plus assessment results plus POA&M artifacts when the corresponding compliance and remediation content is applicable.
    notes: OSCAL documents use version 1.1.2 structures, deterministic metadata, resolvable sibling import links, aggregate every implemented compliance framework, and omit inapplicable documents rather than emitting schema-invalid empty artifacts.
    appliesTo:
      - FU-OSCAL-EXPORTER
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-014
    text: Where architecture decision records are authored, when generation run is requested, the engineering model go shall publish architecture decision records document linked from AsciiDoc architecture publication output.
    notes: ADRs are first-class model content but are published separately from the main architecture narrative.
    appliesTo:
      - FU-ASCIIDOC-GENERATOR
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-015
    text: Where gemara export is enabled, when generation run is requested, the engineering model go shall render OpenSSF Gemara model artifacts.
    notes: Gemara is a first-class GRC rendering of the model, validated against the published Gemara schemas via the go-gemara SDK.
    appliesTo:
      - FU-GEMARA-EXPORTER
      - FU-CLI-ORCHESTRATION
      - FU-MCP-SERVER
  - id: REQ-EMG-016
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall resolve the subsystem references declared by the parent system from local subdirectory paths.
    notes: Recursive system-of-systems composition; local subdirectory references, with external git repositories cloned into the .engmod cache (REQ-EMG-027, ADR-EMG-008, ADR-EMG-010).
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-MODEL-LOADER
  - id: REQ-EMG-017
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall reject any subsystem reference that resolves outside the repository workspace boundary.
    notes: Downward-only references remain within the workspace; mirrors the MCP path-boundary guardrail.
    appliesTo:
      - FU-SYSTEM-COMPOSITION
  - id: REQ-EMG-018
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall reject a subsystem reference graph that contains a cycle.
    notes: Subsystem references must form a directed acyclic graph (ADR-EMG-009).
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-019
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall resolve cross-system references using subsystem-qualified identifiers.
    notes: Identifiers are scoped per system; cross-system references are qualified by subsystem to avoid collisions.
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-020
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall materialize parent-to-subsystem allocation traceability in the composed output without modifying any subsystem model.
    notes: A subsystem is parent-agnostic; parent allocation is materialized only in composed artifacts, never written back to the child (ADR-EMG-009, ADR-EMG-011).
    appliesTo:
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-021
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall report each subsystem required interface that the parent system does not satisfy.
    notes: Subsystems publish a provides-and-requires contract; the parent must satisfy each required interface.
    appliesTo:
      - FU-ALLOCATION-TRACE
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-022
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall reject an allocation that targets a subsystem identifier not published in the subsystem contract.
    notes: Parents may bind only to a subsystem's public contract surface, not its internal identifiers.
    appliesTo:
      - FU-ALLOCATION-TRACE
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-023
    text: When generation run is requested, the engineering model go shall flag any requirement that links to another requirement in the same document.
    notes: Requirements carry no tiers. A requirement is either delegated to a subsystem through a downward composition allocation or implemented here, and the delegation link alone tells the two apart. Linking requirements to one another inside a document recreates tier coupling and is confusing across system boundaries, so it is flagged.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-024
    text: Where hardware interfaces are authored, when generation run is requested, the engineering model go shall render the hardware to software interface allocation view.
    notes: Hardware items and hardware interfaces capture the HW/SW interface (ICD/IRS) for the interface-control view.
    appliesTo:
      - FU-ASCIIDOC-GENERATOR
      - FU-VIEW-PROJECTION
  - id: REQ-EMG-025
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall produce a system requirement allocation matrix aggregated across the composed subsystems.
    notes: Aggregate roll-up generation mode for the integrating system.
    appliesTo:
      - FU-ALLOCATION-TRACE
      - FU-ASCIIDOC-GENERATOR
  - id: REQ-EMG-026
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall render in the requirement view the delegation link from each delegated requirement to the specific subsystem requirement that satisfies it.
    notes: A provided contract entry names (ref) the subsystem requirement that realizes it, so a parent delegation traces to exactly the requirement that satisfies it. An allocated capability with no such ref is flagged as untraceable, and a ref to a requirement the subsystem does not define is rejected.
    appliesTo:
      - FU-ALLOCATION-TRACE
      - FU-ASCIIDOC-GENERATOR
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-027
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall resolve an external git subsystem reference by cloning the repository into the workspace .engmod cache.
    notes: "A subsystem may reference an external repository with git (and an optional rev and path). The model is cloned once into .engmod/subsystems/<id> — a gitignored, temporary cache reused while it points at the same repository — and resolved like a local subsystem, giving a full cross-repository composed view. References stay downward-only."
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-MODEL-LOADER
  - id: REQ-EMG-028
    text: When generation run is requested, the engineering model go shall reject a code trace link that resolves to no requirement or model element.
    notes: Code markers (TRLC-LINKS to a requirement, ENGMODEL-LINKS to a model element) are existence-checked against the model, not only shape-checked, so a link to a deleted or mistyped id is a dangling link and fails the build. A trace link is only checked for the model that owns its code (see REQ-EMG-030 scoping).
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-CODEMAP-INFERENCE
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-029
    text: When generation run is requested, the engineering model go shall flag each requirement that is traced by neither code nor verification nor a downward delegation.
    notes: An orphan requirement has no implementing code symbol, no verification, and is not delegated to a subsystem; it is a coverage gap surfaced as a warning so it is visible without breaking the build.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-030
    text: When generation run is requested, the engineering model go shall export a machine-readable traceability matrix that links each requirement to its implementing code and verification and delegated subsystem requirement.
    notes: One consolidated matrix (JSON) replaces having to read it out of prose and diagrams. Test-only source links count as verification, not production implementation. Code is attributed to the model whose engmod.yml is its nearest enclosing root, so a parent model never validates or counts a child model's trace links (monorepo scoping).
    appliesTo:
      - FU-ALLOCATION-TRACE
      - FU-CODEMAP-INFERENCE
  - id: REQ-EMG-031
    text: When requirements delta is received, the engineering model go shall strictly validate requirements delta schema plus stable identifier operation uniqueness.
    notes: Version 1 supports add, whole-entity update, and remove operations. Unknown fields, empty operations, duplicate operations, adds of existing IDs, and updates or removals of missing IDs are rejected.
    appliesTo:
      - FU-MODEL-CHANGE
      - FU-MODEL-LOADER
  - id: REQ-EMG-032
    text: While dry run mode is active, when requirements delta is received, the engineering model go shall validate candidate architecture model without modifying requirements document.
    notes: The candidate reuses complete-model structural, catalog, EARS, and internal-link validation before any write is permitted.
    appliesTo:
      - FU-MODEL-CHANGE
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-033
    text: While model is valid, when requirements delta apply is requested, the engineering model go shall atomically replace requirements document.
    notes: The YAML AST merger preserves unchanged nodes and comments. Atomic replacement preserves file permissions and refuses a candidate with blocking diagnostics.
    appliesTo:
      - FU-MODEL-CHANGE
      - FU-VALIDATION-ENGINE
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-034
    text: When requirements delta is received, the engineering model go shall produce deterministic requirements change summary.
    notes: The summary sorts added, updated, and removed stable IDs and reports changed fields for whole-entity updates.
    appliesTo:
      - FU-MODEL-CHANGE
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-035
    text: When model updated event is received, the engineering model go shall normalize architecture model plus requirements document into canonical semantic model.
    notes: The canonical semantic model is SysML v2 and KerML aligned. Existing Engineering Model concepts map into that model once; legacy YAML remains an input adapter during migration and must not create a parallel set of parts, interfaces, flows, requirements, allocations, or views.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-VALIDATION-ENGINE
      - FU-SYSML-EXPORTER
  - id: REQ-EMG-036
    text: Where sysml export is enabled, when generation run is requested, the engineering model go shall generate sysml v2 model artifact from canonical semantic model.
    notes: The exporter preserves stable identifiers and maps standard concepts to native SysML v2 or KerML semantics. Engineering-specific concepts may use explicit typed SysML metadata definitions, but canonical data without a native target representation must be omitted rather than encoded in descriptions, opaque payloads, generic property bags, or sidecar files.
    appliesTo:
      - FU-SYSML-EXPORTER
      - FU-CLI-ORCHESTRATION
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-037
    text: While ci validation mode is active, when generation run is requested, the engineering model go shall validate sysml v2 model artifact before artifact generated event is raised.
    notes: Validation must report unsupported or lossy mappings and progress toward abstract-syntax, textual-syntax, semantic, and model-interchange conformance. A syntactically valid subset export must not be described as a complete SysML v2 semantic superset.
    appliesTo:
      - FU-SYSML-EXPORTER
      - FU-VALIDATION-ENGINE
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-038
    text: Where sysml export is enabled, when generation run is requested, the engineering model go shall validate canonical semantic model against sysml v2 metamodel.
    notes: The pinned formal SysML 2.0 and KerML 1.0 metamodel is the source of truth for supported classes, properties, relationships, ownership, and multiplicities. Generated CUE constraints and semantic registries must not be maintained as independent handwritten copies.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-VALIDATION-ENGINE
      - FU-SYSML-EXPORTER
  - id: REQ-EMG-039
    text: While ci validation mode is active, when generation run is requested, the engineering model go shall reject incomplete sysml v2 metamodel coverage.
    notes: Coverage is complete only when every normative metaclass and property in the pinned formal release is represented, explicitly excluded as derived, or implemented as a typed Engineering Model extension with executable evidence.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-SYSML-EXPORTER
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-040
    text: When generation run is requested, the engineering model go shall preserve the deterministic native sysml v2 source through project interchange round trip.
    notes: Sysand owns normative KPAR packaging and reopening. Verification compares the reopened SysML source byte-for-byte with a fresh projection and validates both sources with the pinned official parser; it does not claim lossless reconstruction of canonical concepts omitted from SysML.
    appliesTo:
      - FU-SYSML-EXPORTER
      - FU-VALIDATION-ENGINE
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-041
    text: Where naf profile authoring is enabled, when model updated event is received, the engineering model go shall validate naf v4.1 stakeholder plus concern plus viewpoint metadata against canonical model references.
    notes: NAF-specific YAML contains profile metadata only. Capability, service, logical, resource, behavior, interface, and requirement concepts remain represented once in the canonical SysML and KerML aligned semantic graph.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-VALIDATION-ENGINE
      - FU-NAF-EXPORTER
  - id: REQ-EMG-042
    text: Where naf export is enabled, when generation run is requested, the engineering model go shall generate deterministic naf v4.1 architecture document from referenced canonical model views.
    notes: Each NAF architecture product uses an official NAF v4.1 viewpoint code and references an existing Engmod view so generated content preserves canonical identities and relationships.
    appliesTo:
      - FU-NAF-EXPORTER
      - FU-VIEW-PROJECTION
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-043
    text: While ci validation mode is active, when generation run is requested, the engineering model go shall reject unsupported naf version plus unknown viewpoint code plus dangling profile reference before artifact generated event is raised.
    notes: Validation covers stakeholder actor bindings, concern ownership, architecture-product concern references, and Engmod view references.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-NAF-EXPORTER
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-044
    text: When model updated event is received, the engineering model go shall load schema version 2 engmod manifest plus catalog plus requirements plus architecture plus behavior plus assurance plus compliance plus views plus decisions documents into one canonical semantic model.
    notes: engmod.yml is the only model entry point and every document path is explicit. YAML is the authoring format and CUE is the schema authority. Requirements may carry format-neutral qualification metadata such as title, category, rationale, source references, verification methods and criteria, priority, criticality, status, derived disposition, and tags. Views own design narratives plus generic document definitions, document-control metadata, content selections, authored sections, and external references; architecture does not contain behavior, assurance, compliance, dependency source, NAF, or projection-specific declarations.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-VALIDATION-ENGINE
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-045
    text: While mcp server is enabled, when mcp tool call is received and catalog references resolve successfully, the engineering model go shall return schema version 2 model authoring contract.
    notes: The contract contains the manifest document map, authoritative CUE schema for each domain document, stable-ID and typed-relationship conventions, dependency publication aliases, valid references, and recommended task-scoped authoring order.
    appliesTo:
      - FU-MCP-SERVER
      - FU-MODEL-LOADER
  - id: REQ-EMG-046
    text: While ci validation mode is active, when generation run is requested, the engineering model go shall reject model input that violates the schema version 2 manifest or any referenced domain document contract before artifact generated event is raised.
    notes: Missing documents, unsupported versions, unknown fields, duplicate concepts, invalid document-control values, incomplete derived requirement rationale, unresolved document content selections, unresolved local or qualified references, dependency publication violations, and cross-domain ownership violations are blocking.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-VALIDATION-ENGINE
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-047
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall resolve each exact CUE module version from the OCI registry configured by CUE_REGISTRY.
    notes: Dependencies are declared only in engmod.yml with an alias, major-qualified module path, exact semantic version, and selected publications. The resolved module contains engmod.yml, its domain documents, and cue.mod/module.cue.
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-MODEL-LOADER
  - id: REQ-EMG-048
    text: Where a model workspace replacement is declared, when generation run is requested, the engineering model go shall resolve the matching manifest dependency from the replacement repository without changing module identity or selected publications.
    notes: engmod.work.yml maps module paths to local repositories for offline multi-repository development. A generated engmod.lock.yml records exact module versions and OCI digests but is not an authored semantic document.
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-MODEL-LOADER
  - id: REQ-EMG-049
    text: While ci validation mode is active, when generation run is requested, the engineering model go shall reject invalid manifest dependency plus publication plus workspace replacement plus qualified reference declarations.
    notes: 'Every dependency requires one alias, one major-qualified module path, one exact version, and at least one exported publication. Aliases are unique, module identities match cue.mod/module.cue, workspace paths remain contained, imported references use alias double-colon stable-id syntax, and transitive entities are unavailable unless re-exported. A resolved dependency (registry module or workspace replacement) is confined to its module root: before any of its documents is read, every document reference, inferenceHints runtimeSources entry and inferenceHints exclude glob, engmod.yml and cue.mod/module.cue that is absolute or resolves after symlinks outside the module is rejected as composition.dependency_path_escape naming the dependency alias and field, and no content of the target is read; the root model''s own paths are not confined this way. A fetched module zip is checked before extraction (modzip rejects .. and absolute entries, the registry client verifies the blob digest) and an entry that is not a regular file or directory, such as a symlink, fails the fetch.'
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-VALIDATION-ENGINE
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-050
    text: When example validation is requested, the engineering model go shall validate a schema version 2 company portfolio composed from multiple product systems that reuse published hardware plus software plus security plus compliance facets across repository boundaries.
    notes: The reference workspace demonstrates explicit domain documents, dependency publication selection, qualified imported references, requirement delegation, contract satisfaction, inherited company controls, technical security controls, employee lifecycle compliance, provenance, exact OCI coordinates, local workspace replacements, and complete native format projections.
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-VALIDATION-ENGINE
      - FU-ASCIIDOC-GENERATOR
      - FU-SYSML-EXPORTER
      - FU-OSCAL-EXPORTER
      - FU-GEMARA-EXPORTER
  - id: REQ-EMG-051
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall import only explicitly selected dependency publications with qualified identity plus source provenance.
    notes: Each dependency publication exposes typed architecture, behavior, assurance, compliance, requirement, and view references. Imported entities retain module path, exact version, digest, source model, and publication identity; unexported dependency entities remain inaccessible.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-SYSTEM-COMPOSITION
      - FU-VALIDATION-ENGINE
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-052
    text: Where six-view example output is enabled, when generation run is requested, the engineering model go shall generate deterministic use-case plus logical plus process plus physical plus implementation plus deployment view artifacts and native SysML from one schema version 2 YAML bundle.
    notes: The acceptance example preserves viewpoint separation, hierarchical capabilities, ordered typed interactions, nested hardware and software structures, ports, connections, engineering values, and software-to-hardware allocations. Mermaid sources and SVG renderings are generated without depending on authored SysML source files.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-VIEW-PROJECTION
      - FU-SYSML-EXPORTER
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-053
    text: Where do-178c dal c readiness output is enabled, when model updated event is received, the engineering model go shall load a strict aviation assurance profile plus lifecycle data plus verification evidence plus configuration baselines plus tool assessments plus structural coverage summaries.
    notes: The model references DO-178C or ED-12C and customer-controlled licensed objective identifiers without reproducing normative objective text. It distinguishes declared, planned, executed, reviewed, accepted, not-applicable, and authority-accepted evidence states.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-VALIDATION-ENGINE
      - FU-AIRBORNE-ASSURANCE-EXPORTER
  - id: REQ-EMG-054
    text: Where do-178c dal c readiness output is enabled, when generation run is requested, the engineering model go shall reject incomplete or inconsistent requirement classification plus derived requirement disposition plus verification chain plus independence plus baseline plus structural coverage plus tool assessment evidence.
    notes: DAL assignment and objective applicability remain externally authorized inputs. Statement coverage is imported evidence tied to an exact build and environment; the tool does not perform safety assessment, coverage measurement, reviewer qualification, tool qualification, or certification approval.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-AIRBORNE-ASSURANCE-EXPORTER
  - id: REQ-EMG-055
    text: Where do-178c dal c readiness output is enabled, when generation run is requested, the engineering model go shall generate deterministic draft lifecycle data index plus objective evidence matrix plus requirements trace matrix plus verification summary plus structural coverage summary plus tool assessment register plus configuration index plus open gap report plus software accomplishment summary.
    notes: Every output is visibly marked as draft evidence-readiness material, identifies its source baseline and unresolved gaps, and states that responsible human review plus configuration control plus certification authority acceptance remain required.
    appliesTo:
      - FU-AIRBORNE-ASSURANCE-EXPORTER
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-056
    text: When example validation is requested, the engineering model go shall validate a schema version 2 DAL C flight control software example with placeholder planning plus requirements plus design plus code plus verification plus coverage plus configuration plus quality assurance plus certification liaison evidence.
    notes: The example demonstrates realistic output shapes and intentionally open findings without claiming DO-178C compliance or certification.
    appliesTo:
      - FU-AIRBORNE-ASSURANCE-EXPORTER
      - FU-VALIDATION-ENGINE
      - FU-ASCIIDOC-GENERATOR
  - id: REQ-EMG-057
    text: When model updated event is received, the engineering model go shall derive the default code scan root from the enclosing module boundary.
    notes: Without codeSources or an explicit code root, the scan root is the git working tree root, unless another engmod.yml exists between the manifest directory and that root, in which case it is the manifest directory. Directories holding another engmod.yml belong to that module and are skipped. Files ignored by git and paths matching inferenceHints.exclude glob patterns (relative to the module root, with dir/** for whole subtrees) are skipped. Explicit codeSources and code roots still override the default root.
    appliesTo:
      - FU-CODEMAP-INFERENCE
  - id: REQ-EMG-058
    text: When model updated event is received, the engineering model go shall assign path-derived CODE identifiers to every in-scope file with its declarations.
    notes: A file identifier is CODE- followed by its module-root-relative path, upper-cased with runs of non-alphanumeric characters folded to one hyphen (app/internal/capture.go becomes CODE-APP-INTERNAL-CAPTURE-GO). A declaration identifier appends two hyphens and the folded declaration name, so same-named declarations in different files stay distinct. Explicit TRACE-ID markers keep their authored value. Identifiers do not carry commit or blob versions because the model and the code are versioned together.
    appliesTo:
      - FU-CODEMAP-INFERENCE
  - id: REQ-EMG-059
    text: When model updated event is received, the engineering model go shall resolve authored references to CODE identifiers against the in-scope module files.
    notes: An unknown CODE identifier is a broken reference, an identifier produced by more than one file or declaration is rejected as ambiguous, and inferred RT- and AUTO- identifiers remain unreferenceable. The code index is built only when the model references a CODE identifier, so models without such references pay no scanning cost.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-CODEMAP-INFERENCE
  - id: REQ-EMG-060
    text: When model updated event is received, the engineering model go shall reject referenced elements whose uri addresses a local path.
    notes: Referenced elements describe artifacts outside the repository. A uri without a scheme or with the file scheme is rejected with a hint to reference the CODE identifier instead. A referenced element with a uri must declare a version unless the uri itself is immutable (a doi, or a uri carrying a full 40-hex commit id). Referenced elements without a uri remain valid for offline documents identified by number and edition.
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-061
    text: When generation run is requested, the engineering model go shall count a requirement as tested only through test entry points.
    notes: Test entry points are Go Test/Benchmark/Fuzz/Example functions, Rust #[test]-like functions including those inside #[cfg(test)] modules, and Python test functions. TRLC-LINKS on other declarations in test code raise verification.helper_link. The trace summary reports tested (also as testLinked) and passed separately; verified is a deprecated alias of testLinked kept for compatibility, and passed requires a parsed test-result artifact. trace.matrix accepts summaryOnly to return only the summary and diagnostics.
    appliesTo:
      - FU-CODEMAP-INFERENCE
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-062
    text: Where gemara export is enabled, when generation run is requested, the engineering model go shall derive each gemara enforcement disposition plus policy risk treatment from the model status.
    notes: Only a completed POA&M item is Enforced and only an accepted one Tolerated; planned, in-progress, deferred and unset items are Undetermined, and so is the log aggregate while any item is unresolved. The policy lists a risk as mitigated only when its status is closed and as accepted only when its status is accepted or its response is accept; open and mitigating risks are left out with a gemara.policy_risks_untreated warning. The generator author is typed Software unless overridden. gemara.validate reports claims the model does not support as modelConsistencyErrors.
    appliesTo:
      - FU-GEMARA-EXPORTER
      - FU-MCP-SERVER
  - id: REQ-EMG-063
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall select the model workspace from the ENGMOD_WORK setting.
    notes: ENGMOD_WORK=off ignores every engmod.work.yml (CI and the pre-push gate); ENGMOD_WORK=<path> uses that file only and skips the parent search; unset searches parent directories as before. A path that does not exist is an error. CLI tools and the MCP server accept --workspace=off|<path> with the same meaning.
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-MODEL-LOADER
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-064
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall write or check the composition lock according to the lock mode.
    notes: 'While workspace replacements are active the committed engmod.lock.yml is never modified and the resolved lock goes to engmod.lock.local.yml. With ENGMOD_LOCK=check (or --lock=check) the resolved lock is compared with engmod.lock.yml and composition.lock_missing, composition.lock_invalid or composition.lock_mismatch (missing, extra or version-changed dependency, changed content digest after a moved tag) is reported and nothing is written. Exception: while workspace replacements are active the committed lock is not compared (it pins published content, the replacements are local) and the warning composition.lock_check_skipped says that it is checked only with ENGMOD_WORK=off. Otherwise engmod.lock.yml is written as before. A cached registry module is reused offline, except that ENGMOD_MODULE_CACHE=refresh and lock regeneration (write mode with the workspace off) re-fetch every dependency, ENGMOD_MODULE_CACHE=reuse (ResolutionOptions.ModuleCache) reuses the cache offline in every lock mode, and otherwise lock check mode compares each cached module''s recorded manifest digest with the registry (one lookup per dependency, cache reused when offline) and re-fetches a moved tag, so a warm cache never masks it. Diagnostics located in a fetched dependency name it as module@version:path instead of the cache directory.'
    appliesTo:
      - FU-SYSTEM-COMPOSITION
  - id: REQ-EMG-065
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall validate each qualified reference against the published entities of the selected dependencies.
    notes: 'Covers relationships, flows and flow steps, appliesTo, interface and data references, ownership (functional unit group, interface owner, trust boundary parent, risk, threat and verification owners), view roots and code ENGMODEL-LINKS. Requirements stay local, so trace counts do not include imported requirements. A qualified reference to an entity the dependency does not publish is reported once as composition.unpublished_reference with its field path, not as a generic broken reference. Only reference-typed fields are checked; prose (descriptions, notes, rationale, flow step actions) and file or URL fields (schemaRef, catalogRef, href) may contain :: freely.'
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-VALIDATION-ENGINE
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-066
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall return the composition diagnostics with the generation result.
    notes: GenerateAsciiDoc and the trace matrix return every composition diagnostic, so callers need not compose again; composition runs once per call and its result is reused. An unsatisfied required interface is an error for a model of kind system that has no parent and a warning otherwise; an allocation whose target is not a contract provides entry is a warning.
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-ASCIIDOC-GENERATOR
  - id: REQ-EMG-067
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall show the trace status of each delegated requirement in its target repository.
    notes: For a delegated row the matrix computes the target requirement's own trace status (implemented, test linked, orphan) from the resolved dependency at its pinned or replaced version and reports it as delegatedStatus. The dependency's code scope is its own module directory (the workspace checkout or the module cache entry) minus its inferenceHints exclude globs, never the consumer repository around it; a dependency without code there shows not-available.
    appliesTo:
      - FU-ALLOCATION-TRACE
      - FU-SYSTEM-COMPOSITION
  - id: REQ-EMG-068
    text: When workspace sync is requested, the engineering model go shall write a local workspace that replaces only changed or pinned checkouts.
    notes: 'engws scans direct child directories with engmod.yml. A checkout is changed when its git tree is dirty, HEAD is not at tag v<module.version>, or that version is not in the registry configured by CUE_REGISTRY; .engws.yml pins force local. The root search stops below $HOME (never $HOME or an ancestor) and refuses a world-writable root unless --root names it; every command prints the root first. sync skips with a warning a checkout whose module.path is not a valid major-qualified CUE module path or whose directory name is outside [A-Za-z0-9._-]. sync writes engmod.work.yml with the local checkouts and a go.work with every checkout that has go.mod (a non-local checkout is at its published tag, so go test and go run work in every checkout; go.work is removed when none has go.mod), and writes nothing inside any checkout. status and skew report SKEW when a local checkout''s version differs from a version another checkout pins, or when a consumer''s go.mod requires a checkout''s Go module at another version than the checkout''s version tag, and exit 1. check runs the model check in every local checkout affected by the change (reverse dependencies inside the workspace) and the top system with summary output; a repository''s own .github/engmod-check is trusted code (stated in the help and the check output; --in-process is the choice for untrusted checkouts) and runs with an allowlisted environment (PATH, HOME, Go, CUE, proxy, certificate, XDG, DOCKER_CONFIG, CI and ENGMOD_* variables; no API keys or other credentials) and GOWORK set to its .github/engmod-check/go.work when present and off otherwise, never the root go.work; the in-process check relies on the library''s qualified-reference validation; --refresh re-fetches dependencies; --all does not warn that engmod.work.yml lacks the unchanged checkouts. bump writes inside the consumer checkout: it updates a dependency version in engmod.yml, the matching go.mod require and go.sum (go get with GOWORK=off, after validating the Go module path) and the lock together, and restores all of them on any failure; pin and unpin write .engws.yml at the root.'
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-SYSTEM-COMPOSITION
  - id: REQ-EMG-069
    text: While mcp server is enabled, when mcp tool call is received, the engineering model go shall return authoring assistance for an edited model document.
    notes: model.complete returns local and imported qualified IDs (from dependencies pulled into the local cache), catalog terms, allowed enum values and relationship type pairs that match a prefix and an optional field; model.diagnose validates the model with one document's content supplied in the call and returns that document's diagnostics; dependencies resolve from the real project's workspace and module cache while the root system, its composition and its alias::ID references are taken from the submitted content, and no lock is written. Both work offline from the local cache; no central service is involved. Every composing MCP read tool (model.complete, model.diagnose, composition.resolve, trace.matrix) resolves with lock check unless ENGMOD_LOCK is set and with module cache reuse unless ENGMOD_MODULE_CACHE or ENGMOD_LOCK is set, so it never writes engmod.lock.yml and makes no registry request when the cache is warm. composition.resolve returns resolved directories relative to the workspace root, or as module@version for module cache entries, never as absolute paths.
    appliesTo:
      - FU-MCP-SERVER
  - id: REQ-EMG-070
    text: When model updated event is received, the engineering model go shall warn about every unconnected behavior element.
    notes: 'Three warnings. behavior.event_unused names an authored behavior event that no triggered_by relationship targets, no semantic transition lists as a trigger and no semantic relationship, flow or flow step references (catalog-only events are covered by catalog.term_unreferenced). behavior.state_unreachable names, in a model with at least one transitions_to relationship or semantic transition, an authored state other than the first declared one that no transition enters; the schema has no initial marker, so the first declared state is the initial state, and a model without transitions reports nothing. behavior.flow_step_no_onerror names a flow step with boundaryCrossing true and no onError step, at its onError path. Imported alias::ID entities are skipped.'
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-071
    text: When model updated event is received, the engineering model go shall warn at each catalog term whose name contains an EARS expression operator.
    notes: 'catalog.name_has_operator is reported once at the catalog name or alias field (catalog.<group>[i].name or .aliases[j]) of an actor, event, state, feature, mode, condition or data term that contains a standalone and, or, not, a comma or a parenthesis. Such a term cannot match in a requirement clause, because the EARS expression parser splits it at the operator, and the requirement otherwise shows only unresolved-term diagnostics. System, functional group and unit names are matched whole by EARS and are not checked.'
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-072
    text: When model updated event is received, the engineering model go shall report a multiple-response lint only for a requirement with more than one response action.
    notes: 'lint.multiple_responses from ears-lint-go is dropped when the text has one shall and no semicolon, no and, or or comma comes before the first with, including or of in the response, that field list holds no then, and no list item after the first reads as a verb with its object (its second word is the, a, an, its, their, each, every or all). "publish one world state message with UTC time, latitude, longitude and altitude" is not reported; "log the event and notify the operator", "log the event with the timestamp and notify the operator" and "stop all of the motors and close the valve" still are.'
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-073
    text: When generation run is requested, the engineering model go shall warn about each control verification status that lags its existing tests.
    notes: 'A control verification may name its tests in verificationRefs: inferred CODE identifiers of test declarations (CODE-<PATH>--<NAME>) or requirement IDs whose linked test entry points verify it; any other entry is the error model.invalid_control_verification_ref. verification.status_stale is a warning at the status of a control verification whose status is unset or not-run while a referenced test declaration exists in the scanned code or a referenced requirement is test linked, and at the status of a threat mitigation whose status is unset or planned while a control verification it references has such tests. The status stays authored. The AsciiDoc generation and the trace matrix both report it.'
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-080
    text: When workspace staging is requested, the engineering model go shall publish every workspace checkout into the local staging area in dependency order.
    notes: 'engws stage [--version-from manifest|tag] [--serve] [--addr] writes only under <root>/.engmod/staging, never inside a checkout. registry/<module path>/ holds each CUE module as an OCI image layout with the content cue mod publish would push (source kind git: the committed files from git ls-files with VCS metadata; kind self: the directory). goproxy/ is a GOPROXY file tree (<module>/@v/<version>.info, .mod, .zip and list) for each checkout with go.mod at its top, zipped from committed files. The version is module.version from engmod.yml; with --version-from tag HEAD must be at tag v<module.version>. A checkout cue mod publish would refuse (dirty tree, no source field, module path mismatch) is reported, and then nothing is staged. A consumer pinning a family module at another version than the staged one is warned about. CUE has no file registry, so --serve loads the layouts into an in-memory read-only OCI registry on a loopback address only and serves it in the foreground until interrupted. stage prints the gate environment: CUE_REGISTRY routes for the staged modules merged with the current CUE_REGISTRY (with --serve), GOPROXY=file://<staging>/goproxy,off, GONOPROXY=none, GONOSUMDB with the staged Go modules plus the current GONOSUMDB or GOPRIVATE, GOWORK=off and ENGMOD_WORK=off; no -mod flag.'
    verificationCriteria: When a family of interface, service and system git checkouts is staged with --serve, then the printed CUE_REGISTRY lets the system compose with the workspace off from the staged registry only and its lock check pass, the printed GOPROXY lets an outside consumer build against the staged Go module, and no checkout changes.
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-SYSTEM-COMPOSITION
  - id: REQ-EMG-081
    text: When spec delta is requested, the engineering model go shall render OpenSpec spec delta text from the selected model requirements.
    notes: 'engmodel.RenderSpecDelta and RenderSpecDeltaFromModel, and the engspec CLI (--model, --ids or --prefix, --capability, --modified, --out), render ## ADDED (or MODIFIED) Requirements and per requirement a ### Requirement heading (title, else ID; a repeated title names its ID), the line <ID>: <model text> with whitespace collapsed and whole-word shall and must upper-cased, so it starts with the model text under the engineering-flow consistency normalization (lower case, collapsed whitespace, no backticks or trailing period), and one #### Scenario from verificationCriteria: GIVEN, WHEN and THEN bullets when the criteria are shaped [given …,] when …, then …; otherwise WHEN the requirement is verified and THEN the criteria. Requirements without shall or must, or without verificationCriteria, are returned as warnings; an unknown ID is an error.'
    verificationCriteria: Golden tests render a fixture and check SHALL capitalization and criteria shaping, and the engspec output for a sample model starts each REQ line with the model text and passes openspec validate --strict when the openspec CLI is available.
    appliesTo:
      - FU-MODEL-CHANGE
  - id: REQ-EMG-082
    text: When model updated event is received, the engineering model go shall report each assurance record whose verification links disagree.
    notes: 'threat.verification_missing is a warning at a threat scenario''s verificationRefs when it omits a control verification that one of its threat mitigations (threatScenarioRef) lists in verificationRefs or that names the threat in threatScenarioRefs. mitigation.verification_control_mismatch is an error at a threat mitigation verificationRefs entry naming a control verification whose controlRef is another control than the mitigation''s controlRef. verification.unlinked is a warning at the verificationRefs of a control verification with method test and status pass or partial that has no verificationRefs, so no test declaration or requirement evidences it; analysis, inspection and other methods are evidenced by their evidence entries and are not reported. Imported alias::ID records are skipped. The AsciiDoc generation, the trace and model.diagnose report them through validation.'
    verificationCriteria: When a threat scenario omits a control verification its mitigation references, a mitigation references a control verification of another control, and a passing test control verification has no verificationRefs, then validation reports one warning, one error and one warning at those fields, and none once the links agree.
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-083
    text: When model updated event is received, the engineering model go shall warn at each control that the gemara evaluation log would mark for review.
    notes: 'gemara.control_needs_review is a warning at a control that the Gemara L5 evaluation log gives the result Needs Review: no control verification names it in controlRef, or at least one of its control verifications has a status that needs review (partial, planned, in-progress, review, needs-review) and none failed or has an unrecognized status, since Failed and Unknown outrank Needs Review in the log''s aggregate. validate.ClassifyVerificationStatus and validate.ControlNeedsReview are the one status mapping the evaluation log and the warning share. When a control without verification has a threat mitigation that references another control''s verification, the message names it ("<CV> verifies <other control>"); for a control whose verifications need review it names them with their status. Validation emits it, so the check path (engdoc, the trace, model.diagnose) reports it without rendering Gemara.'
    verificationCriteria: When a control has no control verification and its mitigation references a verification of another control, and another control has only a partial verification, then validation warns at both controls, naming the other control's verification and the partial verification, and the warned controls are exactly those the evaluation log marks Needs Review.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-GEMARA-EXPORTER
  - id: REQ-EMG-084
    text: When model updated event is received, the engineering model go shall infer implementation coverage from trace markers in comments of build and documentation artifacts.
    notes: 'The code scanner reads TRLC-LINKS, ENGMODEL-LINKS and ENGMODEL-OWNER-UNIT in # comment lines of files named Dockerfile or Containerfile or ending in .Dockerfile or .Containerfile, and in HTML comments (<!-- TRLC-LINKS: REQ-… -->, also spanning lines) that start a line outside fenced code blocks of .md and .markdown files. The markers apply to the whole file: it becomes one symbol with its file CODE identifier (CODE-<PATH>) that implements the linked requirements, never verifies them, also under tests/. Markers are optional: such a file without them yields no item and no code.missing_trlc_link. The module code scope applies, including git-ignored files and inferenceHints.exclude; an invalid requirement ID is code.invalid_trlc_link.'
    verificationCriteria: When a Dockerfile and a README.md carry TRLC-LINKS comments, then the trace matrix lists each as implementing code of the linked requirement, and a Dockerfile without markers adds no diagnostic.
    appliesTo:
      - FU-CODEMAP-INFERENCE
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-085
    text: When model updated event is received, the engineering model go shall report each accepted assurance record that lacks an owner acceptance record.
    notes: 'A risk with status accepted or response accept, and a threat scenario with status accepted, must carry acceptedBy with actor (an existing ACT-* actor), date (a YYYY-MM-DD calendar date, parsed, so 2026-13-45 is rejected) and statement (the owner''s own words) or decisionRef (an existing decision with status accepted whose context quotes the owner); otherwise risk.acceptance_unrecorded is an error at its acceptedBy field naming the missing parts. An acceptedBy actor, date or decisionRef that does not resolve, or a decisionRef to a decision that is not accepted, is model.invalid_acceptance (error). risk.acceptance_not_owner is a warning at the acceptedBy actor of a risk whose owner is set and differs from the actor. risk.accept_while_open is a warning at a risk status when response is accept and status is open, since the Gemara policy would otherwise list it as accepted while it is open. The Gemara policy lists a risk under risks.accepted only when its acceptance record is complete and resolves (validate.AcceptanceRefs, shared with validation) and its status is accepted, or its response is accept and its status is not open; gemara.validate (CheckGemaraModelConsistency) reports an accepted entry that does not meet this. Imported alias::ID records are skipped; the schema rejects :: in authored risk and threat scenario IDs, so a local ID cannot pose as imported. The record is an authored claim: these checks make it complete and consistent, and human review of the diff that adds it is the actual control that the owner gave it.'
    verificationCriteria: When a risk is accepted without acceptedBy, a risk has response accept with status open, and a threat scenario is accepted without acceptedBy, then validation reports risk.acceptance_unrecorded at both acceptedBy fields and risk.accept_while_open at the open risk, and the Gemara policy lists no accepted risk; once acceptedBy names an actor, a date and a statement, the error is gone and the accepted risk is listed.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-GEMARA-EXPORTER
  - id: REQ-EMG-086
    text: When workspace sync is requested, the engineering model go shall write a go workspace replace directive for each required version of a workspace go module.
    notes: 'engws sync writes, next to the use entries of the family go.work, one line replace <module> <version> => ./<dir> for every Go module of a checkout listed in use and every distinct version at which any checkout''s go.mod requires that module; a module no checkout requires gets no replace. go resolves the go.mod of a required version even when the module is in use, so an unpublished family module fails to build without it; an unversioned replace is rejected for a workspace module. The generated-file header and the hand-written file check are unchanged. A repository''s .github/engmod-check uses its own go.work or GOWORK=off and is not affected.'
    verificationCriteria: When an unpublished interface module with a third-party requirement is required by a service checkout at v0.1.0, then after engws sync go build in the service succeeds under the generated go.work with GOPROXY serving only the third-party module, and go.work holds exactly one replace for the required version.
    appliesTo:
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-087
    text: While mcp server is enabled, when mcp tool call is received, the engineering model go shall return the allowed fields of each entity kind with the model authoring contract.
    notes: 'validate.AuthoringRules (model.authoringContract rules) adds fieldSets, the YAML field names each entity kind accepts (risk, control, threatScenario, flowStep and the others), derived from the strict-decoding Go types, and publicationSections, the manifest publication sections (architecture, behavior, assurance, compliance, requirements, views; decisions cannot be published). fieldRules state that boundaryCrossing true needs trustBoundaryRef (model.missing_flow_boundary_ref), what behavior.event_unused counts as a use (triggered_by targets, semantic relationship sources, targets and triggers, flow and flow step sourceRef and destinationRef, flow step ref; not properties or prose), the lint.multiple_responses field-list exemption (one shall, the list opens with with, including or of, no list item after the first starts a verb with a determiner) and that in strict EARS mode the system term is a catalog system, functional group or functional unit name or alias.'
    verificationCriteria: When the authoring contract is requested, then its rules list the fields of risk (with acceptedBy) and control (id, name, category, description), the six publication sections without decisions, and field rules naming trustBoundaryRef, behavior.event_unused, lint.multiple_responses and the strict EARS system term.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-MCP-SERVER
  - id: REQ-EMG-088
    text: When model updated event is received, the engineering model go shall report each requirement whose linked tests are all environment gated.
    notes: 'A Go test entry point whose first statements include an if whose condition calls os.Getenv, os.LookupEnv or testing.Short and whose body calls t.Skip, t.Skipf or t.SkipNow is gated (the variable name, or testing.Short). A requirement linked from a test file only by gated tests carries that gate in the verification check; a trace row whose every verification is gated for it has gated true and its gates, and the summary counts it in gatedOnly and lists it in gatedOnlyRequirements. testLinked still counts it. The MCP trace.matrix summary returns gatedOnly and gatedOnlyRequirements and its rows gated.'
    verificationCriteria: When one requirement is linked only from a test that skips unless an environment variable is set and another is linked from that test and from an ungated test, then the trace summary has gatedOnly 1 listing only the first requirement, its row is gated with the variable name, and both stay test linked.
    appliesTo:
      - FU-CODEMAP-INFERENCE
      - FU-ALLOCATION-TRACE
      - FU-MCP-SERVER
  - id: REQ-EMG-089
    text: While mcp server is enabled, when mcp tool call is received, the engineering model go shall return mcp tool result from the module model files on disk at call time.
    notes: 'The server fingerprints this module''s model files at load: the manifest, every document it names, the requirements and design paths, and the lock and workspace files next to the manifest (engmod.lock.yml, engmod.lock.local.yml, engmod.work.yml). Before each tools/call it recomputes the fingerprint and reloads the model when it differs; a reload that fails is returned as the call error (-32001) instead of the previous model, and the next call retries. Documents of dependencies resolved from sibling checkouts or the module cache are not fingerprinted: after editing a sibling checkout the client re-sends initialize. Only regular files up to 16 MiB are hashed; a larger file is compared by size and modification time and a non-regular file by its mode.'
    verificationCriteria: When a risk is edited on disk between two gemara.policy calls without a new initialize, then the second call returns the edited risk treatment.
    appliesTo:
      - FU-MCP-SERVER
  - id: REQ-EMG-090
    text: When model updated event is received, the engineering model go shall report each requirement without an upward trace.
    notes: 'No model can know it is top level, because any system may later be used by one above (decision D22, ADR-EMG-028), so every requirement traces through a capability. A requirement traces upward iff (a) it realizes a local capability or assumption of use (or is named by a deprecated capability ref), (b) it is the parent of a reqLinks entry whose child is a dependency capability (alias::CAP-*), or (c) it is derived: true with derivedRationale. Stakeholder sourceRefs do not count, and no model is exempt (inferenceHints.topLevel does not exist; the strict schema rejects it). Otherwise requirement.no_parent is reported at the requirement with a message naming exactly these three options: an error with requirementLinks strict in every model; a warning with guided (the default) only in a model that publishes a contract item or has reqLinks; nothing in a guided standalone model. A realizes target that is a requirement, an imported alias::ID, an interface entry or unknown is requirement.realizes_unknown (error). requirementLinks other than strict or guided is model.invalid_requirement_links (error). The rule needs only the child repository.'
    verificationMethods: [test]
    verificationCriteria: When a strict child model has a requirement that neither realizes a contract item, is the parent of a capability link nor is derived with derivedRationale, then its own check reports requirement.no_parent as an error without the using system present, naming the three options; each of realizes, a capability link parent and derived with rationale alone clears it, sourceRefs alone do not; a guided model with a published capability reports a warning, a guided standalone model none; a manifest with inferenceHints.topLevel fails to load; and a realizes target naming a requirement is requirement.realizes_unknown.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-MODEL-LOADER
  - id: REQ-EMG-091
    text: When model updated event is received, the engineering model go shall load assumptions of use as contract items with their realizing requirements.
    notes: 'contract.assumptions entries have id (AOU-*), text and optional verificationCriteria. They are published in a publication architecture list like capabilities, imported as alias::AOU-* by a composing bundle, and count as contract items: a requirement may realize them and engws bump compares their meaning between versions. Contract items are contract.provides entries of kind capability and the assumptions; interface entries are not link targets.'
    verificationMethods: [test]
    verificationCriteria: When a model declares an assumption of use and a requirement realizes it, then the loaded contract has the assumption, the contract items list it with its realizing requirement, and a using system that composes it reports link.aou_unverified until an evidence link names it.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-SYSTEM-COMPOSITION
  - id: REQ-EMG-092
    text: When model updated event is received, the engineering model go shall report each requirement that realizes a published contract item without being published itself.
    notes: 'contract.realizer_unpublished is an error at a requirement that realizes (through realizes or a deprecated ref) a contract item that a publication exposes, when that publication does not list the requirement under requirements. A using system compares the item with its realizers from the published content alone, so every realizer must be visible to it.'
    verificationMethods: [test]
    verificationCriteria: When a published capability is realized by a requirement missing from the publication requirements list, then validation reports contract.realizer_unpublished at that requirement, and none once it is listed.
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-093
    text: When model updated event is received, the engineering model go shall warn at each published capability without a realizing requirement.
    notes: 'contract.unrealized (warning) names a published capability with no realizing requirement. contract.ref_deprecated (warning) is reported at each contract.provides ref; the ref still counts as a realizer for one release.'
    verificationMethods: [test]
    verificationCriteria: When one published capability has no realizer and another names its requirement in ref, then validation warns contract.unrealized for the first and contract.ref_deprecated at the ref of the second.
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-094
    text: Where system composition is enabled, when model updated event is received, the engineering model go shall validate each requirement link against the manifest dependency pins.
    notes: 'The optional document documents.reqLinks (model/req-links.yml) holds reqLinks entries {id, parent, child, evidence, pinned {version}, status claimed|accepted, rationale, reviewedBy, reviewedOn}, strictly decoded and checked by the CUE schema (pinned.fingerprint is deprecated: still accepted for one release and ignored, REQ-EMG-118). A parent that is no local requirement, a link with neither parent nor evidence, or evidence that is no local ID is link.parent_unknown; a child that is not alias::ID of a declared dependency selected by a composition subsystem is link.child_unpublished; pinned.version other than the dependency version is link.version_mismatch (errors; the link was reviewed at another version and needs review at this one, decision D23); status claimed is link.claimed_only (warning). A dependency version may be a Go-style pseudo-version.'
    verificationMethods: [test]
    verificationCriteria: When a link names an unknown parent, an undeclared dependency, a pin other than the manifest and a claimed status, then validation reports link.parent_unknown, link.child_unpublished, link.version_mismatch and link.claimed_only at those links.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-MODEL-LOADER
  - id: REQ-EMG-095
    text: The engineering model go shall compare the meaning of each contract item with its realizing requirements between two versions.
    notes: 'reqlinks.ItemMeaning is compact JSON {"item":{id,kind,text,verificationCriteria},"realizers":[{id,text,verificationCriteria}...]} with realizers sorted by id, every string whitespace-collapsed and trimmed, case kept, no HTML escaping and no trailing newline; the text of a capability is its note. reqlinks.SameMeaning compares two versions and reqlinks.MeaningChanges names each difference by ID (item kind, item text, item verificationCriteria, <REQ> added, removed, text, verificationCriteria). A realizers status, notes, criticality, verification methods, title, rationale, appliesTo, priority and tags are not compared: they do not change what the item obliges, and a status change must not trigger a review (decision D23). No hash is computed or recorded. A using system compares the published items and realizers (reqlinks.PublishedItems), so a change to a requirement that realizes no linked item never changes one.'
    verificationMethods: [test]
    verificationCriteria: 'When the fixed golden item is serialized, then its meaning equals the pinned JSON; the same meaning results with the realizers shuffled, whitespace changed or a realizers status, notes, criticality or verification methods changed; a change to the item kind, text or criteria, to a realizers text or criteria, or an added or removed realizer is a different meaning named by ID; a change to a realizer title, rationale, priority, tags, appliesTo or status read from a bundle does not change it.'
    appliesTo:
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-096
    text: Where system composition is enabled, the engineering model go shall accept a dependency version that is a release tag or a pseudo-version carrying a commit.
    notes: 'The CUE #ExactVersion and ParseExactModuleVersion accept a canonical semantic version, including Go-style pseudo-versions v1.2.4-0.20261102103400-abcdef123456. A release only uses tags; engws release-check rejects pseudo-versions (REQ-EMG-103).'
    verificationMethods: [test]
    verificationCriteria: When a dependency pins a pseudo-version, then the manifest loads and the module version parses; a version without the v prefix is rejected.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-SYSTEM-COMPOSITION
  - id: REQ-EMG-097
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall report each requirement link whose contract item does not exist at the pinned dependency version.
    notes: 'Composition evaluates each reqLinks entry against the resolved dependency without comparing content (reqlinks.EvaluateLinks, decision D23): unchanged (pin equal to the dependency pin, item published), version_mismatch (the pin differs; reported by validation, REQ-EMG-094), broken (the item does not exist at the dependency pin, also behind a stale pin; link.broken error), child_unpublished (it exists but is not a published capability or assumption of use; link.child_unpublished error), unresolved, or local: a dependency resolved from a workspace replacement is a checkout, not a version, and raises no link finding at all (no link.broken, child_unpublished or aou_unverified), so editing a child in a workspace never churns the system. The diagnostics join the composition diagnostics, so engdoc, engmod-check and model.diagnose report them, one line per link with its ID; they do not stop the lock from being written. link.suspect no longer exists.'
    verificationMethods: [test]
    verificationCriteria: 'When a realizing requirement of a linked capability changes in a workspace checkout of the child, then the system check reports no link finding; when the system is pinned to a published release while a link is reviewed at the previous one, then the check reports link.version_mismatch for it naming engws review-links and no requirement text; when a published release no longer has the linked capability, the system reports link.broken; a link at its pin whose realizer text changed at that pin raises nothing.'
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-098
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall report each dependency assumption of use without an evidence link and each system requirement satisfied by nothing.
    notes: 'link.aou_unverified is reported for every published assumption of use of a composed dependency that no reqLinks entry with evidence names as child. requirement.unsatisfied is reported by the trace integrity check at a requirement of a model with composition subsystems that no code or test of the model links, no reqLinks entry names as parent, no allocation delegates and that is not derived. Both are errors with requirementLinks strict and warnings with guided where links apply (validate.RequirementLinkRules).'
    verificationMethods: [test]
    verificationCriteria: When a child publishes a new assumption of use, then the strict system check fails with link.aou_unverified until a link with evidence names it; a strict system requirement with no code, test, link or derivation is requirement.unsatisfied.
    appliesTo:
      - FU-SYSTEM-COMPOSITION
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-099
    text: While mcp server is enabled, when mcp tool call is received, the engineering model go shall describe requirement links in the model authoring contract.
    notes: 'The authoring contract field rules describe realizes, contract.assumptions, the reqLinks document and the requirementLinks strictness, and fieldSets list contractAssumption, reqLink and reqLinkPin; the reqLinks document is listed when the manifest names it. Each composition.allocations entry is composition.allocation_deprecated (warning) and still materializes as before for one release.'
    verificationMethods: [test]
    verificationCriteria: When the authoring contract is requested, then its field rules name realizes, contract.assumptions, documents.reqLinks and the strictness, and its field sets list the reqLink fields; an allocation is reported as composition.allocation_deprecated.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-MCP-SERVER
  - id: REQ-EMG-100
    text: When dependency bump is requested, the engineering model go shall move the pin of each requirement link whose contract item means the same at the new version and keep the pin of every other link for review.
    notes: 'engws bump <repo> <alias> <version> [--allow-review] [--show] updates the pin, go.mod and lock, then compares each reqLinks entry of the consumer on the bumped alias between its pinned version and the new version, both published and resolved with the workspace off (linkreview.ItemsAtVersion; module cache verified against the registry digest, else the registry), by meaning (reqlinks.SameMeaning, REQ-EMG-095). Decision D23: the same meaning moves pinned.version to the new version (moved); a changed meaning (review, printed with the changes by ID), a pinned version that cannot be resolved (review, saying so) or an item gone at the new version (broken) keeps the old pin, so the model check reports link.version_mismatch (or link.broken) until engws review-links --accept. A link already at the new version is current. One line per link, IDs only; --show adds the item before and after. The bump is written either way; exit 1 when a link needs review, 0 with --allow-review (--allow-suspect is a deprecated alias); any failure restores engmod.yml, go.mod, go.sum, engmod.lock.yml and model/req-links.yml. link.* diagnostics do not block lock regeneration.'
    verificationMethods: [test]
    verificationCriteria: 'When a child release changes only an unrelated requirement and the status and notes of a realizing requirement, then the bump moves every link pin to the new version and the system check passes; when the next release changes a realizing requirements text, then the bump prints that link as review with REQ-A-001 text and no requirement text, exits 1, writes the bump, moves the unchanged link, keeps the changed links pin, and the system check fails with link.version_mismatch only; --show prints the text before and after and --allow-review exits 0; a link whose pinned version is not published is left for review saying so, and one whose item is gone is broken.'
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-101
    text: When link review is requested, the engineering model go shall show the child item change of each requirement link that needs review.
    notes: 'engws review-links [--repo DIR] [--json] [--show] lists every link that needs review (version_mismatch, broken or claimed; linkreview.NeedsReview), composed with the workspace off (the published dependencies; a workspace checkout has no version to review), one line per link: ID, child, state, claimed, pinned and dependency version and what changed in meaning between the item at the pinned version (before) and at the dependency pin (after) by ID, or same meaning, or why it is unknown. --show adds the parent requirement text and the item with its realizing requirements before and after, changed lines marked - and +; --json gives the full reviews. Cached modules are verified against the registrys manifest digest and refetched when it differs, so a version re-staged with other content (engws stage) is seen. Exit 0 when nothing needs review, 1 otherwise. --accept LNK-ID --by ACT-ID --rationale TEXT writes into the requirement link file, editing only the touched lines (yaml.v3 node positions, comments and order kept): pinned.version (the dependency pin), reviewedBy, reviewedOn (today), rationale and status accepted, and removes a deprecated pinned.fingerprint; it refuses an actor the model does not define, an unknown link, a broken link and one whose item is not resolved at the dependency pin with the workspace off (decision D9), writing nothing. After writing it evaluates the link again and exits 1 naming the finding when it still does not pass (for example link.parent_unknown). A file it rewrites keeps its permission bits.'
    verificationMethods: [test]
    verificationCriteria: 'When a link was left for review by a bump, then review-links prints one line with version_mismatch, the versions and REQ-A-001 text and no requirement text, and with --show the parent text and the changed realizer before and after; when it is accepted by a model actor, then the link file carries the dependency pin, the reviewer, the date, the rationale and status accepted, with every other line unchanged, and the system check passes; an unknown actor or a broken link is refused with no change; an accept whose link still fails validation exits 1 naming the finding; a version re-staged with other content is refetched.'
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-102
    text: When contract diff is requested, the engineering model go shall classify each contract item change between two git refs with its semantic version impact.
    notes: 'engws contract-diff <from-ref> <to-ref> [--repo DIR] [--json] reads engmod.yml and every document it names at each ref (git show ref:path, relative to the repository prefix; a ref that is empty or starts with - is refused), loads them with the model loader from a temporary directory (0700, files 0600), and compares the published contract items (reqlinks.PublishedItems): added, removed, changed (text, realizers) or unchanged. Impact: capability removed, capability text changed (printed as "text changed: treated as major"), assumption added, assumption text or verificationCriteria changed, or an item kind changed are major; assumption removed, capability added and changes of realizing requirements only are minor; anything else is patch. Exit 0, or 2 on a usage or IO error.'
    verificationMethods: [test]
    verificationCriteria: When a capability is removed between two tags, then the diff reports it removed and the impact major; a realizer change only is minor; an added assumption is major; an added capability is minor; a capability text change says treated as major.
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-103
    text: When release check is requested, the engineering model go shall reject a release that pins an unreleased dependency or whose tag bump is smaller than its contract diff requires.
    notes: 'engws release-check [--repo DIR] [--tag vX.Y.Z] reports dependency.unreleased_pin (error) for every engmod.yml dependency or engmod.lock.yml version that is a pre-release or pseudo-version, and contract.semver_too_small (error) when the bump of the tag (--tag, else the highest release tag at HEAD) over the previous release tag (the highest release semver tag below it among the tags merged into the released commit, git tag --merged: the nearest ancestor release) is smaller than contract-diff(previous, the tag if it exists, else HEAD) requires. In v0.x (previous and tag major 0) a minor bump is major-capable and a patch bump minor-capable, so a breaking change needs a minor bump. Without a tag or a previous release tag the semver gate is skipped with a note. Exit 0 ok, 1 findings, 2 usage or IO error.'
    verificationMethods: [test]
    verificationCriteria: When a capability is removed and the tag is a minor bump over v1.x, then release-check reports contract.semver_too_small and exits 1, and a major tag passes; in v0.x a minor bump passes; a pseudo-version dependency is dependency.unreleased_pin.
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-104
    text: When link migration is requested, the engineering model go shall convert each deprecated allocation or contract ref into the requirement link model.
    notes: 'engws migrate-links [--repo DIR] [--dry-run] writes one reqLinks entry per composition.allocations entry (id LNK-<requirement without REQ->-<ALIAS> upper case, made unique with -2, -3 ...; the target as child; parent the requirement for a capability, evidence [the requirement] for an assumption of use, so the next check does not report link.aou_unverified; pinned.version the dependency pin; status claimed; rationale from the allocation; a target whose dependency cannot be resolved is still written, with a note that its kind was not checked), creates or extends the requirement link file, adds documents.reqLinks: model/req-links.yml to engmod.yml when missing, removes the converted allocations (D13: an allocation whose resolvable target is an interface or other contract entry that is not a published capability or assumption of use is kept in place, keeps reporting composition.allocation_deprecated and is printed as kept allocation REQ → alias::ID with the reason), appends each capability contract.provides[].ref to realizes of the referenced requirement (deduplicated) and drops the ref; a ref on a non-capability entry or naming an unknown requirement is kept and reported; and removes every deprecated pinned.fingerprint of the existing link file, printing the count (REQ-EMG-118). Every edit keeps the other lines of the files; every file to write is snapshot first and, when one write fails, the files already written are restored and the ones it created removed. It prints the requirements that then report requirement.no_parent (a requirement that became the parent of a capability link is traced, D22). A second run changes nothing; --dry-run writes nothing.'
    verificationMethods: [test]
    verificationCriteria: 'When a system with three allocations and children with capability refs are migrated, then the system has three claimed parent links pinned to the dependency version with no fingerprint and no allocations, each child requirement realizes its capability and no ref remains, the remaining unparented requirements are listed, and a second run reports no change; an allocation to an assumption of use becomes an evidence link that passes link.aou_unverified, and two recorded fingerprints are removed with the count printed.'
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-105
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall report the parents and children of each requirement and roll each linked system requirement up from its realizing child requirements.
    notes: 'trace.Matrix rows carry parents (the contract items a requirement realizes through realizes or a deprecated ref, qualified alias::ID on a published requirement row, none for a requirement traced only by its links or derivation; stakeholder sourceRefs are not parents, D22) and children (for a requirement that is the parent of reqLinks entries: each linked child item alias::CAP-* followed by its realizing requirements alias::REQ-* at the resolved version; none for a child requirement), links (id, child, evaluated state, review status) and satisfiedBy. A requirement with no code or test of its own whose every link is accepted, evaluates unchanged and resolves to an item with realizing requirements that are all implemented (or all test linked) in their own repository trace is implemented (or test linked) with satisfiedBy links (decision D18: a claimed, version-mismatched or broken link gives satisfiedBy links-unreviewed and does not count), linksImplemented and linksTestLinked, is counted in the summary implemented and testLinked, and is no orphan. The summary counts linksNeedReview (each link that is version-mismatched, broken or claimed, once; local workspace links excluded), linksVersionMismatch, linksBroken, linksClaimed and unparented (local requirements that fail the upward-trace rule of REQ-EMG-090 where the requirement link rules apply); linksSuspect is kept as a deprecated alias of linksVersionMismatch (D23). MCP trace.matrix returns the counts, also with summaryOnly, and parents, children, links and satisfiedBy per row.'
    verificationMethods: [test]
    verificationCriteria: 'When every realizing requirement of the items linked to a system requirement has code and a test in its child repository, then the system requirement row lists the linked items and their realizers as children and is implemented and test linked through links, but not when one of its links is claimed or pinned to another version; when a realizer loses its test, then the system requirement is implemented but not test linked; a child requirement row lists the item it realizes as parent; a version-mismatched and a claimed link are counted and, against a published release without a linked item, a broken one, with linksNeedReview counting each link once.'
    appliesTo:
      - FU-ALLOCATION-TRACE
      - FU-MCP-SERVER
  - id: REQ-EMG-106
    text: While mcp server is enabled, when mcp tool call is received, the engineering model go shall return the requirement links of the loaded model with their state and the trace of each requirement through them.
    notes: 'links.list returns every reqLinks entry with id, parent, child, evidence, state (reqlinks.EvaluateLinks at the composed pins; no content comparison, D23), review status, needsReview, local (the dependency is a workspace checkout), pinnedVersion, dependencyVersion, reviewedBy and reviewedOn. links.suspect (name kept for compatibility) returns the links that need review (version_mismatch, broken, claimed) as engws review-links --json does, composed with the workspace off (published dependencies, module cache, offline): parent text, the child item and its realizing requirements before (at the pinned version) and after (at the dependency pin), and changes (the difference in meaning by ID). links.review {linkId, by, rationale?} writes nothing (model.patch refuses the link file, ADR-EMG-029), composes like engws review-links --accept with the workspace off and takes reviewedOn from the server clock: it refuses an actor the model does not define, an unknown and a broken link like engws review-links --accept, and returns the command engws review-links --accept LNK --by ACT --rationale ..., the link file path relative to the model and the line patch the command writes (pinned version, status, rationale, reviewedBy, reviewedOn, a removed fingerprint). requirements.parents {requirementId} returns realizes, parents (the realized items; sourceRefs are no upward trace, D22), sourceRefs, derived, derivedRationale, the links the requirement is parent of with state, status and the linked item (id, kind, text, qualified realizers) and children (each linked item then its realizers). requirements.get adds parents, links and children. Every tool reads only the loaded model and the dependencies it composes, with the lock checked and the module cache reused.'
    verificationMethods: [test]
    verificationCriteria: 'When a realizing requirement of a linked capability changes in a workspace checkout, then links.list reports every link unchanged and local; when outside the workspace the system pins a release with that change while a link is reviewed at the previous one and another link is claimed, then links.list reports the first version_mismatch with needsReview and both versions, links.suspect lists both, the first with the realizer before and after and changes REQ-A-001 text; links.review returns the accept command and a patch moving the pinned version and leaves the link file unchanged and refuses an unknown actor and link; requirements.parents of the system requirement lists its two links with the linked items and their realizers while that of a child requirement lists the capability it realizes and no link.'
    appliesTo:
      - FU-MCP-SERVER
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-107
    text: When generation run is requested, the engineering model go shall render the requirement link tree of a using model and the contract items of a child model without disclosing the users of the child.
    notes: 'A model with reqLinks gets an AsciiDoc chapter "Requirement Links": for each requirement a list item, then each link it is the parent of with its state (unchanged, local, or marked *VERSION MISMATCH* with the reviewed and the dependency version, *BROKEN*, *UNPUBLISHED*) and review status (accepted, or *CLAIMED*), the linked child item alias::ID with its text, and the realizing requirements alias::REQ with their trace status in the dependency (trace.DependencyRequirementStatus), or derived with its rationale, or no requirement link; and "Assumptions of Use" with each dependency assumption and the links whose evidence covers it (*UNVERIFIED* otherwise). A model that publishes contract items gets "Contract Items": each published capability and assumption of use with its text, verification criteria and realizing published requirements (no fingerprint, D23). Only when the caller opts in (AsciiDocOptions.UsedBy, engdoc --used-by; off by default, also when a workspace is found), the render resolves an active workspace (engmod.work.yml found, the workspace not off) and a sibling replacement checkout has reqLinks onto these items through a dependency on this module path, a "Used By" section (item, using model id, link id, parent requirement, status) is added, computed at render time by composition.WorkspaceLinkUsers and never written into the model; a document rendered with it must not be committed into the child (D16). By default a child names no using system in AsciiDoc, Gemara or MCP output. link.* findings and the strict-mode trace findings requirement.no_parent, requirement.unsatisfied and contract.realizer_unpublished are reported but do not stop the render (D15).'
    verificationMethods: [test]
    verificationCriteria: 'When the system of the three-repository fixture is rendered, then its Requirement Links chapter lists each system requirement with its links, linked items and realizing requirements with their status, and the assumption of use with its evidence; when the system pins a newer published release while a link is reviewed at the previous one and another is claimed, then the first is marked version mismatch with both versions and the second claimed; the child Contract Items chapter names no fingerprint; when child-a is rendered with the workspace off, then its AsciiDoc, every Gemara artifact and the MCP requirements.get, requirements.parents and links.list outputs name no system requirement, model id, title or parent text, rendered with the workspace active and no opt-in it names none either, and only with the Used By opt-in and the workspace active it shows Used By with the systems links.'
    appliesTo:
      - FU-ASCIIDOC-GENERATOR
      - FU-SYSTEM-COMPOSITION
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-108
    text: When model updated event is received, the engineering model go shall ignore each workspace file and sibling checkout that another user could have written or that leaves the workspace.
    notes: 'The upward search for engmod.work.yml (FindWorkspaceWith with an empty mode and ENGMOD_WORK unset) refuses a world-writable file and, where the platform has file owners, a file owned by neither the current user nor root, with an error naming ENGMOD_WORK=<path> as the way to use it anyway; an explicit path is used as given. The Used By scan (composition.WorkspaceLinkUsers) reads only replacement directories inside the workspace directory (composition.PathWithin) whose manifest names no path outside its own directory (the dependency confinement, composition.dependency_path_escape), so a crafted workspace or sibling manifest cannot make a render read files elsewhere. The upward search does not stop at a git top-level: a workspace sits above sibling repositories by design.'
    verificationMethods: [test]
    verificationCriteria: When the engmod.work.yml above a project is world-writable or owned by another user, then the upward search fails naming ENGMOD_WORK and the same file given explicitly loads; when a workspace names a replacement outside its directory and a sibling whose link file lies outside its module, then Used By lists neither.
    appliesTo:
      - FU-MODEL-LOADER
      - FU-SYSTEM-COMPOSITION
  - id: REQ-EMG-109
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall report each requirement link whose recorded fingerprint uses another canonical form than the engineering model go writes.
    status: retired
    notes: 'Retired by decision D23 (ADR-EMG-030): links record no fingerprint, so there is no canonical form to be outdated. A recorded pinned.fingerprint is now link.fingerprint_deprecated (REQ-EMG-118); link.fingerprint_outdated no longer exists.'
    verificationMethods: [test]
    verificationCriteria: When a link records an unversioned or a v9 fingerprint of an item that exists, then the link evaluates fingerprint_outdated and the check reports link.fingerprint_outdated naming engws review-links --accept and the link, and no link.suspect.
    appliesTo:
      - FU-ALLOCATION-TRACE
      - FU-SYSTEM-COMPOSITION
  - id: REQ-EMG-110
    text: When generation run is requested, the engineering model go shall render requirement link and contract item text without AsciiDoc passthrough.
    notes: 'Text in the Requirement Links, Assumptions of Use, Contract Items and Used By sections comes partly from dependency models (another repository). Every such string is whitespace-collapsed and its passthrough forms (+++...+++, ++...++, $$...$$, pass:[...] and other pass macros) are broken with {empty}, so it renders literally and cannot emit raw HTML into the document.'
    verificationMethods: [test]
    verificationCriteria: When an item text holds +++<script>+++, ++<b>++, $$<u>$$ or pass:[<i>], then the rendered line holds the text with {empty} inserted and no passthrough, and plain text with a single plus is unchanged.
    appliesTo:
      - FU-ASCIIDOC-GENERATOR
  - id: REQ-EMG-111
    text: When model updated event is received, the engineering model go shall report each accepted requirement link without a resolving reviewer and review date.
    notes: 'A reqLinks entry with status accepted and no reviewedBy or no reviewedOn is link.review_unrecorded (error); a reviewedBy that is not an actor of the model and a reviewedOn that is not a YYYY-MM-DD calendar date are link.review_unrecorded too, at that field. A claimed link may carry neither. engws review-links --accept writes both; the check shows only that a modeled role and a date are recorded, review of the diff shows that the role gave it.'
    verificationMethods: [test]
    verificationCriteria: When an accepted link lacks reviewedBy, another lacks reviewedOn, a third names an unknown actor and a fourth the date 2026-02-30, then validation reports link.review_unrecorded at each, and an accepted link with a model actor and a calendar date and a claimed link without either report nothing.
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-112
    text: When model updated event is received, the engineering model go shall report each requirement link to a capability without a parent requirement.
    notes: 'A link whose child is alias::CAP-* says that the capability satisfies a local requirement, so it needs parent: link.parent_missing (error) otherwise, also when it carries evidence. A link to an assumption of use (alias::AOU-*) may have evidence instead of a parent.'
    verificationMethods: [test]
    verificationCriteria: When a link to a capability has evidence but no parent, then validation reports link.parent_missing; a link to an assumption of use with evidence only reports nothing.
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-113
    text: While mcp server is enabled, when mcp tool call is received, the engineering model go shall write an edit of one model entity only when the edited model is valid.
    notes: 'model.patch {document, id, set?: {field: value}, unset?: [field], append?: {listField: item or [items]}, remove?: {listField: value or [values]}, write?: bool} finds the one list item with that id anywhere in the document (yamledit.FindByID: top-level entities and nested ones such as flow steps; no match or two matches are errors), applies set, unset, append and remove in that order with line-preserving edits (yamledit.SetPath, UnsetPath, AppendPath, RemovePath: dotted field paths such as acceptedBy.statement, a missing field or intermediate mapping is added, a flow list stays a flow list, an object item is removed by its id, comments and every untouched line are kept), validates the whole model with the edited document exactly like model.diagnose, and returns valid, diagnostics, otherDiagnostics, parseErrors, patch (unified diff with three lines of context, git apply format) and written. The input schema is strict (additionalProperties false; field paths ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)*$; write a JSON boolean); setting or unsetting id is refused. Decision ADR-EMG-029: it is the one MCP tool that writes, and only with write true, only a valid result, only a manifest-listed document other than the manifest and the requirement link file (whose write path is engws review-links, D14), only when every manifest document resolves inside the model root after symlinks, only when the file did not change during the call, through an atomic replace that keeps the file mode.'
    verificationMethods: [test]
    verificationCriteria: When model.patch sets a scalar and a nested field and appends a list item without write, then it returns a valid result and a unified diff and the file is unchanged; with write it writes the edit and keeps the comments and the file mode; an edit that makes the model invalid returns diagnostics and is not written; an unknown id, a field path with .., a renamed id, the manifest, the requirement link file and a document that resolves outside the model root are refused with nothing written.
    appliesTo:
      - FU-MCP-SERVER
      - FU-MODEL-CHANGE
  - id: REQ-EMG-114
    text: While mcp server is enabled, when mcp tool call is received, the engineering model go shall scan the same code scope as the model check.
    notes: 'The MCP code tools (coverage.strictStatus, files.forRequirement, files.forControl, files.forThreat, model.implementations, tests.*, interfaces.implementations, code.contextForTask) scan through codescan.ScanCodeScope and codescan.CodeScopeSkip, the skip function the check and the trace use (codeScanSkipper): files git does not track or would ignore (git ls-files --cached --others --exclude-standard), paths matching inferenceHints.exclude and directories of nested modules are left out. Before, the MCP scanner walked repoRoot with only a fixed list of skipped directories, so git-ignored build output (viewer/dist/assets/*.js) failed coverage.strictStatus while the check passed. inferenceHints.exclude accepts dir, dir/, dir/* and dir/** (each leaves the whole directory out), ./dir, a file path and a glob with * ? [...] within one path segment (*.gen.go), relative to the module root; a pattern matches a path and every ancestor directory of it. A pattern the scan cannot apply (empty, absolute, with .., ** other than a trailing /**, a malformed glob) is model.invalid_exclude_pattern (error) at inferenceHints.exclude[i], naming the accepted forms.'
    verificationMethods: [test]
    verificationCriteria: When a git-ignored viewer/dist holds an unmarked JavaScript function and vendor-copy/* is excluded, then coverage.strictStatus passes and files.forRequirement lists only the in-scope file, and an unmarked tracked function still fails it; viewer/dist, viewer/dist/, viewer/dist/*, viewer/dist/** and ./viewer/dist each exclude viewer/dist/assets/app.js and keep viewer/distribution; /abs/dir, ../up/**, **/dist, a/**/b and bad[glob are model.invalid_exclude_pattern naming the accepted forms.
    appliesTo:
      - FU-MCP-SERVER
      - FU-CODEMAP-INFERENCE
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-115
    text: While mcp server is enabled, when mcp tool call is received, the engineering model go shall return the type of every authorable field with the authoring rules.
    notes: 'validate.Rules.fieldTypes (model.authoringContract rules) gives, per fieldSets kind and in the same order, each field as {name, type, of?}: type string, bool, int, list<string>, list<object>, object or map<string,string>, derived by reflection from the strict-decoding Go types (fieldSetTypes); of names the fieldSets kind of an object or list<object> field (flow steps: flowStep; acceptedBy: acceptanceRecord; every *Evidence and *Artifact struct: evidence). fieldSets stays the list of names. The field rules also state: every flow step needs ref (model.missing_flow_step_ref) and step IDs are unique across all flows (model.duplicate_flow_step_id within a flow, semantic.duplicate_identity across flows); threatScenario stride is one string while preconditions, exploitPath, detection and controlVerification findings are lists; catalog.term_unreferenced is reported only with lintRun.mode strict and only for a term no requirement text names, whose ID no architecture, behavior, assurance, compliance, views, decisions, design or aviation string contains and whose name no other authored text contains (so a state referenced by a flow step ref is in use); and the exclude forms of REQ-EMG-114.'
    verificationMethods: [test]
    verificationCriteria: When the authoring rules are requested, then fieldTypes types threatScenario stride as string, preconditions, exploitPath, detection and findings as list<string>, flow steps as list<object> of flowStep, acceptedBy as object of acceptanceRecord and boundaryCrossing as bool, lists exactly the fieldSets fields in order, and the field rules name model.missing_flow_step_ref, unique step IDs across all flows with semantic.duplicate_identity, the catalog.term_unreferenced rule and the exclude forms.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-MCP-SERVER
  - id: REQ-EMG-116
    text: When model updated event is received, the engineering model go shall warn at each acceptance record that names a decision without the owner's statement.
    notes: 'risk.acceptance_by_decision_only (warning) at acceptedBy.statement of a risk or threat scenario whose acceptedBy has a decisionRef but no statement. A decision can bundle an acceptance with other choices, so the owner''s own words accepting this risk belong on the risk; the message asks for acceptedBy.statement and for asking the owner about the risk by name. The record stays complete (no risk.acceptance_unrecorded) and the Gemara policy still lists the risk as accepted. Imported alias::ID records are skipped.'
    verificationMethods: [test]
    verificationCriteria: When a risk and a threat scenario are accepted with a decisionRef and no statement, then each has a risk.acceptance_by_decision_only warning at acceptedBy.statement naming the decision, and a record with both a decisionRef and a statement or with a statement only reports none.
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-117
    text: When model updated event is received, the engineering model go shall warn at each assurance record whose scoring or control trace disagrees with the rest of the model.
    notes: 'Three warnings (validate.assuranceConsistencyDiagnostics). risk.severity_inconsistent at the severity of each threat scenario whose (likelihood, impact) pair, compared case-insensitively, maps to more than one severity among the model''s threat scenarios; the message names the other severities and their scenarios and asks for one scoring method recorded as a decision. Only threat scenarios carry likelihood, impact and severity together: a risk has likelihood, impact and residualRisk but no severity, so risks are not compared. controlVerification.risk_control_unlinked at a riskRefs entry of a control verification that names a local risk whose relatedControls omit the verification''s controlRef (risk-to-control trace in both directions). threat.attack_vector_missing at the attackVectorRef of a threat scenario without one when another local threat scenario names its attack vector. Imported alias::ID records and unknown risks (reported elsewhere) are skipped.'
    verificationMethods: [test]
    verificationCriteria: When threat scenarios rate low likelihood and medium impact as low, Medium-cased medium and low again, then each of the three is risk.severity_inconsistent at its severity, and a high/high scenario and one without a severity are not; when a control verification of CTRL-A names a risk listing CTRL-A, one listing only CTRL-B and an imported risk, then only the second is controlVerification.risk_control_unlinked at its riskRefs entry; when one threat scenario names an attack vector, then the one without is threat.attack_vector_missing, and a model where none names one reports nothing.
    appliesTo:
      - FU-VALIDATION-ENGINE
  - id: REQ-EMG-118
    text: When model updated event is received, the engineering model go shall warn at each requirement link that records a deprecated fingerprint.
    notes: 'Decision D23 (ADR-EMG-030): the pinned version is the review record. pinned.fingerprint is still accepted by the CUE schema for one release (any string, optional) and ignored by every evaluation; validation reports link.fingerprint_deprecated (warning) at reqLinks[i].pinned.fingerprint naming engws migrate-links, which removes it (and prints the count); engws review-links --accept removes it from the link it accepts.'
    verificationMethods: [test]
    verificationCriteria: When one link records a fingerprint and another does not, then validation warns link.fingerprint_deprecated only at the first link's pinned.fingerprint naming engws migrate-links; a fingerprint of any form loads; migrate-links removes two recorded fingerprints and prints the count.
    appliesTo:
      - FU-VALIDATION-ENGINE
      - FU-CLI-ORCHESTRATION
  - id: REQ-EMG-119
    text: When link add is requested, the engineering model go shall write a claimed requirement link pinned to the dependency version after checking its parent and child.
    notes: 'engws link add [--repo DIR] (--parent REQ | --evidence REQ[,REQ]) <alias::CAP-...|alias::AOU-...> [--rationale TEXT] (decision D23): the link id is LNK-<REQ>-<ALIAS> made unique; pinned.version is the dependency pin of the alias in engmod.yml; status claimed. Before writing it validates the model with the link added (parent requirement, evidence IDs, declared and composed alias, a capability link needs a parent) and composes with the workspace off to check the child is a published capability or assumption of use at the pinned version (an assumption needs evidence); it refuses a link that joins the same parent and evidence to the same child. The link is appended to the link file with every other line kept; a model without one gets model/req-links.yml and documents.reqLinks in engmod.yml. Nothing is written on refusal (exit 1).'
    verificationMethods: [test]
    verificationCriteria: When a parent link to a published capability is added, then the link file gains exactly the claimed link pinned to v0.1.0 with a unique id and the rationale and the system check passes; a duplicate, an unknown parent, an unpublished item, a capability with evidence only, an undeclared alias and a missing parent are each refused with no change; in a model without a link file an evidence link to an assumption creates model/req-links.yml and documents.reqLinks.
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-120
    text: While mcp server is enabled, when mcp tool call is received, the engineering model go shall answer a model-reading tool for the family member checkout its repo argument names.
    notes: 'Retro 1104 item 1 (decision D24). The model-reading tools (model.diagnose, model.patch, model.list, model.entity, model.complete, model.authoringContract, entities.list, trace.matrix, composition.resolve, links.*, requirements.*, threats.*, verification.*, flow.detail, flows.forRequirement, graph.*, generation.*, every gemara.*) list an optional repo string in their strict input schema. The engine resolves the workspace on every call with model.FindWorkspaceWith from the server''s own model directory (the upward search refuses a world-writable engmod.work.yml or one owned by another user; ENGMOD_WORK names one explicitly), so a server started before engws sync wrote engmod.work.yml sees it as soon as it exists. repo is relative to the workspace root (the directory of that file, or the server''s own model directory without one) or absolute, must hold engmod.yml and must resolve inside the root after symlinks; the tool then runs on a server initialized on that engmod.yml (cached per directory, reloading its model per call), its output scrubbed relative to that checkout. Without repo the server answers for its own checkout. The file and code tools stay on the server''s own checkout. The MCP bridge of engineering-flow computes the family root once at startup and confines calls to it; it must re-run that per call to benefit.'
    verificationMethods: [test]
    verificationCriteria: When a server on the system starts without engmod.work.yml, then repo . answers for the system and a sibling is refused as outside; after engmod.work.yml is written, trace.matrix, requirements.get, links.list and model.diagnose answer for repos/child-a and child-b, and without repo for the system; ../, an absolute path outside, a symlink out of the root, a symlinked member and a directory without engmod.yml are refused; a world-writable workspace file is refused; every listed tool's input schema has repo.
    appliesTo:
      - FU-MCP-SERVER
  - id: REQ-EMG-121
    text: When model updated event is received, the engineering model go shall warn at each requirement with quantitative verification criteria that only benchmarks verify.
    notes: 'Retro 1104 item 6. The code scanner marks a test entry point that is a benchmark (codemap.Symbol.Benchmark: Go Benchmark* in _test.go, Rust #[bench], now also detected as a test entry point); Criterion benchmarks are plain functions and JS bench files have no test entry-point detection, so neither is classified. A requirement whose every linking test entry point, across all test files, is a benchmark has a trace row with benchmarkOnly; when its verificationCriteria contain a digit, the trace integrity check reports verification.benchmark_only (warning) at requirements[i]: a benchmark measures but asserts nothing, so add a Test that checks the value. A Test* or Fuzz* link in any file clears it. The requirement stays test linked.'
    verificationMethods: [test]
    verificationCriteria: When a requirement with the criterion under 50 microseconds is linked only from a Go Benchmark and another with at most 2 ms only from a Rust bench function, then both rows are benchmarkOnly and both are verification.benchmark_only warnings; a requirement a Test also links, one a Fuzz also links and one a Test links from another file are neither; one whose criteria name no number is benchmarkOnly without the warning.
    appliesTo:
      - FU-CODEMAP-INFERENCE
      - FU-ALLOCATION-TRACE
  - id: REQ-EMG-122
    text: When status suggestion is requested, the engineering model go shall print the status each requirement and control verification earns from the evidence of the tree.
    notes: 'Retro 1104 item 7. engws status-suggest [--repo DIR] [--tree HASH] [--json] writes nothing. The tree is the working-tree hash as engineering-flow tree-hash.mjs computes it (git add -A into a temporary copy of the index, git write-tree; the real index is unchanged), or --tree. Evidence is the trace matrix of the model (lock check, module cache reuse) and the lines of <git top level>/.engflow/red-checks.jsonl with that tree, verdict RED, failure not build and the requirement in reqs (lines without reqs are not attributed). A local requirement earns implemented when code links it (or reviewed links roll it up as implemented); verified when also a test links it that is not environment gated (Row.Gated) and not only benchmarks (Row.BenchmarkOnly) and a RED line names it, or reviewed links roll it up as implemented and test linked; else nothing. A control verification earns pass when it names at least one requirement in verificationRefs and every requirement it names earns verified; a CODE-* reference is not judged and keeps the current status. The table prints current, suggested and why per row; --json the same. Exit 0, 1 on a model or git error.'
    verificationMethods: [test]
    verificationCriteria: When a requirement has code, an ungated test and a RED line for the working tree with an uncommitted file, then it earns verified; one with only a gated test, one with a GREEN line or a RED of another tree earns implemented, a derived one without code nothing; a control verification over an unverified requirement keeps not-run and earns pass once every requirement it names is verified; --tree of another tree credits no RED; nothing in the repository changes.
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
