  - id: REQ-EMG-100
    status: implemented
    text: When dependency bump is requested, the engineering model go shall move the pin of each requirement link whose contract item means the same at the new version and keep the pin of every other link for review.
    notes: 'engws bump <repo> <alias> <version> [--allow-review] [--show] updates the pin, go.mod and lock, then compares each reqLinks entry of the consumer on the bumped alias between its pinned version and the new version, both published and resolved with the workspace off (linkreview.ItemsAtVersion; module cache verified against the registry digest, else the registry), by meaning (reqlinks.SameMeaning, REQ-EMG-095). Decision D23: the same meaning moves pinned.version to the new version (moved); a changed meaning (review, printed with the changes by ID), a pinned version that cannot be resolved (review, saying so) or an item gone at the new version (broken) keeps the old pin, so the model check reports link.version_mismatch (or link.broken) until engws review-links --accept. A link already at the new version is current. One line per link, IDs only; --show adds the item before and after. The bump is written either way; exit 1 when a link needs review, 0 with --allow-review (--allow-suspect is a deprecated alias); any failure restores engmod.yml, go.mod, go.sum, engmod.lock.yml and model/req-links.yml. link.* diagnostics do not block lock regeneration.'
    verificationMethods: [test]
    verificationCriteria: 'When a child release changes only an unrelated requirement and the status and notes of a realizing requirement, then the bump moves every link pin to the new version and the system check passes; when the next release changes a realizing requirements text, then the bump prints that link as review with REQ-A-001 text and no requirement text, exits 1, writes the bump, moves the unchanged link, keeps the changed links pin, and the system check fails with link.version_mismatch only; --show prints the text before and after and --allow-review exits 0; a link whose pinned version is not published is left for review saying so, and one whose item is gone is broken.'
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-REQUIREMENT-LINKS]
  - id: REQ-EMG-101
    status: implemented
    text: When link review is requested, the engineering model go shall show the child item change of each requirement link that needs review.
    notes: 'engws review-links [--repo DIR] [--json] [--show] lists every link that needs review (version_mismatch, broken or claimed; linkreview.NeedsReview), composed with the workspace off (the published dependencies; a workspace checkout has no version to review), one line per link: ID, child, state, claimed, pinned and dependency version and what changed in meaning between the item at the pinned version (before) and at the dependency pin (after) by ID, or same meaning, or why it is unknown. --show adds the parent requirement text and the item with its realizing requirements before and after, changed lines marked - and +; --json gives the full reviews. Cached modules are verified against the registrys manifest digest and refetched when it differs, so a version re-staged with other content (engws stage) is seen. Exit 0 when nothing needs review, 1 otherwise. --accept LNK-ID --by ACT-ID --rationale TEXT writes into the requirement link file, editing only the touched lines (yaml.v3 node positions, comments and order kept): pinned.version (the dependency pin), reviewedBy, reviewedOn (today), rationale and status accepted, and removes a deprecated pinned.fingerprint; it refuses an actor the model does not define, an unknown link, a broken link and one whose item is not resolved at the dependency pin with the workspace off (decision D9), writing nothing. After writing it evaluates the link again and exits 1 naming the finding when it still does not pass (for example link.parent_unknown). A file it rewrites keeps its permission bits.'
    verificationMethods: [test]
    verificationCriteria: 'When a link was left for review by a bump, then review-links prints one line with version_mismatch, the versions and REQ-A-001 text and no requirement text, and with --show the parent text and the changed realizer before and after; when it is accepted by a model actor, then the link file carries the dependency pin, the reviewer, the date, the rationale and status accepted, with every other line unchanged, and the system check passes; an unknown actor or a broken link is refused with no change; an accept whose link still fails validation exits 1 naming the finding; a version re-staged with other content is refetched.'
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-REQUIREMENT-LINKS]
  - id: REQ-EMG-102
    status: implemented
    text: When contract diff is requested, the engineering model go shall classify each contract item change between two git refs with its semantic version impact.
    notes: 'engws contract-diff <from-ref> <to-ref> [--repo DIR] [--json] reads engmod.yml and every document it names at each ref (git show ref:path, relative to the repository prefix; a ref that is empty or starts with - is refused), loads them with the model loader from a temporary directory (0700, files 0600), and compares the published contract items (reqlinks.PublishedItems): added, removed, changed (text, realizers) or unchanged. Impact: capability removed, capability text changed (printed as "text changed: treated as major"), assumption added, assumption text or verificationCriteria changed, or an item kind changed are major; assumption removed, capability added and changes of realizing requirements only are minor; anything else is patch. Exit 0, or 2 on a usage or IO error.'
    verificationMethods: [test]
    verificationCriteria: When a capability is removed between two tags, then the diff reports it removed and the impact major; a realizer change only is minor; an added assumption is major; an added capability is minor; a capability text change says treated as major.
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-REQUIREMENT-LINKS]
  - id: REQ-EMG-103
    status: implemented
    text: When release check is requested, the engineering model go shall reject a release that pins an unreleased dependency or whose tag bump is smaller than its contract diff requires.
    notes: 'engws release-check [--repo DIR] [--tag vX.Y.Z] reports dependency.unreleased_pin (error) for every engmod.yml dependency or engmod.lock.yml version that is a pre-release or pseudo-version, and contract.semver_too_small (error) when the bump of the tag (--tag, else the highest release tag at HEAD) over the previous release tag (the highest release semver tag below it among the tags merged into the released commit, git tag --merged: the nearest ancestor release) is smaller than contract-diff(previous, the tag if it exists, else HEAD) requires. In v0.x (previous and tag major 0) a minor bump is major-capable and a patch bump minor-capable, so a breaking change needs a minor bump. Without a tag or a previous release tag the semver gate is skipped with a note. Exit 0 ok, 1 findings, 2 usage or IO error.'
    verificationMethods: [test]
    verificationCriteria: When a capability is removed and the tag is a minor bump over v1.x, then release-check reports contract.semver_too_small and exits 1, and a major tag passes; in v0.x a minor bump passes; a pseudo-version dependency is dependency.unreleased_pin.
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-REQUIREMENT-LINKS]
  - id: REQ-EMG-104
    status: implemented
    text: When link migration is requested, the engineering model go shall convert each deprecated allocation or contract ref into the requirement link model.
    notes: 'engws migrate-links [--repo DIR] [--dry-run] writes one reqLinks entry per composition.allocations entry (id LNK-<requirement without REQ->-<ALIAS> upper case, made unique with -2, -3 ...; the target as child; parent the requirement for a capability, evidence [the requirement] for an assumption of use, so the next check does not report link.aou_unverified; pinned.version the dependency pin; status claimed; rationale from the allocation; a target whose dependency cannot be resolved is still written, with a note that its kind was not checked), creates or extends the requirement link file, adds documents.reqLinks: model/req-links.yml to engmod.yml when missing, removes the converted allocations (D13: an allocation whose resolvable target is an interface or other contract entry that is not a published capability or assumption of use is kept in place, keeps reporting composition.allocation_deprecated and is printed as kept allocation REQ → alias::ID with the reason), appends each capability contract.provides[].ref to realizes of the referenced requirement (deduplicated) and drops the ref; a ref on a non-capability entry or naming an unknown requirement is kept and reported; and removes every deprecated pinned.fingerprint of the existing link file, printing the count (REQ-EMG-118). Every edit keeps the other lines of the files; every file to write is snapshot first and, when one write fails, the files already written are restored and the ones it created removed. It prints the requirements that then report requirement.no_parent (a requirement that became the parent of a capability link is traced, D22). A second run changes nothing; --dry-run writes nothing.'
    verificationMethods: [test]
    verificationCriteria: 'When a system with three allocations and children with capability refs are migrated, then the system has three claimed parent links pinned to the dependency version with no fingerprint and no allocations, each child requirement realizes its capability and no ref remains, the remaining unparented requirements are listed, and a second run reports no change; an allocation to an assumption of use becomes an evidence link that passes link.aou_unverified, and two recorded fingerprints are removed with the count printed.'
    appliesTo:
      - FU-CLI-ORCHESTRATION
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-REQUIREMENT-LINKS]
  - id: REQ-EMG-105
    status: implemented
    text: Where system composition is enabled, when generation run is requested, the engineering model go shall report the parents and children of each requirement and roll each linked system requirement up from its realizing child requirements.
    notes: 'trace.Matrix rows carry parents (the contract items a requirement realizes through realizes or a deprecated ref, qualified alias::ID on a published requirement row, none for a requirement traced only by its links or derivation; stakeholder sourceRefs are not parents, D22) and children (for a requirement that is the parent of reqLinks entries: each linked child item alias::CAP-* followed by its realizing requirements alias::REQ-* at the resolved version; none for a child requirement), links (id, child, evaluated state, review status) and satisfiedBy. A requirement with no code or test of its own whose every link is accepted, evaluates unchanged and resolves to an item with realizing requirements that are all implemented (or all test linked) in their own repository trace is implemented (or test linked) with satisfiedBy links (decision D18: a claimed, version-mismatched or broken link gives satisfiedBy links-unreviewed and does not count), linksImplemented and linksTestLinked, is counted in the summary implemented and testLinked, and is no orphan. The summary counts linksNeedReview (each link that is version-mismatched, broken or claimed, once; local workspace links excluded), linksVersionMismatch, linksBroken, linksClaimed and unparented (local requirements that fail the upward-trace rule of REQ-EMG-090 where the requirement link rules apply); linksSuspect is kept as a deprecated alias of linksVersionMismatch (D23). MCP trace.matrix returns the counts, also with summaryOnly, and parents, children, links and satisfiedBy per row.'
    verificationMethods: [test]
    verificationCriteria: 'When every realizing requirement of the items linked to a system requirement has code and a test in its child repository, then the system requirement row lists the linked items and their realizers as children and is implemented and test linked through links, but not when one of its links is claimed or pinned to another version; when a realizer loses its test, then the system requirement is implemented but not test linked; a child requirement row lists the item it realizes as parent; a version-mismatched and a claimed link are counted and, against a published release without a linked item, a broken one, with linksNeedReview counting each link once.'
    appliesTo:
      - FU-ALLOCATION-TRACE
      - FU-MCP-SERVER
    realizes: [CAP-EMG-REQUIREMENT-LINKS]
  - id: REQ-EMG-106
    status: implemented
    text: While mcp server is enabled, when mcp tool call is received, the engineering model go shall return the requirement links of the loaded model with their state and the trace of each requirement through them.
    notes: 'links.list returns every reqLinks entry with id, parent, child, evidence, state (reqlinks.EvaluateLinks at the composed pins; no content comparison, D23), review status, needsReview, local (the dependency is a workspace checkout), pinnedVersion, dependencyVersion, reviewedBy and reviewedOn. links.suspect (name kept for compatibility) returns the links that need review (version_mismatch, broken, claimed) as engws review-links --json does, composed with the workspace off (published dependencies, module cache, offline): parent text, the child item and its realizing requirements before (at the pinned version) and after (at the dependency pin), and changes (the difference in meaning by ID). links.review {linkId, by, rationale?} writes nothing (model.patch refuses the link file, ADR-EMG-029), composes like engws review-links --accept with the workspace off and takes reviewedOn from the server clock: it refuses an actor the model does not define, an unknown and a broken link like engws review-links --accept, and returns the command engws review-links --accept LNK --by ACT --rationale ..., the link file path relative to the model and the line patch the command writes (pinned version, status, rationale, reviewedBy, reviewedOn, a removed fingerprint). requirements.parents {requirementId} returns realizes, parents (the realized items; sourceRefs are no upward trace, D22), sourceRefs, derived, derivedRationale, the links the requirement is parent of with state, status and the linked item (id, kind, text, qualified realizers) and children (each linked item then its realizers). requirements.get adds parents, links and children. Every tool reads only the loaded model and the dependencies it composes, with the lock checked and the module cache reused.'
    verificationMethods: [test]
    verificationCriteria: 'When a realizing requirement of a linked capability changes in a workspace checkout, then links.list reports every link unchanged and local; when outside the workspace the system pins a release with that change while a link is reviewed at the previous one and another link is claimed, then links.list reports the first version_mismatch with needsReview and both versions, links.suspect lists both, the first with the realizer before and after and changes REQ-A-001 text; links.review returns the accept command and a patch moving the pinned version and leaves the link file unchanged and refuses an unknown actor and link; requirements.parents of the system requirement lists its two links with the linked items and their realizers while that of a child requirement lists the capability it realizes and no link.'
    appliesTo:
      - FU-MCP-SERVER
      - FU-ALLOCATION-TRACE
    realizes: [CAP-EMG-MCP-INTEGRATION]
  - id: REQ-EMG-107
    status: implemented
    text: When generation run is requested, the engineering model go shall render the requirement link tree of a using model and the contract items of a child model without disclosing the users of the child.
    notes: 'A model with reqLinks gets an AsciiDoc chapter "Requirement Links": for each requirement a list item, then each link it is the parent of with its state (unchanged, local, or marked *VERSION MISMATCH* with the reviewed and the dependency version, *BROKEN*, *UNPUBLISHED*) and review status (accepted, or *CLAIMED*), the linked child item alias::ID with its text, and the realizing requirements alias::REQ with their trace status in the dependency (trace.DependencyRequirementStatus), or derived with its rationale, or no requirement link; and "Assumptions of Use" with each dependency assumption and the links whose evidence covers it (*UNVERIFIED* otherwise). A model that publishes contract items gets "Contract Items": each published capability and assumption of use with its text, verification criteria and realizing published requirements (no fingerprint, D23). Only when the caller opts in (AsciiDocOptions.UsedBy, engdoc --used-by; off by default, also when a workspace is found), the render resolves an active workspace (engmod.work.yml found, the workspace not off) and a sibling replacement checkout has reqLinks onto these items through a dependency on this module path, a "Used By" section (item, using model id, link id, parent requirement, status) is added, computed at render time by composition.WorkspaceLinkUsers and never written into the model; a document rendered with it must not be committed into the child (D16). By default a child names no using system in AsciiDoc, Gemara or MCP output. link.* findings and the strict-mode trace findings requirement.no_parent, requirement.unsatisfied and contract.realizer_unpublished are reported but do not stop the render (D15).'
    verificationMethods: [test]
    verificationCriteria: 'When the system of the three-repository fixture is rendered, then its Requirement Links chapter lists each system requirement with its links, linked items and realizing requirements with their status, and the assumption of use with its evidence; when the system pins a newer published release while a link is reviewed at the previous one and another is claimed, then the first is marked version mismatch with both versions and the second claimed; the child Contract Items chapter names no fingerprint; when child-a is rendered with the workspace off, then its AsciiDoc, every Gemara artifact and the MCP requirements.get, requirements.parents and links.list outputs name no system requirement, model id, title or parent text, rendered with the workspace active and no opt-in it names none either, and only with the Used By opt-in and the workspace active it shows Used By with the systems links.'
