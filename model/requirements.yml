    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-141
    status: implemented
    text: When generation run is requested, the engineering model go shall generate one deterministic Quint module for each machine.
    notes: 'ADR-EMG-040. One .qnt module per machine, byte-identical for the same model. The first line is the comment Generated by engineering-model-go from <machine ID>; do not edit. Variables are prefixed v_ and IDs are sanitised to snake_case for identifiers only; a lastTransition str variable carries the TR-* ID of the last step; every variable is assigned in every action, with explicit unchanged assignments; each invariant is a val named inv_ plus the snake case of its INV-* ID (the requirements it protects are named in a comment, and there is no combined inv_all); each state gets a reachability witness wit_<state>. Guards, effects and invariants are rendered from the expression trees with the shared operator table. New package internal/export/quint, root facade api_quint.go.'
    verificationMethods: [test]
    verificationCriteria: When a machine with two variables, three states and two transitions is generated twice, then both modules are byte-identical, start with the generated comment naming the machine ID, prefix the variables with v_, assign every variable in every action, define inv_ and wit_ values and set lastTransition to the TR-* ID; an ID with a hyphen is sanitised to snake_case in identifiers only; a Quint typecheck of the module passes.
    appliesTo:
      - FU-QUINT-EXPORTER
    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-142
    status: implemented
    text: When generation run is requested, the engineering model go shall generate Quint modules with engquint generate and check them with engquint check, exiting 0 on pass, 1 on a violation, a stale or drifted module or a vacuous trace and 2 on a setup error.
    notes: 'ADR-EMG-040 and ADR-EMG-041. cmd/engquint has the subcommands generate and check. The output directory is a CLI flag: manifest.cue has no generator-output configuration, and generated/quint/ is the path the scripts use. A setup error (missing quint, a version that cannot be read, missing Apalache or Java in verify mode, an unreadable model; the pinned quint version is enforced by scripts/install-quint-toolchain.sh) exits 2 and never counts as a pass.'
    verificationMethods: [test]
    verificationCriteria: When engquint generate runs on a model with one machine, then it writes the module under the output flag and exits 0; when check passes it exits 0, when an invariant is violated or a result is stale it exits 1, and when quint is not installed or the model does not load it exits 2.
    appliesTo:
      - FU-QUINT-EXPORTER
    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-143
    status: implemented
    text: When generation run is requested, the engineering model go shall run Quint on the TypeScript backend once for each invariant.
    notes: 'ADR-EMG-040 and ADR-EMG-041. quint run --backend=typescript is mandatory: the default Rust backend downloads its binary at run time. One quint run per invariant, with --max-steps, --max-samples, --seed, --invariant and --witnesses, so a violation names one invariant. A trace of length zero (an unsatisfiable initial state) is an error, not a pass, because it checks nothing; a trace of length one (no transition is enabled in the initial state) is a deadlock warning. One witnesses run per machine reports the reachability of each state; the initial state is never reported as unreachable. The counterexample states carry lastTransition, so the report lists the TR-* IDs in order.'
    verificationMethods: [test]
    verificationCriteria: When a machine with two invariants is checked in run mode, then quint is called once per invariant and once for the witnesses, each with --backend=typescript and the bounds and seed; an unsatisfiable initial state gives an error for the zero-length trace and a deadlocked initial state a warning; a violated invariant reports the ordered TR-* IDs of the counterexample; a witness that is never reached is reported.
    appliesTo:
      - FU-QUINT-EXPORTER
    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-144
    status: implemented
    text: When generation run is requested, the engineering model go shall verify each machine in verify mode against a pre-provisioned pinned Apalache without a download at run time.
    notes: 'ADR-EMG-041 and ADR-EMG-044. quint verify uses Apalache 0.62.4, provisioned beforehand under QUINT_HOME, offline, and needs Java 21 or later. If the pinned Apalache or Java is missing, engquint exits 2 with the missing item and does not fetch it. quint verify reports a deadlock as a violation, so verify runs with the Apalache option no-deadlock. Owner statement of 2026-11-12 (verbatim): "all the tools are approved use them in CI even if you cannot install them here now." The pins (quint npm 0.33.1, Apalache 0.62.4 tarball sha256 8ac8488422c30d552735bae11b92a2d014d8e02e8608702acc08f9a2d8a9abb2, Temurin JDK 21) were chosen by the implementing agent and await the owner confirmation.'
    verificationMethods: [test]
    verificationCriteria: When verify mode runs with a fake quint that records its environment, then it passes the QUINT_HOME of the provisioned Apalache and no network fetch is attempted; with Apalache or Java 21 missing it exits 2 naming the missing tool; a verify counterexample is mapped to TR-* IDs like a run counterexample.
    appliesTo:
      - FU-QUINT-EXPORTER
    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-145
    status: implemented
    text: When generation run is requested, the engineering model go shall record each Quint result with the sha256 of its module so that a stale result is no evidence.
    notes: 'ADR-EMG-041 and ADR-EMG-042. The results file holds, per machine and invariant, the verdict, the sha256 of the .qnt it was produced from, the quint version, backend, mode (run or verify), the bounds (max-steps, max-samples) and the seed. A result whose sha256 differs from the committed module is stale: it is never evidence, and check warns with the machine and invariant.'
    verificationMethods: [test]
    verificationCriteria: When a result is written for a module and the module is then changed, then check reports the result as stale with a warning and exit 1, and the result is not evidence; the results file holds the sha256, quint version, backend, mode, bounds and seed.
    appliesTo:
      - FU-QUINT-EXPORTER
    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-146
    status: implemented
    text: When model updated event is received, the engineering model go shall count a passing non-stale formal result as analysis evidence for the linked requirement in the trace matrix.
    notes: 'ADR-EMG-042. engquint check writes a sha-verified result into test-results/ with kind formal; internal/trace and the codescan inferred verification read it. A pass whose sha256 matches the module is analysis evidence for each REQ-* the invariant is linked to; a stale result is not evidence, and a failed result is recorded as failed, so the requirement is failed and never unverified (ADR-EMG-045 item 20). The tier policy and the verification status roll-up treat it like any other verification entry. A result is current only if the named module is a generated Quint module of that machine inside the model root (ADR-EMG-045 items 42 to 44).'
    verificationMethods: [test]
    verificationCriteria: When a formal result passes for an invariant linked to a requirement and its sha256 matches the module, then the trace matrix lists analysis evidence for that requirement; when the sha256 differs, then no evidence is listed and the result is reported as stale; when the verdict is failed, then the requirement result is failed and not unverified.
    appliesTo:
      - FU-ALLOCATION-TRACE
      - FU-CODEMAP-INFERENCE
    realizes: [CAP-EMG-FORMAL-BEHAVIOR]
  - id: REQ-EMG-147
