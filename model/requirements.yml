    notes: 'lint.multiple_responses from ears-lint-go is dropped when the text has one shall and no semicolon, no and, or or comma comes before the first with, including or of in the response, that field list holds no then, and no list item after the first reads as a verb with its object (its second word is the, a, an, its, their, each, every or all). "publish one world state message with UTC time, latitude, longitude and altitude" is not reported; "log the event and notify the operator", "log the event with the timestamp and notify the operator" and "stop all of the motors and close the valve" still are.'
