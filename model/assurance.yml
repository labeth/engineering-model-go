schemaVersion: 2
assurance:
  attackVectors:
  - id: AV-MALFORMED-MODEL-INPUT
    name: Malformed Model Input
    description: Invalid or ambiguous model content causing incorrect parsing or graph interpretation.
  - id: AV-SCHEMA-SUPPLY-CHAIN-TAMPER
    name: Schema Supply Chain Tamper
    description: Drift or tampering in external schemas used by export validation.
  - id: AV-PATH-TRAVERSAL-IN-MCP
    name: Path Traversal in MCP Calls
    description: Attempts to read files outside repository root via MCP path arguments.
  - id: AV-TRACEABILITY-GAP-DRIFT
    name: Traceability Gap Drift
    description: Requirement and verification links diverge from implementation over time.
  - id: AV-UNTRUSTED-CHECKOUT-CONTENT
    name: Untrusted Checkout Content
    description: Crafted files in a scanned repository or sibling checkout (go.mod, Markdown, Dockerfiles, symlinks, FIFOs,
      oversized files) that the tools read and copy into generated files or the trace.
  - id: AV-FALSE-ACCEPTANCE-CLAIM
    name: False Acceptance Claim
    description: A model edit (by a person or an AI agent) that records a risk or threat as accepted without the owner's
      acceptance, so exports present the risk as treated.
  - id: AV-COMPOSED-MODEL-CONTENT
    name: Composed Model Content
    description: Content of another model in the composition (a dependency's published contract, a sibling checkout's
      requirement links, a workspace file, git refs) that the tools read, compare, render or act on across the boundary
      between a child model and the systems that use it.
  controls:
  - id: CTRL-MCP-PATH-BOUNDARY
    name: MCP Path Boundary Enforcement
    category: input-validation
    description: Enforce repo-root path constraints and reject traversal paths in MCP tools.
  - id: CTRL-STRICT-MCP-INPUT-SCHEMA
    name: Strict MCP Input Schemas
    category: input-validation
    description: Enforce per-tool input schema and reject unknown arguments.
  - id: CTRL-TRACEABILITY-COVERAGE
    name: Requirement Traceability Coverage
    category: assurance
    description: Require requirement-linked verification evidence for modeled behavior.
  - id: CTRL-TRACE-LINK-INTEGRITY
    name: Trace Link Integrity
    category: assurance
    description: Reject code trace links (TRLC-LINKS, ENGMODEL-LINKS) that resolve to no requirement or model element, and
      export a consolidated traceability matrix with an implemented, verified, delegated, and orphan rollup.
  - id: CTRL-ARTIFACT-FRESHNESS-GATE
    name: Generated Artifact Freshness Gate
    category: assurance
    description: Generate artifacts deterministically and fail continuous integration when regenerated documents differ from
      the committed artifacts.
  - id: CTRL-GO-WORK-INPUT-VALIDATION
    name: Go Workspace Input Validation
    category: input-validation
    description: Write only Go module paths and versions that pass golang.org/x/mod/module checks into go.work; skip the
      checkout or require otherwise, with a warning.
  - id: CTRL-ARTIFACT-SCAN-BOUNDS
    name: Artifact Scan Bounds
    category: input-validation
    description: Read trace markers only from regular artifact files up to the size cap, split on bytes without a line
      limit, and only outside Markdown code blocks (CommonMark fence lengths, indented code).
  - id: CTRL-ACCEPTANCE-RECORD-CHECK
    name: Owner Acceptance Record Check
    category: assurance
    description: Require a complete, resolving acceptedBy record (existing actor, calendar date, accepted decision) for every
      accepted risk and threat scenario, warn when the actor is not the risk owner, and list only such risks as accepted in
      the Gemara policy. Human review of the diff that adds the record remains the control that the owner gave it.
  - id: CTRL-CHILD-USER-NONDISCLOSURE
    name: Child User Non-Disclosure
    category: confidentiality
    description: Render, export and MCP output of a child model names none of its users by default; the Used By section
      is an explicit render-time opt-in (engdoc --used-by) that reads only checkouts inside the active workspace, confined
      like dependencies, and must not be committed into the child.
  - id: CTRL-FINGERPRINT-COVERAGE
    name: Contract Item Fingerprint Coverage
    category: integrity
    description: The versioned contract item fingerprint (sha256:v1) covers every field that changes what an item or a
      realizing requirement obliges (item kind, text and criteria; realizer text, notes, verification criteria and
      methods, criticality and status), so a hidden child change makes the link suspect; another canonical form is
      reported, never compared.
  - id: CTRL-LINK-REVIEW-RECORD
    name: Requirement Link Review Record
    category: assurance
    description: An accepted requirement link carries a reviewer that is a model actor and a calendar review date
      (link.review_unrecorded otherwise); only engws review-links --accept writes one, from the published dependency at its
      pin, and only accepted unchanged links count toward the trace roll-up. Review of the diff remains the control that
      the reviewer gave it.
  - id: CTRL-REPO-LOCAL-WRITES
    name: Repository-Local Model Writes
    category: input-validation
    description: The commands that write model files (review-links --accept, migrate-links, bump) write only the model's own
      files through an atomic replace that keeps their mode and restore every file on a failed write. In the MCP server
      only model.patch writes, with write true, a valid result, into a manifest document (not engmod.yml or the link file)
      that resolves inside the model root (ADR-EMG-029); links.review returns a patch.
  - id: CTRL-GIT-REF-VALIDATION
    name: Git Ref Validation
    category: input-validation
    description: A git ref given to contract-diff or release-check is refused when empty or starting with "-" and must
      verify as a commit before git show reads anything, so it cannot be read as a git option.
  risks:
  - id: RISK-MCP-PATH-ESCAPE
    title: MCP path traversal exposes non-repository files
    statement: An attacker uses crafted MCP path arguments to read files outside the repository workspace.
    status: mitigating
    likelihood: medium
    impact: high
    response: mitigate
    owner: ACT-ARCHITECTURE-AUTHOR
    appliesTo:
    - FU-MCP-SERVER
    relatedControls:
    - CTRL-MCP-PATH-BOUNDARY
    - CTRL-STRICT-MCP-INPUT-SCHEMA
    attackVectors:
    - AV-PATH-TRAVERSAL-IN-MCP
    threatScenarios:
    - TS-MCP-PATH-TRAVERSAL
    residualRisk: low
    rationale: Path boundary enforcement and strict input schemas reduce exposure to low residual risk.
  - id: RISK-TRACEABILITY-DRIFT
    title: Traceability drift weakens assurance evidence
    statement: Code and tests evolve without updating requirement trace markers, eroding coverage evidence.
    status: mitigating
    likelihood: medium
    impact: medium
    response: mitigate
    owner: ACT-COMPLIANCE-ENGINEER
    appliesTo:
    - FU-CODEMAP-INFERENCE
    relatedControls:
    - CTRL-TRACEABILITY-COVERAGE
    - CTRL-TRACE-LINK-INTEGRITY
    attackVectors:
    - AV-TRACEABILITY-GAP-DRIFT
    threatScenarios:
    - TS-TRACEABILITY-DRIFT
    residualRisk: low
    rationale: Strict code-linking coverage, dangling-link rejection, and inferred verification keep drift detectable.
  - id: RISK-STALE-ARTIFACTS
    title: Stale generated artifacts misrepresent the system
    statement: Generated documentation or exchange artifacts fall out of sync with the authored model.
    status: mitigating
    likelihood: low
    impact: medium
    response: mitigate
    owner: ACT-ARCHITECTURE-AUTHOR
    appliesTo:
    - FU-CLI-ORCHESTRATION
    relatedControls:
    - CTRL-TRACEABILITY-COVERAGE
    - CTRL-ARTIFACT-FRESHNESS-GATE
    residualRisk: low
    rationale: Deterministic generation plus the CI freshness gate fail the build when committed artifacts drift from the
      model.
  poamItems:
  - id: POAM-MCP-PATH-FUZZING
    riskRef: RISK-MCP-PATH-ESCAPE
    milestone: Add fuzz coverage for MCP path normalization
    dueDate: 2026-09-30
    status: planned
    responsibleRole: ACT-ARCHITECTURE-AUTHOR
    artifacts:
    - path: internal/mcp/server_test.go
      description: Path-boundary test coverage to extend with fuzzing.
  - id: POAM-TRACE-COVERAGE-GATE
    riskRef: RISK-TRACEABILITY-DRIFT
    milestone: Enforce strict trace coverage in the CI gate
    dueDate: 2026-08-31
    status: in-progress
    responsibleRole: ACT-COMPLIANCE-ENGINEER
    artifacts:
    - path: internal/codemap/scan.go
      description: Strict code-linking scanner backing the coverage gate.
  trustBoundaries:
  - id: TB-REPO-WORKSPACE
    name: Repository Workspace Boundary
    description: Boundary limiting file operations to repository-root owned paths.
    boundaryType: filesystem
    members:
    - FU-MCP-SERVER
    - FU-CODEMAP-INFERENCE
  - id: TB-EXTERNAL-VALIDATION-TOOLS
    name: External Validation Tools Boundary
    description: Boundary for external validators, schemas, and compliance toolchains.
    boundaryType: external-tooling
    members:
    - REF-THREAT-DRAGON-SCHEMAS
    - REF-OPEN-OTM-SCHEMA
    - REF-STRUCTURIZR-VALIDATOR
    - REF-TRLC-TOOLCHAIN
    - REF-LOBSTER-TOOLCHAIN
  - id: TB-CHILD-USING-SYSTEM
    name: Child and Using System Boundary
    description: Boundary between a child model, published and reused without knowing its users, and each system that
      composes it and links its requirements to the child's contract items. Neither side writes into the other; each reads
      only what the other publishes.
    boundaryType: repository
    members:
    - FU-SYSTEM-COMPOSITION
    - FU-ALLOCATION-TRACE
    - FU-ASCIIDOC-GENERATOR
  threatScenarios:
  - id: TS-MCP-PATH-TRAVERSAL
    title: MCP path traversal accesses non-repo files
    summary: Untrusted MCP input attempts to escape repo root for sensitive file reads.
    category: input-validation
    stride: tampering
    attackVectorRef: AV-PATH-TRAVERSAL-IN-MCP
    appliesTo:
    - FU-MCP-SERVER
    flowRefs:
    - FLOW-MODEL-CHANGE-TO-VERIFIED-ARTIFACTS
    likelihood: medium
    impact: high
    severity: high
    status: mitigating
    owner: ACT-ARCHITECTURE-AUTHOR
    relatedControls:
    - CTRL-MCP-PATH-BOUNDARY
    - CTRL-STRICT-MCP-INPUT-SCHEMA
    verificationRefs:
    - VER-MCP-PATH-BOUNDARY
  - id: TS-TRACEABILITY-DRIFT
    title: Requirement traceability drifts from implementation
    summary: Code and tests change without corresponding requirement trace updates.
    category: assurance
    stride: repudiation
    attackVectorRef: AV-TRACEABILITY-GAP-DRIFT
    appliesTo:
    - FU-CODEMAP-INFERENCE
    - FU-TRLC-EXPORTER
    - FU-LOBSTER-EXPORTER
    likelihood: medium
    impact: medium
    severity: medium
    status: mitigating
    owner: ACT-COMPLIANCE-ENGINEER
    relatedControls:
    - CTRL-TRACEABILITY-COVERAGE
    verificationRefs:
    - VER-TRACEABILITY-COVERAGE
  - id: TS-GO-WORK-INJECTION
    title: Crafted go.mod injects go.work directives
    summary: A sibling checkout's go.mod declares a quoted module or require path with a line break, so engws sync writes
      an extra use or replace directive into the generated go.work.
    category: input-validation
    stride: tampering
    attackVectorRef: AV-UNTRUSTED-CHECKOUT-CONTENT
    appliesTo:
    - FU-CLI-ORCHESTRATION
    likelihood: low
    impact: high
    severity: medium
    status: mitigating
    owner: ACT-ARCHITECTURE-AUTHOR
    relatedControls:
    - CTRL-GO-WORK-INPUT-VALIDATION
    verificationRefs:
    - VER-GO-WORK-INPUT-VALIDATION
  - id: TS-ARTIFACT-PARSE-ABUSE
    title: Crafted repository artifacts mislead or stall the code scan
    summary: A Markdown or container file in a scanned repository claims implementation through markers inside code
      blocks, hides markers after an over-long line, or is a symlink, FIFO or very large file that the scan follows or
      reads without bound.
    category: input-validation
    stride: tampering
    attackVectorRef: AV-UNTRUSTED-CHECKOUT-CONTENT
    appliesTo:
    - FU-CODEMAP-INFERENCE
    - FU-MCP-SERVER
    likelihood: medium
    impact: medium
    severity: medium
    status: mitigating
    owner: ACT-COMPLIANCE-ENGINEER
    relatedControls:
    - CTRL-ARTIFACT-SCAN-BOUNDS
    verificationRefs:
    - VER-ARTIFACT-SCAN-BOUNDS
  - id: TS-FALSE-RISK-ACCEPTANCE
    title: Risk recorded as accepted without the owner
    summary: A model edit sets a risk or threat scenario to accepted with a missing, unresolvable or non-owner acceptance
      record, and the Gemara policy lists it under risks.accepted.
    category: assurance
    stride: repudiation
    attackVectorRef: AV-FALSE-ACCEPTANCE-CLAIM
    appliesTo:
    - FU-VALIDATION-ENGINE
    - FU-GEMARA-EXPORTER
    likelihood: medium
    impact: high
    severity: high
    status: mitigating
    owner: ACT-COMPLIANCE-ENGINEER
    relatedControls:
    - CTRL-ACCEPTANCE-RECORD-CHECK
    verificationRefs:
    - VER-ACCEPTANCE-RECORD-CHECK
  - id: TS-CHILD-USER-DISCLOSURE
    title: A child's outputs disclose its users
    summary: A child's generated document, Gemara export or MCP answer names the systems that use it, their requirements
      or parent texts (for example a Used By section rendered in a workspace and committed into the child).
    category: confidentiality
    stride: information_disclosure
    attackVectorRef: AV-COMPOSED-MODEL-CONTENT
    appliesTo:
    - FU-ASCIIDOC-GENERATOR
    - FU-GEMARA-EXPORTER
    - FU-MCP-SERVER
    likelihood: medium
    impact: medium
    severity: medium
    status: mitigating
    owner: ACT-ARCHITECTURE-AUTHOR
    relatedControls:
    - CTRL-CHILD-USER-NONDISCLOSURE
    verificationRefs:
    - VER-CHILD-USER-NONDISCLOSURE
  - id: TS-HIDDEN-CHILD-CHANGE
    title: A child change escapes the link fingerprint
    summary: A child changes what a linked capability or a realizing requirement obliges in a field the fingerprint does
      not cover, so the using system's link stays unchanged and nobody reviews it.
    category: integrity
    stride: tampering
    attackVectorRef: AV-COMPOSED-MODEL-CONTENT
    appliesTo:
    - FU-ALLOCATION-TRACE
    likelihood: medium
    impact: high
    severity: high
    status: mitigating
    owner: ACT-COMPLIANCE-ENGINEER
    relatedControls:
    - CTRL-FINGERPRINT-COVERAGE
    verificationRefs:
    - VER-FINGERPRINT-COVERAGE
  - id: TS-FALSE-LINK-ACCEPTANCE
    title: A requirement link recorded as reviewed without a review
    summary: A model edit (by a person or an AI agent) sets a link to accepted without a resolving reviewer or date, or
      re-stamps it from a workspace checkout instead of the published dependency, so the trace counts an unreviewed link.
    category: assurance
    stride: repudiation
    attackVectorRef: AV-FALSE-ACCEPTANCE-CLAIM
    appliesTo:
    - FU-VALIDATION-ENGINE
    - FU-ALLOCATION-TRACE
    - FU-MCP-SERVER
    likelihood: medium
    impact: high
    severity: high
    status: mitigating
    owner: ACT-COMPLIANCE-ENGINEER
    relatedControls:
    - CTRL-LINK-REVIEW-RECORD
    verificationRefs:
    - VER-LINK-REVIEW-RECORD
  - id: TS-LINK-WRITE-OUTSIDE-REPO
    title: Link tooling writes outside the model
    summary: A crafted workspace, sibling manifest or interrupted migration makes review-links, migrate-links or the
      MCP server write, read or leave half-written files outside the model's own repository.
    category: input-validation
    stride: tampering
    attackVectorRef: AV-COMPOSED-MODEL-CONTENT
    appliesTo:
    - FU-CLI-ORCHESTRATION
    - FU-MCP-SERVER
    - FU-SYSTEM-COMPOSITION
    likelihood: low
    impact: high
    severity: medium
    status: mitigating
    owner: ACT-ARCHITECTURE-AUTHOR
    relatedControls:
    - CTRL-REPO-LOCAL-WRITES
    verificationRefs:
    - VER-REPO-LOCAL-WRITES
  - id: TS-GIT-REF-OPTION-INJECTION
    title: A git ref is read as a git option
    summary: A ref given to contract-diff or release-check (for example from a CI variable) starts with "-", so git show
      or rev-parse runs with an option such as --output that writes a file.
    category: input-validation
    stride: tampering
    attackVectorRef: AV-COMPOSED-MODEL-CONTENT
    appliesTo:
    - FU-CLI-ORCHESTRATION
    likelihood: low
    impact: medium
    severity: low
    status: mitigating
    owner: ACT-ARCHITECTURE-AUTHOR
    relatedControls:
    - CTRL-GIT-REF-VALIDATION
    verificationRefs:
    - VER-GIT-REF-VALIDATION
  threatMitigations:
  - id: TM-MCP-PATH-BOUNDARY
    threatScenarioRef: TS-MCP-PATH-TRAVERSAL
    controlRef: CTRL-MCP-PATH-BOUNDARY
    status: implemented
    effectiveness: high
    owner: ACT-ARCHITECTURE-AUTHOR
    verificationRefs:
    - VER-MCP-PATH-BOUNDARY
  - id: TM-TRACE-COVERAGE
    threatScenarioRef: TS-TRACEABILITY-DRIFT
    controlRef: CTRL-TRACEABILITY-COVERAGE
    status: implemented
    effectiveness: medium
    owner: ACT-COMPLIANCE-ENGINEER
  - id: TM-GO-WORK-INPUT-VALIDATION
    threatScenarioRef: TS-GO-WORK-INJECTION
    controlRef: CTRL-GO-WORK-INPUT-VALIDATION
    status: implemented
    effectiveness: high
    owner: ACT-ARCHITECTURE-AUTHOR
    verificationRefs:
    - VER-GO-WORK-INPUT-VALIDATION
  - id: TM-ARTIFACT-SCAN-BOUNDS
    threatScenarioRef: TS-ARTIFACT-PARSE-ABUSE
    controlRef: CTRL-ARTIFACT-SCAN-BOUNDS
    status: implemented
    effectiveness: medium
    owner: ACT-COMPLIANCE-ENGINEER
    verificationRefs:
    - VER-ARTIFACT-SCAN-BOUNDS
  - id: TM-ACCEPTANCE-RECORD-CHECK
    threatScenarioRef: TS-FALSE-RISK-ACCEPTANCE
    controlRef: CTRL-ACCEPTANCE-RECORD-CHECK
    status: implemented
    effectiveness: medium
    owner: ACT-COMPLIANCE-ENGINEER
    verificationRefs:
    - VER-ACCEPTANCE-RECORD-CHECK
  - id: TM-CHILD-USER-NONDISCLOSURE
    threatScenarioRef: TS-CHILD-USER-DISCLOSURE
    controlRef: CTRL-CHILD-USER-NONDISCLOSURE
    status: implemented
    effectiveness: medium
    owner: ACT-ARCHITECTURE-AUTHOR
    verificationRefs:
    - VER-CHILD-USER-NONDISCLOSURE
  - id: TM-FINGERPRINT-COVERAGE
    threatScenarioRef: TS-HIDDEN-CHILD-CHANGE
    controlRef: CTRL-FINGERPRINT-COVERAGE
    status: implemented
    effectiveness: high
    owner: ACT-COMPLIANCE-ENGINEER
    verificationRefs:
    - VER-FINGERPRINT-COVERAGE
  - id: TM-LINK-REVIEW-RECORD
    threatScenarioRef: TS-FALSE-LINK-ACCEPTANCE
    controlRef: CTRL-LINK-REVIEW-RECORD
    status: implemented
    effectiveness: medium
    owner: ACT-COMPLIANCE-ENGINEER
    verificationRefs:
    - VER-LINK-REVIEW-RECORD
  - id: TM-REPO-LOCAL-WRITES
    threatScenarioRef: TS-LINK-WRITE-OUTSIDE-REPO
    controlRef: CTRL-REPO-LOCAL-WRITES
    status: implemented
    effectiveness: high
    owner: ACT-ARCHITECTURE-AUTHOR
    verificationRefs:
    - VER-REPO-LOCAL-WRITES
  - id: TM-GIT-REF-VALIDATION
    threatScenarioRef: TS-GIT-REF-OPTION-INJECTION
    controlRef: CTRL-GIT-REF-VALIDATION
    status: implemented
    effectiveness: high
    owner: ACT-ARCHITECTURE-AUTHOR
    verificationRefs:
    - VER-GIT-REF-VALIDATION
  controlVerifications:
  - id: VER-MCP-PATH-BOUNDARY
    controlRef: CTRL-MCP-PATH-BOUNDARY
    threatScenarioRefs:
    - TS-MCP-PATH-TRAVERSAL
    method: test
    status: pass
    owner: ACT-ARCHITECTURE-AUTHOR
    verificationRefs:
    - REQ-EMG-008
    findings:
    - Path traversal rejected and error payload returned in MCP tests.
    evidence:
    - path: internal/mcp/server_test.go
      description: Traversal rejection tests for MCP path arguments.
  - id: VER-TRACEABILITY-COVERAGE
    controlRef: CTRL-TRACEABILITY-COVERAGE
    threatScenarioRefs:
    - TS-TRACEABILITY-DRIFT
    method: analysis
    status: partial
    owner: ACT-COMPLIANCE-ENGINEER
    findings:
    - Coverage depends on TRLC-LINKS completeness in source and tests.
    evidence:
    - path: internal/codescan/inferred_verification_test.go
      description: Verification inference and trace marker coverage tests.
  - id: VER-GO-WORK-INPUT-VALIDATION
    controlRef: CTRL-GO-WORK-INPUT-VALIDATION
    threatScenarioRefs:
    - TS-GO-WORK-INJECTION
    method: test
    status: pass
    owner: ACT-ARCHITECTURE-AUTHOR
    verificationRefs:
    - CODE-INTERNAL-ENGWS-SYNC-TEST-GO--TESTSYNCREJECTSGOMODPATHSWITHLINEBREAKS
    - CODE-INTERNAL-ENGWS-SYNC-TEST-GO--TESTSYNCSKIPSUNSAFEMODULEPATHSANDDIRECTORYNAMES
    findings:
    - A quoted go.mod module or require path with a line break adds no line to go.work.
  - id: VER-ARTIFACT-SCAN-BOUNDS
    controlRef: CTRL-ARTIFACT-SCAN-BOUNDS
    threatScenarioRefs:
    - TS-ARTIFACT-PARSE-ABUSE
    method: test
    status: pass
    owner: ACT-COMPLIANCE-ENGINEER
    verificationRefs:
    - CODE-INTERNAL-CODEMAP-ARTIFACT-TEST-GO--TESTMARKDOWNMARKERSSKIPLONGFENCESANDINDENTEDCODE
    - CODE-INTERNAL-CODEMAP-ARTIFACT-TEST-GO--TESTARTIFACTMARKERSAFTERLONGLINEAREREAD
    - CODE-INTERNAL-CODEMAP-ARTIFACT-TEST-GO--TESTSCANSKIPSOVERSIZEDANDNONREGULARARTIFACTS
    - CODE-INTERNAL-MCP-FINGERPRINT-UNIX-TEST-GO--TESTMODELFINGERPRINTSKIPSNONREGULARFILES
    findings:
    - Markers in long fences and indented code are ignored, lines after a 1 MiB line are read, and oversized files,
      symlinks and FIFOs are not read.
  - id: VER-ACCEPTANCE-RECORD-CHECK
    controlRef: CTRL-ACCEPTANCE-RECORD-CHECK
    threatScenarioRefs:
    - TS-FALSE-RISK-ACCEPTANCE
    method: test
    status: pass
    owner: ACT-COMPLIANCE-ENGINEER
    verificationRefs:
    - REQ-EMG-085
    findings:
    - Missing, unresolvable and non-owner acceptance records are reported, and the Gemara policy and its consistency check
      accept only resolving records. The tests cannot show that the owner gave the acceptance; review of the diff does.
  - id: VER-CHILD-USER-NONDISCLOSURE
    controlRef: CTRL-CHILD-USER-NONDISCLOSURE
    threatScenarioRefs:
    - TS-CHILD-USER-DISCLOSURE
    method: test
    status: pass
    owner: ACT-ARCHITECTURE-AUTHOR
    verificationRefs:
    - CODE-INTERNAL-INTEGRATION-REQUIREMENT-LINKS-DISCLOSURE-TEST-GO--TESTREQUIREMENTLINKSCHILDDISCLOSESNOUSER
    - CODE-INTERNAL-INTEGRATION-REQUIREMENT-LINKS-DISCLOSURE-TEST-GO--TESTUSEDBYSCANSTAYSINTHEWORKSPACE
    - CODE-INTERNAL-MODEL-WORKSPACE-TEST-GO--TESTFINDWORKSPACEREFUSESUNTRUSTEDUPWARDFILE
    - CODE-INTERNAL-ASCIIDOC-ASCIIDOC-REQLINKS-TEST-GO--TESTONELINETEXTESCAPESPASSTHROUGH
    findings:
    - A child rendered with and without an active workspace names no user unless Used By is opted in; the scan skips
      replacements outside the workspace and escaping siblings; an untrusted upward workspace file is refused. The tests
      cannot show that an opted-in render is not committed; review of the diff does.
  - id: VER-FINGERPRINT-COVERAGE
    controlRef: CTRL-FINGERPRINT-COVERAGE
    threatScenarioRefs:
    - TS-HIDDEN-CHILD-CHANGE
    method: test
    status: pass
    owner: ACT-COMPLIANCE-ENGINEER
    verificationRefs:
    - CODE-INTERNAL-REQLINKS-REQLINKS-TEST-GO--TESTFINGERPRINTGOLDEN
    - CODE-INTERNAL-REQLINKS-REQLINKS-TEST-GO--TESTFINGERPRINTISDETERMINISTIC
    - CODE-INTERNAL-REQLINKS-REQLINKS-TEST-GO--TESTFINGERPRINTVERSION
    - CODE-INTERNAL-INTEGRATION-REQUIREMENT-LINKS-TEST-GO--TESTREQUIREMENTLINKSMULTITARGETANDMIXEDLINKS
    findings:
    - A change to the item kind, text or criteria, or to a realizer's text, notes, verification criteria or methods,
      criticality or status changes the fingerprint; an unversioned or unknown fingerprint form is reported as
      link.fingerprint_outdated.
  - id: VER-LINK-REVIEW-RECORD
    controlRef: CTRL-LINK-REVIEW-RECORD
    threatScenarioRefs:
    - TS-FALSE-LINK-ACCEPTANCE
    method: test
    status: pass
    owner: ACT-COMPLIANCE-ENGINEER
    verificationRefs:
    - CODE-INTERNAL-VALIDATE-REQLINKS-TEST-GO--TESTACCEPTEDLINKREVIEWISRECORDED
    - CODE-INTERNAL-ENGWS-REVIEWLINKS-TEST-GO--TESTREVIEWLINKSBROKENANDOFFLINE
    - CODE-INTERNAL-INTEGRATION-REQUIREMENT-LINKS-TRACE-TEST-GO--TESTREQUIREMENTLINKSROLLUPNEEDSREVIEWEDLINKS
    findings:
    - An accepted link without a resolving reviewer or date is reported; accept records the published dependency, not a
      workspace checkout; claimed and changed links do not roll a requirement up. The tests cannot show that the
      reviewer gave the review; review of the diff does.
  - id: VER-REPO-LOCAL-WRITES
    controlRef: CTRL-REPO-LOCAL-WRITES
    threatScenarioRefs:
    - TS-LINK-WRITE-OUTSIDE-REPO
    method: test
    status: pass
    owner: ACT-ARCHITECTURE-AUTHOR
    verificationRefs:
    - CODE-INTERNAL-MCP-REQLINKS-TEST-GO--TESTLINKSREVIEWTOOLRETURNSCOMMANDANDPATCH
