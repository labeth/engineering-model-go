  trustBoundaries:
  - id: TB-REPO-WORKSPACE
    name: Repository Workspace Boundary
    description: Boundary limiting file operations to repository-root owned paths.
    boundaryType: filesystem
    members:
    - FU-MCP-SERVER
    - FU-CODEMAP-INFERENCE
  - id: TB-EXTERNAL-VALIDATION-TOOLS
    name: External Validation Tools Boundary
    description: Boundary for external validators, schemas, and compliance toolchains.
    boundaryType: external-tooling
    members:
    - REF-THREAT-DRAGON-SCHEMAS
    - REF-OPEN-OTM-SCHEMA
    - REF-STRUCTURIZR-VALIDATOR
    - REF-TRLC-TOOLCHAIN
    - REF-LOBSTER-TOOLCHAIN
  - id: TB-CHILD-USING-SYSTEM
    name: Child and Using System Boundary
    description: Boundary between a child model, published and reused without knowing its users, and each system that
      composes it and links its requirements to the child's contract items. Neither side writes into the other; each reads
      only what the other publishes.
    boundaryType: repository
    members:
    - FU-SYSTEM-COMPOSITION
    - FU-ALLOCATION-TRACE
    - FU-ASCIIDOC-GENERATOR
  threatScenarios:
  - id: TS-MCP-PATH-TRAVERSAL
    title: MCP path traversal accesses non-repo files
    summary: Untrusted MCP input attempts to escape repo root for sensitive file reads.
    category: input-validation
    stride: tampering
    attackVectorRef: AV-PATH-TRAVERSAL-IN-MCP
    appliesTo:
    - FU-MCP-SERVER
    flowRefs:
    - FLOW-MODEL-CHANGE-TO-VERIFIED-ARTIFACTS
    likelihood: medium
    impact: high
    severity: high
    status: mitigating
    owner: ACT-ARCHITECTURE-AUTHOR
    relatedControls:
    - CTRL-MCP-PATH-BOUNDARY
    - CTRL-STRICT-MCP-INPUT-SCHEMA
    verificationRefs:
    - VER-MCP-PATH-BOUNDARY
    - VER-STRICT-MCP-INPUT-SCHEMA
  - id: TS-TRACEABILITY-DRIFT
    title: Requirement traceability drifts from implementation
    summary: Code and tests change without corresponding requirement trace updates.
    category: assurance
    stride: repudiation
    attackVectorRef: AV-TRACEABILITY-GAP-DRIFT
    appliesTo:
    - FU-CODEMAP-INFERENCE
    - FU-TRLC-EXPORTER
    - FU-LOBSTER-EXPORTER
    likelihood: medium
    impact: medium
    severity: medium
    status: mitigating
    owner: ACT-COMPLIANCE-ENGINEER
    relatedControls:
    - CTRL-TRACEABILITY-COVERAGE
    verificationRefs:
    - VER-TRACEABILITY-COVERAGE
    - VER-TRACE-LINK-INTEGRITY
  - id: TS-GO-WORK-INJECTION
    title: Crafted go.mod injects go.work directives
    summary: A sibling checkout's go.mod declares a quoted module or require path with a line break, so engws sync writes
      an extra use or replace directive into the generated go.work.
    category: input-validation
    stride: tampering
    attackVectorRef: AV-UNTRUSTED-CHECKOUT-CONTENT
    appliesTo:
    - FU-CLI-ORCHESTRATION
    likelihood: low
    impact: high
    severity: medium
    status: mitigating
    owner: ACT-ARCHITECTURE-AUTHOR
    relatedControls:
    - CTRL-GO-WORK-INPUT-VALIDATION
    verificationRefs:
    - VER-GO-WORK-INPUT-VALIDATION
  - id: TS-ARTIFACT-PARSE-ABUSE
    title: Crafted repository artifacts mislead or stall the code scan
    summary: A Markdown or container file in a scanned repository claims implementation through markers inside code
      blocks, hides markers after an over-long line, or is a symlink, FIFO or very large file that the scan follows or
      reads without bound.
    category: input-validation
    stride: tampering
    attackVectorRef: AV-UNTRUSTED-CHECKOUT-CONTENT
    appliesTo:
    - FU-CODEMAP-INFERENCE
    - FU-MCP-SERVER
    likelihood: medium
    impact: medium
    severity: medium
    status: mitigating
    owner: ACT-COMPLIANCE-ENGINEER
    relatedControls:
    - CTRL-ARTIFACT-SCAN-BOUNDS
    verificationRefs:
    - VER-ARTIFACT-SCAN-BOUNDS
  - id: TS-FALSE-RISK-ACCEPTANCE
    title: Risk recorded as accepted without the owner
    summary: A model edit sets a risk or threat scenario to accepted with a missing, unresolvable or non-owner acceptance
      record, and the Gemara policy lists it under risks.accepted.
    category: assurance
    stride: repudiation
    attackVectorRef: AV-FALSE-ACCEPTANCE-CLAIM
    appliesTo:
    - FU-VALIDATION-ENGINE
    - FU-GEMARA-EXPORTER
    likelihood: medium
    impact: high
    severity: high
    status: mitigating
    owner: ACT-COMPLIANCE-ENGINEER
    relatedControls:
    - CTRL-ACCEPTANCE-RECORD-CHECK
    verificationRefs:
    - VER-ACCEPTANCE-RECORD-CHECK
  - id: TS-CHILD-USER-DISCLOSURE
    title: A child's outputs disclose its users
    summary: A child's generated document, Gemara export or MCP answer names the systems that use it, their requirements
      or parent texts (for example a Used By section rendered in a workspace and committed into the child).
    category: confidentiality
    stride: information_disclosure
    attackVectorRef: AV-COMPOSED-MODEL-CONTENT
    appliesTo:
    - FU-ASCIIDOC-GENERATOR
    - FU-GEMARA-EXPORTER
    - FU-MCP-SERVER
    likelihood: medium
    impact: medium
    severity: medium
    status: mitigating
    owner: ACT-ARCHITECTURE-AUTHOR
    relatedControls:
    - CTRL-CHILD-USER-NONDISCLOSURE
    verificationRefs:
    - VER-CHILD-USER-NONDISCLOSURE
  - id: TS-HIDDEN-CHILD-CHANGE
    title: A child change escapes the link review
    summary: A child release changes what a linked capability or a realizing requirement obliges in a field the bump
      comparison does not cover, so the bump moves the link's pin and nobody reviews it.
    category: integrity
    stride: tampering
    attackVectorRef: AV-COMPOSED-MODEL-CONTENT
    appliesTo:
    - FU-ALLOCATION-TRACE
    likelihood: medium
    impact: high
    severity: high
    status: mitigating
    owner: ACT-COMPLIANCE-ENGINEER
    relatedControls:
    - CTRL-FINGERPRINT-COVERAGE
    verificationRefs:
    - VER-FINGERPRINT-COVERAGE
  - id: TS-FALSE-LINK-ACCEPTANCE
    title: A requirement link recorded as reviewed without a review
    summary: A model edit (by a person or an AI agent) sets a link to accepted without a resolving reviewer or date, or
      re-stamps it from a workspace checkout instead of the published dependency, so the trace counts an unreviewed link.
    category: assurance
    stride: repudiation
    attackVectorRef: AV-FALSE-ACCEPTANCE-CLAIM
    appliesTo:
    - FU-VALIDATION-ENGINE
    - FU-ALLOCATION-TRACE
    - FU-MCP-SERVER
    likelihood: medium
    impact: high
    severity: high
    status: mitigating
    owner: ACT-COMPLIANCE-ENGINEER
    relatedControls:
    - CTRL-LINK-REVIEW-RECORD
    verificationRefs:
    - VER-LINK-REVIEW-RECORD
  - id: TS-LINK-WRITE-OUTSIDE-REPO
    title: Link tooling writes outside the model
    summary: A crafted workspace, sibling manifest or interrupted migration makes review-links, migrate-links or the
      MCP server write, read or leave half-written files outside the model's own repository.
    category: input-validation
    stride: tampering
    attackVectorRef: AV-COMPOSED-MODEL-CONTENT
    appliesTo:
    - FU-CLI-ORCHESTRATION
    - FU-MCP-SERVER
    - FU-SYSTEM-COMPOSITION
    likelihood: low
    impact: high
    severity: medium
    status: mitigating
    owner: ACT-ARCHITECTURE-AUTHOR
    relatedControls:
    - CTRL-REPO-LOCAL-WRITES
    verificationRefs:
    - VER-REPO-LOCAL-WRITES
  - id: TS-GIT-REF-OPTION-INJECTION
    title: A git ref is read as a git option
    summary: A ref given to contract-diff or release-check (for example from a CI variable) starts with "-", so git show
      or rev-parse runs with an option such as --output that writes a file.
    category: input-validation
    stride: tampering
    attackVectorRef: AV-COMPOSED-MODEL-CONTENT
    appliesTo:
    - FU-CLI-ORCHESTRATION
    likelihood: low
    impact: medium
    severity: low
    status: mitigating
    owner: ACT-ARCHITECTURE-AUTHOR
    relatedControls:
    - CTRL-GIT-REF-VALIDATION
    verificationRefs:
    - VER-GIT-REF-VALIDATION
