  flows:
  - id: FLOW-REQUIREMENTS-DELTA-TO-CANONICAL
    title: Requirements Delta to Canonical Requirements Flow
    kind: control
    methodology: validate-before-write
    direction: internal
    frequency: on-demand
    sourceRef: ACT-IMPLEMENTATION-ENGINEER
    destinationRef: FU-MODEL-CHANGE
    protocol: cli
    channel: local-shell
    dataRefs:
    - DO-REQUIREMENTS-DELTA
    - DO-REQUIREMENTS-DOCUMENT
    - DO-ARCHITECTURE-MODEL
    - DO-REQUIREMENTS-DIFF
    description: Strictly plans and validates a requirements delta before atomically updating canonical requirements.
    entry:
    - load-requirements-delta
    exits:
    - replace-requirements
    steps:
    - id: load-requirements-delta
      kind: system_action
      ref: FU-MODEL-CHANGE
      action: Strictly decode and validate stable-ID operations.
      dataIn:
      - DO-REQUIREMENTS-DELTA
      next:
      - merge-requirements-candidate
    - id: merge-requirements-candidate
      kind: system_action
      ref: FU-MODEL-CHANGE
      action: Apply operations to an in-memory YAML candidate while preserving unchanged nodes.
      dataIn:
      - DO-REQUIREMENTS-DELTA
      - DO-REQUIREMENTS-DOCUMENT
      dataOut:
      - DO-REQUIREMENTS-DIFF
      next:
      - validate-requirements-candidate
    - id: validate-requirements-candidate
      kind: control_action
      ref: FU-VALIDATION-ENGINE
      action: Run complete-model and EARS validation against the candidate.
      dataIn:
      - DO-REQUIREMENTS-DOCUMENT
      - DO-ARCHITECTURE-MODEL
      next:
      - replace-requirements
      onError:
      - reject-requirements-delta
    - id: reject-requirements-delta
      kind: notification
      ref: FU-MODEL-CHANGE
      action: Return diagnostics without modifying canonical requirements.
      dataOut:
      - DO-REQUIREMENTS-DIFF
    - id: replace-requirements
      kind: system_action
      ref: FU-MODEL-CHANGE
      action: Atomically replace canonical requirements while preserving file permissions.
      dataIn:
      - DO-REQUIREMENTS-DOCUMENT
  - id: FLOW-DEPENDENCY-BUMP
    title: Dependency Bump with Requirement Link Evaluation
    kind: control
    methodology: validate-before-write
    direction: internal
    frequency: on-demand
    sourceRef: ACT-IMPLEMENTATION-ENGINEER
    destinationRef: FU-CLI-ORCHESTRATION
    protocol: cli
    channel: local-shell
    dataRefs:
    - DO-ARCHITECTURE-MODEL
    description: engws bump pins a dependency version, regenerates the lock against the registry and evaluates the requirement links on the bumped alias; any failure, or a suspect or broken link, restores every file (D8).
    entry:
    - pin-version
    exits:
    - repin-unchanged-links
    - restore-bump-files
    steps:
    - id: pin-version
      kind: system_action
      ref: FU-CLI-ORCHESTRATION
      action: Set the dependency version in engmod.yml, go.mod and go.sum.
      next:
      - regenerate-lock
      onError:
      - restore-bump-files
    - id: regenerate-lock
      kind: system_action
      ref: FU-SYSTEM-COMPOSITION
      action: Compose against the registry with the workspace off and write engmod.lock.yml.
      next:
      - evaluate-bumped-links
      onError:
      - restore-bump-files
    - id: evaluate-bumped-links
      kind: decision
      ref: FU-ALLOCATION-TRACE
      action: Compare each link on the bumped alias between its pinned version and the new one by meaning (both published, workspace off).
      next:
      - repin-unchanged-links
      onError:
      - restore-bump-files
    - id: repin-unchanged-links
      kind: system_action
      ref: FU-CLI-ORCHESTRATION
      action: Move pinned.version of the links with the same meaning to the new version; changed, unresolvable and broken links keep their pin for review.
      onError:
      - restore-bump-files
    - id: restore-bump-files
      kind: notification
      ref: FU-CLI-ORCHESTRATION
      action: Restore engmod.yml, go.mod, go.sum, the lock and the link file after a failure.
  - id: FLOW-LINK-REVIEW
    title: Requirement Link Review and Acceptance
    kind: control
    methodology: validate-before-write
    direction: internal
    frequency: on-demand
    sourceRef: ACT-ARCHITECTURE-AUTHOR
    destinationRef: FU-CLI-ORCHESTRATION
    protocol: cli
    channel: local-shell
    dataRefs:
    - DO-ARCHITECTURE-MODEL
    description: engws review-links shows each link that needs review with what changed in meaning between the pinned version and the dependency pin; --accept moves one link's pin to the published dependency at its pin and re-evaluates it, or refuses and writes nothing (D9, D23).
    entry:
    - show-links
    exits:
    - record-acceptance
    - refuse-acceptance
    steps:
    - id: show-links
      kind: system_action
      ref: FU-ALLOCATION-TRACE
      action: List version-mismatched, broken and claimed links with the change in meaning; --show adds the parent text and the item before and after.
      next:
      - check-acceptance
    - id: check-acceptance
      kind: security_check
      ref: FU-ALLOCATION-TRACE
      action: Check the reviewer is a model actor, the link exists and is not broken, and the dependency resolves with the workspace off.
      next:
      - record-acceptance
      onError:
      - refuse-acceptance
    - id: record-acceptance
      kind: system_action
      ref: FU-CLI-ORCHESTRATION
      action: Write the dependency pin, status accepted, the rationale, reviewedBy and reviewedOn into the touched lines of the link file, remove a deprecated fingerprint, and evaluate the link again.
      onError:
      - refuse-acceptance
    - id: refuse-acceptance
      kind: notification
      ref: FU-CLI-ORCHESTRATION
      action: Report why the link cannot be accepted and leave the link file unchanged.
  - id: FLOW-MODEL-CHANGE-TO-VERIFIED-ARTIFACTS
    title: Model Change to Verified Artifacts Flow
    kind: control
    methodology: architecture-ai
    direction: internal
    frequency: on-demand
    sourceRef: ACT-IMPLEMENTATION-ENGINEER
    destinationRef: FU-CLI-ORCHESTRATION
    protocol: cli
    channel: local-shell
    authentication: repository-access
    encryptionInTransit: none
    integrityProtection: git-history
    dataRefs:
    - DO-ARCHITECTURE-MODEL
    - DO-MCP-TOOL-RESULT
    - DO-STRUCTURIZR-DSL
    - DO-THREAT-DRAGON-JSON
    description: Primary engineering workflow from authored model update through validation and artifact generation.
    entry:
    - edit-model
    exits:
    - publish-artifacts
    steps:
    - id: edit-model
      kind: user_action
      ref: ACT-IMPLEMENTATION-ENGINEER
      action: Update model and requirements artifacts
      dataOut:
      - architecture_update
      next:
      - validate-model
    - id: validate-model
      kind: system_action
      ref: FU-VALIDATION-ENGINE
      action: Validate authored model references and relationships
      dataIn:
      - architecture_update
      onError:
      - fail-validation
      next:
      - generate-artifacts
    - id: generate-artifacts
      kind: system_action
      ref: FU-CLI-ORCHESTRATION
      action: Run generation and export commands
      dataOut:
      - generated_artifacts
      next:
      - publish-artifacts
    - id: fail-validation
      kind: system_action
      ref: FU-VALIDATION-ENGINE
      action: Emit validation diagnostics and block publication
    - id: publish-artifacts
      kind: system_action
      ref: FU-ASCIIDOC-GENERATOR
      action: Persist generated outputs for downstream use
  - id: FLOW-MODEL-CHECK
    title: Model Check Reports Diagnostics
    kind: data
    frequency: on-demand
    sourceRef: ACT-IMPLEMENTATION-ENGINEER
    destinationRef: FU-VALIDATION-ENGINE
    protocol: cli
    channel: local-shell
    dataRefs:
    - DO-ARCHITECTURE-MODEL
    - DO-CANONICAL-SEMANTIC-MODEL
    - DO-MODEL-DIAGNOSTICS
    description: A caller asks the engine to check a model (engdoc, engws check, the engmcp diagnose tool or the Go function ValidateBundle). The engine loads the manifest and every document it names, normalizes them into the canonical semantic model, runs the schema, reference, EARS, behavior, trace, tier and health checks and returns one diagnostic per finding with a code, a severity, a message and a model path. A model that cannot be loaded returns the load error and no diagnostics.
    entry:
    - load-model-documents
    exits:
    - report-diagnostics
    - report-load-error
    steps:
    - id: load-model-documents
      kind: system_action
      ref: FU-MODEL-LOADER
      interfaceRef: IF-CLI-ENGDOC
      action: Load the manifest and every document it names and normalize them into the canonical semantic model.
      dataIn:
      - DO-ARCHITECTURE-MODEL
      dataOut:
      - DO-CANONICAL-SEMANTIC-MODEL
      next:
      - check-model
      onError:
      - report-load-error
    - id: check-model
      kind: system_action
      ref: FU-VALIDATION-ENGINE
      interfaceRef: IF-CLI-ENGDOC
      action: Run the checks of the model and collect one diagnostic per finding, its severity set by the life-cycle tier of the project.
      dataIn:
      - DO-CANONICAL-SEMANTIC-MODEL
      dataOut:
      - DO-MODEL-DIAGNOSTICS
      next:
      - report-diagnostics
    - id: report-diagnostics
      kind: notification
      ref: ACT-IMPLEMENTATION-ENGINEER
      action: The caller receives the diagnostics; an error among them blocks generation (EVT-VALIDATION-FAILED).
      dataIn:
      - DO-MODEL-DIAGNOSTICS
    - id: report-load-error
      kind: notification
      ref: ACT-IMPLEMENTATION-ENGINEER
      action: The caller receives the load error and no diagnostics.
  - id: FLOW-MCP-TOOL-CALL
    title: MCP Tool Call Answers from the Model on Disk
    kind: data
    frequency: on-demand
    sourceRef: ACT-AI-AGENT
    destinationRef: FU-MCP-SERVER
    protocol: stdio-jsonrpc
    channel: local-process
    dataRefs:
    - DO-ARCHITECTURE-MODEL
    - DO-MODEL-AUTHORING-CONTRACT
    - DO-MCP-TOOL-RESULT
    description: An AI agent calls a tool of the MCP server. The server checks the arguments against the tool input schema and confines every path argument to the repository workspace, reads the module model files as they are at call time and returns one tool result with the schema version and the structured error fields, or rejects the call with a structured error.
    entry:
    - receive-tool-call
    exits:
    - answer-tool-call
    - reject-tool-call
    steps:
    - id: receive-tool-call
      kind: integration_call
      ref: FU-MCP-SERVER
      sourceRef: ACT-AI-AGENT
      destinationRef: FU-MCP-SERVER
      interfaceRef: IF-CLI-ENGMCP
      action: Read one JSON-RPC tool call from standard input.
      next:
      - check-arguments
      onError:
      - reject-tool-call
    - id: check-arguments
      kind: decision
      ref: FU-MCP-SERVER
      action: Check the arguments against the tool input schema and reject a path argument outside the repository workspace boundary.
      next:
      - answer-tool-call
      onError:
      - reject-tool-call
    - id: answer-tool-call
      kind: integration_call
      ref: FU-MCP-SERVER
      sourceRef: FU-MCP-SERVER
      destinationRef: ACT-AI-AGENT
      interfaceRef: IF-CLI-ENGMCP
      action: Read the model files from disk and write one tool result.
      dataIn:
      - DO-ARCHITECTURE-MODEL
      dataOut:
      - DO-MCP-TOOL-RESULT
      - DO-MODEL-AUTHORING-CONTRACT
    - id: reject-tool-call
      kind: notification
      ref: ACT-AI-AGENT
      action: The agent receives a structured error with the schema version and no result.
  - id: FLOW-WORKSPACE-SYNC
    title: Workspace Sync and Staging
    kind: control
    methodology: validate-before-write
    direction: internal
    frequency: on-demand
    sourceRef: ACT-IMPLEMENTATION-ENGINEER
    destinationRef: FU-CLI-ORCHESTRATION
    protocol: cli
    channel: local-shell
    dataRefs:
    - DO-ARCHITECTURE-MODEL
    description: engws sync writes a local workspace that replaces only the changed or pinned checkouts and a go workspace replace directive for each required version of a workspace Go module; engws stage publishes every checkout into the local staging area in dependency order.
    entry:
    - sync-workspace
    exits:
    - stage-workspace
    steps:
    - id: sync-workspace
      kind: system_action
      ref: FU-CLI-ORCHESTRATION
