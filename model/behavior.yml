    - id: stage-workspace
      kind: system_action
      ref: FU-SYSTEM-COMPOSITION
      sourceRef: EVT-WORKSPACE-STAGING-REQUESTED
      interfaceRef: IF-CLI-ENGWS
      action: Publish every workspace checkout into the local staging area in dependency order.
  - id: FLOW-SPEC-DELTA
    title: Spec Delta Rendered from Model Requirements
    kind: data
