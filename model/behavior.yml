schemaVersion: 2
behavior:
  states:
  - id: STATE-MODEL-VALID
    name: Model Valid
    description: Model passes architecture and relationship validation checks.
  - id: STATE-MODEL-INVALID
    name: Model Invalid
    description: Model has validation diagnostics that block generation or trusted use.
  - id: STATE-ARTIFACTS-FRESH
    name: Artifacts Fresh
    description: Generated artifacts are aligned with current authored model and code evidence.
  - id: STATE-LINK-CLAIMED
    name: Link Claimed
    description: A requirement link is recorded (status claimed) but nobody has reviewed it; it does not count toward the trace roll-up.
  - id: STATE-LINK-ACCEPTED
    name: Link Accepted
    description: A requirement link is reviewed (status accepted, reviewer and date recorded) at the version its dependency is pinned to.
  - id: STATE-LINK-SUSPECT
    name: Link Suspect
    description: The dependency is pinned to another version than the link was reviewed at (link.version_mismatch), because a bump found the item's meaning changed or could not resolve the reviewed version; the check fails until the link is reviewed again (D23).
  - id: STATE-LINK-BROKEN
    name: Link Broken
    description: The linked child item no longer exists as a published contract item at the resolved version; the link must be removed or relinked.
  events:
  - id: EVT-MODEL-UPDATED
    name: Model Updated
    description: Model file changed and requires re-validation and potential regeneration.
  - id: EVT-GENERATION-RUN-REQUESTED
    name: Generation Run Requested
    description: Request to generate documentation or exchange artifacts from the model.
  - id: EVT-VALIDATION-FAILED
    name: Validation Failed
    description: Validation or schema checks failed for model or generated output.
  - id: EVT-ARTIFACT-GENERATED
    name: Artifact Generated
    description: One or more generated artifacts were produced successfully.
  - id: EVT-MCP-TOOL-CALL-RECEIVED
    name: MCP Tool Call Received
    description: MCP server receives a structured tool invocation request.
  - id: EVT-REQUIREMENTS-DELTA-RECEIVED
    name: Requirements Delta Received
    description: A typed requirements delta is ready for strict parsing and candidate validation.
  - id: EVT-REQUIREMENTS-DELTA-APPLY-REQUESTED
    name: Requirements Delta Apply Requested
    description: A validated requirements candidate is ready for atomic replacement.
  - id: EVT-DEPENDENCY-BUMP-REQUESTED
    name: Dependency Bump Requested
    description: A developer asked engws to move a dependency of a checkout to another version (engws bump).
  - id: EVT-LINK-REVIEW-REQUESTED
    name: Link Review Requested
    description: A developer asked engws to show or accept requirement links that need review (engws review-links).
  - id: EVT-CONTRACT-DIFF-REQUESTED
    name: Contract Diff Requested
    description: A developer asked engws to compare the contract items of a model between two git refs (engws contract-diff).
  - id: EVT-RELEASE-CHECK-REQUESTED
    name: Release Check Requested
    description: A release gate asked engws whether a model may be released under a tag (engws release-check).
  - id: EVT-LINK-MIGRATION-REQUESTED
    name: Link Migration Requested
    description: A developer asked engws to convert deprecated allocations and contract refs into requirement links (engws migrate-links).
  - id: EVT-LINK-ADD-REQUESTED
    name: Link Add Requested
    description: A developer asked engws to write a new claimed requirement link pinned to the dependency version (engws link add).
  flows:
  - id: FLOW-REQUIREMENTS-DELTA-TO-CANONICAL
    title: Requirements Delta to Canonical Requirements Flow
    kind: control
    methodology: validate-before-write
    direction: internal
    frequency: on-demand
    sourceRef: ACT-IMPLEMENTATION-ENGINEER
    destinationRef: FU-MODEL-CHANGE
    protocol: cli
    channel: local-shell
    dataRefs:
    - DO-REQUIREMENTS-DELTA
    - DO-REQUIREMENTS-DOCUMENT
    - DO-ARCHITECTURE-MODEL
    - DO-REQUIREMENTS-DIFF
    description: Strictly plans and validates a requirements delta before atomically updating canonical requirements.
    entry:
    - load-requirements-delta
    exits:
    - replace-requirements
    steps:
    - id: load-requirements-delta
      kind: system_action
      ref: FU-MODEL-CHANGE
      action: Strictly decode and validate stable-ID operations.
      dataIn:
      - DO-REQUIREMENTS-DELTA
      next:
      - merge-requirements-candidate
    - id: merge-requirements-candidate
      kind: system_action
      ref: FU-MODEL-CHANGE
      action: Apply operations to an in-memory YAML candidate while preserving unchanged nodes.
      dataIn:
      - DO-REQUIREMENTS-DELTA
      - DO-REQUIREMENTS-DOCUMENT
      dataOut:
      - DO-REQUIREMENTS-DIFF
      next:
      - validate-requirements-candidate
    - id: validate-requirements-candidate
      kind: control_action
      ref: FU-VALIDATION-ENGINE
      action: Run complete-model and EARS validation against the candidate.
      dataIn:
      - DO-REQUIREMENTS-DOCUMENT
      - DO-ARCHITECTURE-MODEL
      next:
      - replace-requirements
      onError:
      - reject-requirements-delta
    - id: reject-requirements-delta
      kind: notification
      ref: FU-MODEL-CHANGE
      action: Return diagnostics without modifying canonical requirements.
      dataOut:
      - DO-REQUIREMENTS-DIFF
    - id: replace-requirements
      kind: system_action
      ref: FU-MODEL-CHANGE
      action: Atomically replace canonical requirements while preserving file permissions.
      dataIn:
      - DO-REQUIREMENTS-DOCUMENT
  - id: FLOW-DEPENDENCY-BUMP
    title: Dependency Bump with Requirement Link Evaluation
    kind: control
    methodology: validate-before-write
    direction: internal
    frequency: on-demand
    sourceRef: ACT-IMPLEMENTATION-ENGINEER
    destinationRef: FU-CLI-ORCHESTRATION
    protocol: cli
    channel: local-shell
    dataRefs:
    - DO-ARCHITECTURE-MODEL
    description: engws bump pins a dependency version, regenerates the lock against the registry and evaluates the requirement links on the bumped alias; any failure, or a suspect or broken link without --allow-suspect, restores every file (D8).
    entry:
    - pin-version
    exits:
    - repin-unchanged-links
    - restore-bump-files
    steps:
    - id: pin-version
      kind: system_action
      ref: FU-CLI-ORCHESTRATION
      action: Set the dependency version in engmod.yml, go.mod and go.sum.
      next:
      - regenerate-lock
      onError:
      - restore-bump-files
    - id: regenerate-lock
      kind: system_action
      ref: FU-SYSTEM-COMPOSITION
      action: Compose against the registry with the workspace off and write engmod.lock.yml.
      next:
      - evaluate-bumped-links
      onError:
      - restore-bump-files
    - id: evaluate-bumped-links
      kind: decision
      ref: FU-ALLOCATION-TRACE
      action: Compare each link on the bumped alias between its pinned version and the new one by meaning (both published, workspace off).
      next:
      - repin-unchanged-links
      onError:
      - restore-bump-files
    - id: repin-unchanged-links
      kind: system_action
      ref: FU-CLI-ORCHESTRATION
      action: Move pinned.version of the links with the same meaning to the new version; changed, unresolvable and broken links keep their pin for review.
      onError:
      - restore-bump-files
    - id: restore-bump-files
      kind: notification
      ref: FU-CLI-ORCHESTRATION
      action: Restore engmod.yml, go.mod, go.sum, the lock and the link file after a failure.
  - id: FLOW-LINK-REVIEW
    title: Requirement Link Review and Acceptance
    kind: control
    methodology: validate-before-write
    direction: internal
    frequency: on-demand
    sourceRef: ACT-ARCHITECTURE-AUTHOR
    destinationRef: FU-CLI-ORCHESTRATION
    protocol: cli
    channel: local-shell
    dataRefs:
    - DO-ARCHITECTURE-MODEL
    description: engws review-links shows each link that needs review with what changed in meaning between the pinned version and the dependency pin; --accept moves one link's pin to the published dependency at its pin and re-evaluates it, or refuses and writes nothing (D9, D23).
    entry:
    - show-links
    exits:
    - record-acceptance
    - refuse-acceptance
    steps:
    - id: show-links
      kind: system_action
      ref: FU-ALLOCATION-TRACE
      action: List version-mismatched, broken and claimed links with the change in meaning; --show adds the parent text and the item before and after.
      next:
      - check-acceptance
    - id: check-acceptance
      kind: security_check
      ref: FU-ALLOCATION-TRACE
      action: Check the reviewer is a model actor, the link exists and is not broken, and the dependency resolves with the workspace off.
      next:
      - record-acceptance
      onError:
      - refuse-acceptance
    - id: record-acceptance
      kind: system_action
      ref: FU-CLI-ORCHESTRATION
      action: Write the dependency pin, status accepted, the rationale, reviewedBy and reviewedOn into the touched lines of the link file, remove a deprecated fingerprint, and evaluate the link again.
      onError:
      - refuse-acceptance
    - id: refuse-acceptance
      kind: notification
      ref: FU-CLI-ORCHESTRATION
      action: Report why the link cannot be accepted and leave the link file unchanged.
  - id: FLOW-MODEL-CHANGE-TO-VERIFIED-ARTIFACTS
    title: Model Change to Verified Artifacts Flow
    kind: control
    methodology: architecture-ai
    direction: internal
    frequency: on-demand
    sourceRef: ACT-IMPLEMENTATION-ENGINEER
    destinationRef: FU-CLI-ORCHESTRATION
    protocol: cli
    channel: local-shell
    authentication: repository-access
    encryptionInTransit: none
    integrityProtection: git-history
    dataRefs:
    - DO-ARCHITECTURE-MODEL
    - DO-MCP-TOOL-RESULT
    - DO-STRUCTURIZR-DSL
    - DO-THREAT-DRAGON-JSON
    description: Primary engineering workflow from authored model update through validation and artifact generation.
    entry:
    - edit-model
    exits:
    - publish-artifacts
    steps:
    - id: edit-model
      kind: user_action
      ref: ACT-IMPLEMENTATION-ENGINEER
      action: Update model and requirements artifacts
      dataOut:
      - architecture_update
      next:
      - validate-model
    - id: validate-model
      kind: system_action
      ref: FU-VALIDATION-ENGINE
      action: Validate authored model references and relationships
      dataIn:
      - architecture_update
      onError:
      - fail-validation
      next:
      - generate-artifacts
    - id: generate-artifacts
      kind: system_action
      ref: FU-CLI-ORCHESTRATION
      action: Run generation and export commands
      dataOut:
      - generated_artifacts
      next:
      - publish-artifacts
    - id: fail-validation
      kind: system_action
      ref: FU-VALIDATION-ENGINE
      action: Emit validation diagnostics and block publication
    - id: publish-artifacts
      kind: system_action
      ref: FU-ASCIIDOC-GENERATOR
      action: Persist generated outputs for downstream use
