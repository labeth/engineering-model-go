    protocol: cli
    channel: local-shell
    dataRefs:
    - DO-REQUIREMENTS-DOCUMENT
    description: engspec renders OpenSpec spec delta text from the model requirements selected by ID or prefix; it reads the model and writes only the rendered text.
    entry:
    - render-spec-delta
    exits:
    - render-spec-delta
    steps:
    - id: render-spec-delta
      kind: system_action
      ref: FU-MODEL-CHANGE
      sourceRef: EVT-SPEC-DELTA-REQUESTED
      interfaceRef: IF-CLI-ENGSPEC
      action: Render the selected requirements as OpenSpec spec delta text with SHALL capitalization and criteria shaping.
      dataIn:
      - DO-REQUIREMENTS-DOCUMENT
  - id: FLOW-EXAMPLE-VALIDATION
    title: Reference Workspaces Validated
    kind: control
    methodology: validate-before-write
    direction: internal
    frequency: on-demand
    sourceRef: ACT-CI-PIPELINE
    destinationRef: FU-CLI-ORCHESTRATION
    protocol: cli
    channel: local-shell
    dataRefs:
    - DO-ARCHITECTURE-MODEL
    description: scripts/validate-all.sh loads, composes, generates and checks each maintained reference workspace and fails when a generated artifact drifts.
    entry:
    - validate-examples
    exits:
    - validate-examples
    steps:
    - id: validate-examples
      kind: system_action
      ref: FU-CLI-ORCHESTRATION
      sourceRef: EVT-EXAMPLE-VALIDATION-REQUESTED
      action: Load, compose, generate and check each reference workspace.
      dataIn:
      - DO-ARCHITECTURE-MODEL
  - id: FLOW-GO-READ-MODEL
    title: Go Consumer Reads a Model
    kind: data
    frequency: on-demand
    sourceRef: ACT-GO-CONSUMER
    destinationRef: FU-MODEL-LOADER
    protocol: go-library
    channel: in-process
    dataRefs:
    - DO-MODEL-BUNDLE
    - DO-MODEL-DIAGNOSTICS
    - DO-ENTITY-INDEX
    - DO-TRACE-MATRIX
    - DO-CATALOG-USAGE
    description: 'A Go consumer loads the model of a checkout, validates the bundle, lists its entities and, when it needs them, builds the trace matrix and lists the catalog usage. A model with dependencies is composed first (FLOW-GO-COMPOSE-AND-LINK) and the consumer validates the bundle enriched with the entities the dependencies publish. The calls run in the consumer process; the library authenticates and encrypts nothing.'
    entry:
    - load-bundle
    exits:
    - build-entity-index
    - build-trace-matrix
    - read-catalog-usage
    steps:
    - id: load-bundle
      kind: integration_call
      ref: FU-MODEL-LOADER
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-MODEL-LOADER
      interfaceRef: IF-GO-MODEL-LOADING
      action: 'LoadBundle reads the engmod.yml manifest and every document it names and returns the bundle, or an error and the empty bundle.'
      dataRefs:
      - DO-MODEL-BUNDLE
      next:
      - validate-bundle
      onError:
      - report-read-error
    - id: validate-bundle
      kind: integration_call
      ref: FU-VALIDATION-ENGINE
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-VALIDATION-ENGINE
      interfaceRef: IF-GO-MODEL-VALIDATION
      action: 'ValidateBundle returns the diagnostics of the bundle, each with a code, a severity, a message and a path; the consumer decides from the severity whether to trust what it reads next.'
      dataRefs:
      - DO-MODEL-BUNDLE
      - DO-MODEL-DIAGNOSTICS
      next:
      - build-entity-index
    - id: build-entity-index
      kind: integration_call
      ref: FU-MODEL-LOADER
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-MODEL-LOADER
      interfaceRef: IF-GO-ENTITY-INDEX-DIFF
      action: 'BuildEntityIndex lists every authored entity of the bundle with the references between them; it reads the bundle only.'
      dataRefs:
      - DO-MODEL-BUNDLE
      - DO-ENTITY-INDEX
      next:
      - build-trace-matrix
      onError:
      - report-read-error
    - id: build-trace-matrix
      kind: integration_call
      ref: FU-ALLOCATION-TRACE
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-ALLOCATION-TRACE
      interfaceRef: IF-GO-TRACE
      action: 'BuildTraceMatrixFromFiles scans the code of the checkout and returns the trace matrix with the findings of the scan; it takes paths, not a bundle.'
      dataRefs:
      - DO-TRACE-MATRIX
      - DO-MODEL-DIAGNOSTICS
      next:
      - read-catalog-usage
      onError:
      - report-read-error
      optional: true
    - id: read-catalog-usage
      kind: integration_call
      ref: FU-VALIDATION-ENGINE
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-VALIDATION-ENGINE
      interfaceRef: IF-GO-CODE-LOOKUP
      action: 'CatalogUsage lists every catalog term with the requirements that name it and the entities that reference it.'
      dataRefs:
      - DO-MODEL-BUNDLE
      - DO-CATALOG-USAGE
      onError:
      - report-read-error
      optional: true
    - id: report-read-error
      kind: notification
      ref: ACT-GO-CONSUMER
      action: 'The consumer receives the error of the call and no result of that call; it keeps what it read before and reports the part that could not be read.'
  - id: FLOW-GO-COMPARE-REVISIONS
    title: Go Consumer Compares Revisions of a Model
    kind: data
    frequency: on-demand
    sourceRef: ACT-GO-CONSUMER
    destinationRef: FU-MODEL-LOADER
    protocol: go-library
    channel: in-process
    dataRefs:
    - DO-MODEL-BUNDLE
    - DO-ENTITY-INDEX
    - DO-MODEL-DIFF
    description: 'A Go consumer reads the model of a git revision, or compares the model at one revision with another revision or with the working tree and, when asked, the change of requirement traceability. The engine reads git objects and writes nothing to the repository.'
    entry:
    - load-revision-bundle
    - diff-models
    exits:
    - build-revision-index
    - diff-models
    steps:
    - id: load-revision-bundle
      kind: integration_call
      ref: FU-MODEL-LOADER
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-MODEL-LOADER
      interfaceRef: IF-GO-MODEL-LOADING
      action: 'LoadBundleAtRef reads the model documents as committed at a git revision of a repository and returns the bundle, or an error for an unknown revision.'
      dataRefs:
      - DO-MODEL-BUNDLE
      next:
      - build-revision-index
      onError:
      - report-compare-error
    - id: build-revision-index
      kind: integration_call
      ref: FU-MODEL-LOADER
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-MODEL-LOADER
      interfaceRef: IF-GO-ENTITY-INDEX-DIFF
      action: 'BuildEntityIndex lists the entities of the bundle of that revision.'
      dataRefs:
      - DO-MODEL-BUNDLE
      - DO-ENTITY-INDEX
      onError:
      - report-compare-error
    - id: diff-models
      kind: integration_call
      ref: FU-MODEL-LOADER
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-MODEL-LOADER
      interfaceRef: IF-GO-ENTITY-INDEX-DIFF
      action: 'DiffModels takes a ModelDiffRequest (repository, from revision, to revision or the working tree, trace flag) and returns the entities added, removed and changed and, with the trace flag, the change of traceability; a trace that cannot be built is reported inside the result, not as an error.'
      dataRefs:
      - DO-ENTITY-INDEX
      - DO-MODEL-DIFF
      onError:
      - report-compare-error
    - id: report-compare-error
      kind: notification
      ref: ACT-GO-CONSUMER
      action: 'The consumer receives the error of the call and no result of that call.'
  - id: FLOW-GO-LOOK-UP-CODE
    title: Go Consumer Looks Up Code
    kind: data
    frequency: on-demand
    sourceRef: ACT-GO-CONSUMER
    destinationRef: FU-CODEMAP-INFERENCE
    protocol: go-library
    channel: in-process
    dataRefs:
    - DO-MODEL-BUNDLE
    - DO-CODE-DECLARATIONS
    description: 'A Go consumer lists the declarations of the code scope of a model and asks for the candidate definitions of a name used in a file. A result is a candidate: scopes, imports and overloads are not resolved.'
    entry:
    - list-code-declarations
    exits:
    - find-code-definitions
    steps:
    - id: list-code-declarations
      kind: integration_call
      ref: FU-CODEMAP-INFERENCE
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-CODEMAP-INFERENCE
      interfaceRef: IF-GO-CODE-LOOKUP
      action: 'ListCodeDeclarations reads the files of the code scope of the bundle under a root directory and returns every named declaration with its kind, language, path and lines.'
      dataRefs:
      - DO-MODEL-BUNDLE
      - DO-CODE-DECLARATIONS
      next:
      - find-code-definitions
      onError:
      - report-lookup-error
    - id: find-code-definitions
      kind: integration_call
      ref: FU-CODEMAP-INFERENCE
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-CODEMAP-INFERENCE
      interfaceRef: IF-GO-CODE-LOOKUP
      action: 'FindCodeDefinitions ranks the declarations a name used in a file may refer to by closeness to the file and returns them; it reads the list only and returns an empty list for an unknown name.'
      dataRefs:
      - DO-CODE-DECLARATIONS
    - id: report-lookup-error
      kind: notification
      ref: ACT-GO-CONSUMER
      action: 'The consumer receives the error of the call and no declarations.'
  - id: FLOW-GO-COMPOSE-AND-LINK
    title: Go Consumer Composes a Model and Reads its Requirement Links
    kind: data
    frequency: on-demand
    sourceRef: ACT-GO-CONSUMER
    destinationRef: FU-SYSTEM-COMPOSITION
    protocol: go-library
    channel: in-process
    dataRefs:
    - DO-MODEL-BUNDLE
    - DO-COMPOSITION-RESULT
    - DO-CONTRACT-ITEMS
    - DO-REQUIREMENT-LINK-STATUS
    - DO-LINK-USE
    description: 'A Go consumer resolves the dependencies of a model from the checkouts a workspace file names, projects the published entities of the dependencies into the bundle so that alias::ID references validate, reads the contract items the model publishes and evaluates the requirement links of the model against its dependencies. The consumer chooses the lock mode and the module cache mode; nothing here writes the lock when it asks for check.'
    entry:
    - resolve-composition
    exits:
    - evaluate-links
    - read-link-users
    steps:
    - id: resolve-composition
      kind: integration_call
      ref: FU-SYSTEM-COMPOSITION
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-SYSTEM-COMPOSITION
      interfaceRef: IF-GO-COMPOSITION
      action: 'GenerateCompositionFromFileWith takes the manifest path and ResolutionOptions (lock mode, module cache mode, workspace mode) and returns the composed system with its diagnostics, or an error when a dependency cannot be resolved.'
      dataRefs:
      - DO-COMPOSITION-RESULT
      next:
      - project-composition
      onError:
      - report-compose-error
    - id: project-composition
      kind: integration_call
      ref: FU-SYSTEM-COMPOSITION
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-SYSTEM-COMPOSITION
      interfaceRef: IF-GO-COMPOSITION
      action: 'BuildCompositionProjection returns the published entities of the composition; its EnrichBundle method merges them into the bundle, which the consumer then validates (FLOW-GO-READ-MODEL).'
      dataRefs:
      - DO-COMPOSITION-RESULT
      - DO-MODEL-BUNDLE
      next:
      - read-contract-items
    - id: read-contract-items
      kind: integration_call
      ref: FU-ALLOCATION-TRACE
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-ALLOCATION-TRACE
      interfaceRef: IF-GO-REQUIREMENT-LINKS
      action: 'ContractItemsFromBundle returns the capabilities and assumptions of use of the bundle by ID, each with its realizing requirements; SortedContractItemRealizers puts the realizers in a stable order.'
      dataRefs:
      - DO-MODEL-BUNDLE
      - DO-CONTRACT-ITEMS
      next:
      - evaluate-links
    - id: evaluate-links
      kind: integration_call
      ref: FU-ALLOCATION-TRACE
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-ALLOCATION-TRACE
      interfaceRef: IF-GO-REQUIREMENT-LINKS
      action: 'LinkDependencies turns the composed system into the dependencies to compare with and EvaluateRequirementLinks returns the status of each requirement link of the bundle against them.'
      dataRefs:
      - DO-COMPOSITION-RESULT
      - DO-REQUIREMENT-LINK-STATUS
      next:
      - read-link-users
    - id: read-link-users
      kind: integration_call
      ref: FU-SYSTEM-COMPOSITION
      sourceRef: ACT-GO-CONSUMER
      destinationRef: FU-SYSTEM-COMPOSITION
      interfaceRef: IF-GO-COMPOSITION
      action: 'WorkspaceLinkUsers returns the requirement links that other checkouts of the workspace hold on the contract items of the bundle.'
      dataRefs:
      - DO-MODEL-BUNDLE
      - DO-LINK-USE
      optional: true
    - id: report-compose-error
      kind: notification
      ref: ACT-GO-CONSUMER
      action: 'The consumer receives the error of the call and no composed system; it reports that the references to other repositories cannot be checked.'
