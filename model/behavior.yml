  - type: triggered_by
    from: STATE-ARTIFACTS-FRESH
    to: EVT-ARTIFACT-GENERATED
    description: Fresh-state reached after successful generation cycle.
  - type: guarded_by
    from: STATE-MODEL-VALID
    to: CTRL-STRICT-MCP-INPUT-SCHEMA
    description: Model-aware tool usage requires strict MCP input semantics.
  - type: transitions_to
    from: STATE-LINK-CLAIMED
    to: STATE-LINK-ACCEPTED
    description: On link review requested (engws review-links --accept by a model actor) a claimed link is accepted (REQ-EMG-101).
  - type: transitions_to
    from: STATE-LINK-ACCEPTED
    to: STATE-LINK-SUSPECT
    description: On dependency bump requested, a changed meaning of the child item or a realizer, or a reviewed version that cannot be resolved, leaves an accepted link at its old pin, version-mismatched (REQ-EMG-100, REQ-EMG-094).
  - type: transitions_to
    from: STATE-LINK-ACCEPTED
    to: STATE-LINK-BROKEN
    description: On dependency bump requested or model updated, a child item missing at the published dependency pin breaks an accepted link (REQ-EMG-097, REQ-EMG-100).
  - type: transitions_to
    from: STATE-LINK-SUSPECT
    to: STATE-LINK-ACCEPTED
    description: On link review requested (engws review-links --accept) a version-mismatched link is pinned to the dependency version and accepted again (REQ-EMG-101).
  - type: triggered_by
    from: STATE-LINK-CLAIMED
    to: EVT-LINK-MIGRATION-REQUESTED
    description: engws migrate-links records each converted allocation as a claimed link (REQ-EMG-104).
  - type: triggered_by
    from: STATE-LINK-CLAIMED
    to: EVT-LINK-ADD-REQUESTED
    description: engws link add writes a claimed link pinned to the dependency version (REQ-EMG-119).
  - type: triggered_by
    from: STATE-LINK-CLAIMED
    to: EVT-LINK-REVIEW-REQUESTED
    description: A claimed link is listed and may be accepted (REQ-EMG-101).
  - type: triggered_by
    from: STATE-LINK-SUSPECT
    to: EVT-LINK-REVIEW-REQUESTED
    description: A version-mismatched link is shown with its change in meaning and may be accepted (REQ-EMG-101).
  - type: triggered_by
    from: STATE-LINK-BROKEN
    to: EVT-LINK-REVIEW-REQUESTED
    description: A broken link is shown but refused for acceptance (REQ-EMG-101).
  - type: triggered_by
    from: STATE-LINK-ACCEPTED
    to: EVT-DEPENDENCY-BUMP-REQUESTED
    description: bump compares accepted links between versions by meaning; the same meaning moves the pin (REQ-EMG-100).
  - type: triggered_by
    from: STATE-LINK-ACCEPTED
    to: EVT-CONTRACT-DIFF-REQUESTED
    description: A child's contract diff states the semver impact of the changes its users' links will see (REQ-EMG-102).
  - type: triggered_by
    from: STATE-LINK-ACCEPTED
    to: EVT-RELEASE-CHECK-REQUESTED
    description: A release is refused while it pins unreleased dependencies or under-states a contract change (REQ-EMG-103).
