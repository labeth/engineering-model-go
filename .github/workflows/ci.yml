name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Java for official SysML parser
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache pinned SysML toolchain
        uses: actions/cache@v4
        with:
          path: |
            .engmod/tooling/downloads
            .engmod/cache/m2
          key: sysml-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/sysml-toolchain.env', 'scripts/install-sysml-toolchain.sh') }}

      - name: Download dependencies
        run: go mod download

      - name: Install cue (Gemara schema validation)
        run: go install cuelang.org/go/cmd/cue@v0.15.4

      - name: Install TRLC and LOBSTER validators
        run: |
          python3 -m pip install \
            trlc==2.0.2 \
            bmw-lobster-core==1.0.6 \
            bmw-lobster-tool-trlc==1.0.6

      - name: Install pinned SysML validator and Sysand
        run: scripts/install-sysml-toolchain.sh

      - name: Cache pinned Quint toolchain
        uses: actions/cache@v4
        with:
          path: .engmod/tooling/downloads
          key: quint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/quint-toolchain.env', 'scripts/install-quint-toolchain.sh', 'scripts/quint-tool/package-lock.json') }}

      - name: Install pinned Quint and Apalache
        # quint comes from the lockfile with --ignore-scripts; Apalache is a
        # sha256-checked tarball unpacked where Quint looks for it, so `quint
        # verify` never downloads at run time (ADR-EMG-041).
        run: scripts/install-quint-toolchain.sh

      - name: Validation gauntlet
        # Enforces the generation gates (engdoc 0 errors = trace integrity, dangling
        # links, EARS, composition), zero-gap SysML coverage, official parser and
        # native KPAR source round trip, artifact freshness, formal behavior
        # verification (engquint check: run and verify), and schema validation.
        env:
          ENGMOD_QUINT: ${{ github.workspace }}/.engmod/tooling/quint/node_modules/.bin/quint
          QUINT_HOME: ${{ github.workspace }}/.engmod/tooling/quint-home
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          scripts/validate-all.sh

  release-check:
    # A release tag is gated on the model's own release rules: no dependency
    # pinned to a pre-release or pseudo-version, and a tag bump at least as
    # large as the contract change since the previous release tag (D3, D11).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # release-check reads earlier release tags and the model at them.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Release check
        run: go run ./cmd/engws release-check --repo . --tag "${GITHUB_REF_NAME}"
