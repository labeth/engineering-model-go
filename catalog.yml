schemaVersion: 1

catalog:
  systems:
    - id: SYS-ENGINEERING-MODEL-GO
      name: engineering model go
      definition: Go-based architecture modeling system that generates docs, analysis views, and compliance artifacts.
      aliases: [engmodel, engineering model toolchain]

  functionalGroups:
    - id: FG-MODEL-AUTHORING
      name: model authoring
      definition: Authoring and loading of architecture, catalog, requirements, and design inputs.
      aliases: [authoring]
    - id: FG-VALIDATION-ANALYSIS
      name: validation and analysis
      definition: Validation, inference, and evidence analysis over authored and inferred model content.
      aliases: [analysis]
    - id: FG-ARTIFACT-GENERATION
      name: artifact generation
      definition: Generation of AsciiDoc and exchange artifacts from model inputs.
      aliases: [generation]
    - id: FG-TRACEABILITY-COMPLIANCE
      name: traceability and compliance
      definition: Requirement trace exports and compliance-oriented output generation.
      aliases: [compliance]
    - id: FG-MCP-INTEGRATION
      name: mcp integration
      definition: MCP server interfaces that expose model-aware tooling for AI agents.
      aliases: [mcp]

  functionalUnits:
    - id: FU-MODEL-LOADER
      name: model loader
      definition: Validates canonical YAML documents against embedded CUE schemas, strictly decodes them into Go runtime representations, and normalizes them for downstream use.
      aliases: [bundle loader]
    - id: FU-VALIDATION-ENGINE
      name: validation engine
      definition: Validates IDs, references, and model consistency across authored entities and mappings.
      aliases: [validator]
    - id: FU-CODEMAP-INFERENCE
      name: codemap inference
      definition: Infers runtime, code, and verification evidence from repository sources and test markers.
      aliases: [inference]
    - id: FU-VIEW-PROJECTION
      name: view projection
      definition: Builds view-specific projections for architecture communication and traceability outputs.
      aliases: [projection]
    - id: FU-ASCIIDOC-GENERATOR
      name: asciidoc generator
      definition: Renders architecture documentation and view narratives to AsciiDoc and PDF artifacts.
      aliases: [engdoc]
    - id: FU-THREAT-EXPORTER
      name: threat exporter
      definition: Exports threat model views to Threat Dragon and Open OTM representations.
      aliases: [engdragon]
    - id: FU-STRUCTURIZR-EXPORTER
      name: structurizr exporter
      definition: Exports Structurizr DSL and supports validation/static-site workflows.
      aliases: [engstruct]
    - id: FU-SYSML-EXPORTER
      name: sysml exporter
      definition: Generates SysML v2 model artifacts from the canonical semantic model and reports conformance coverage.
      aliases: [engsysml]
    - id: FU-NAF-EXPORTER
      name: naf exporter
      definition: Validates NATO Architecture Framework 4.1 profile metadata and generates NAF architecture products from canonical model views.
      aliases: [engnaf, naf]
    - id: FU-TRLC-EXPORTER
      name: trlc exporter
      definition: Exports requirements and model structures to TRLC artifacts.
      aliases: [engtrlc]
    - id: FU-LOBSTER-EXPORTER
      name: lobster exporter
      definition: Generates LOBSTER traceability inputs and reports from model and verification links.
      aliases: [englobster]
    - id: FU-OSCAL-EXPORTER
      name: oscal exporter
      definition: Exports the OSCAL system security plan, assessment results, and plan of action and milestones.
      aliases: [engoscal]
    - id: FU-GEMARA-EXPORTER
      name: gemara exporter
      definition: Renders the model into OpenSSF Gemara L1-L7 catalogs and logs plus an optional OSCAL bridge, validated by the Gemara SDK.
      aliases: [enggemara]
    - id: FU-SYSTEM-COMPOSITION
      name: system composition
      definition: Resolves downward subsystem references from local subdirectories or external git repositories and composes a federated system-of-systems model.
      aliases: [composition]
    - id: FU-ALLOCATION-TRACE
      name: allocation trace
      definition: Materializes parent-to-subsystem allocation and bidirectional traceability across composed systems.
      aliases: [allocation]
    - id: FU-MCP-SERVER
      name: mcp server
      definition: Serves model-backed MCP tools with validated inputs and structured responses.
      aliases: [engmcp]
    - id: FU-CLI-ORCHESTRATION
      name: cli orchestration
      definition: Command entrypoints that orchestrate loading, validation, generation, and export flows.
      aliases: [cmd layer]
    - id: FU-MODEL-CHANGE
      name: model change
      definition: Plans, validates, summarizes, and atomically applies typed changes to authored model documents.
      aliases: [delta merger, requirements merger]

  referencedElements:
    - id: REF-GO-TOOLCHAIN
      name: go toolchain
      definition: Go compiler, test runner, and module tooling used by the repository.
      aliases: [go]
    - id: REF-THREAT-DRAGON-SCHEMAS
      name: threat dragon schemas
      definition: External JSON schemas used to validate Threat Dragon exports.
      aliases: [threat dragon]
    - id: REF-OPEN-OTM-SCHEMA
      name: open otm schema
      definition: Open Threat Model schema used to validate OTM output artifacts.
      aliases: [otm schema]
    - id: REF-STRUCTURIZR-VALIDATOR
      name: structurizr validator
      definition: Structurizr DSL validation runtime used to verify generated DSL.
      aliases: [structurizr]
    - id: REF-SYSML-V2-TOOLCHAIN
      name: sysml v2 toolchain
      definition: SysML 2.0 and KerML 1.0 with Pilot Implementation 2026-04 artifact 0.59.0, the pinned validator wrapper, and Sysand 0.2.1 for normative KPAR packaging.
      aliases: [sysml, kerml]
    - id: REF-NAF-V4-1-SPECIFICATION
      name: nato architecture framework v4.1
      definition: NATO Architecture Framework version 4.1 viewpoint taxonomy and architecture-description guidance.
      aliases: [naf, naf v4.1]
    - id: REF-TRLC-TOOLCHAIN
      name: trlc toolchain
      definition: TRLC parser and runtime used for requirements language validation.
      aliases: [trlc]
    - id: REF-LOBSTER-TOOLCHAIN
      name: lobster toolchain
      definition: LOBSTER core and TRLC integration tools used for traceability reporting.
      aliases: [lobster]

  actors:
    - id: ACT-ARCHITECTURE-AUTHOR
      name: architecture author
      definition: Maintains model structure, mappings, and architecture intent.
      aliases: [model author]
    - id: ACT-IMPLEMENTATION-ENGINEER
      name: implementation engineer
      definition: Implements code changes guided by model requirements and support paths.
      aliases: [engineer]
    - id: ACT-COMPLIANCE-ENGINEER
      name: compliance engineer
      definition: Reviews controls, risks, and traceability outputs for compliance needs.
      aliases: [assurance]
    - id: ACT-AI-AGENT
      name: ai agent
      definition: Consumes MCP outputs to plan and execute model-guided edits.
      aliases: [coding agent]
    - id: ACT-CI-PIPELINE
      name: ci pipeline
      definition: Runs automated validation and export checks for pull requests.
      aliases: [ci]

  attackVectors:
    - id: AV-MALFORMED-MODEL-INPUT
      name: malformed model input
      definition: Invalid or ambiguous model content that causes incorrect graph construction.
      aliases: [invalid model]
    - id: AV-SCHEMA-SUPPLY-CHAIN-TAMPER
      name: schema supply chain tamper
      definition: Tampering or drift in external schemas used for export validation.
      aliases: [schema tamper]
    - id: AV-PATH-TRAVERSAL-IN-MCP
      name: path traversal in mcp calls
      definition: Host file access attempts through untrusted path arguments in MCP tools.
      aliases: [path traversal]
    - id: AV-TRACEABILITY-GAP-DRIFT
      name: traceability gap drift
      definition: Requirement links or tests drifting from implementation over time.
      aliases: [trace drift]

  events:
    - id: EVT-MODEL-UPDATED
      name: model updated event is received
      definition: Event indicating architecture or requirement model source changed.
      aliases: [model change]
    - id: EVT-GENERATION-RUN-REQUESTED
      name: generation run is requested
      definition: Event indicating documentation or export generation execution starts.
      aliases: [generation requested]
    - id: EVT-VALIDATION-FAILED
      name: validation failed event is raised
      definition: Event indicating model or export validation failed.
      aliases: [validation failure]
    - id: EVT-ARTIFACT-GENERATED
      name: artifact generated event is raised
      definition: Event indicating one or more generated outputs were produced successfully.
      aliases: [artifact generated]
    - id: EVT-MCP-TOOL-CALL-RECEIVED
      name: mcp tool call is received
      definition: Event indicating the MCP server received a tool invocation request.
      aliases: [tool call]
    - id: EVT-REQUIREMENTS-DELTA-RECEIVED
      name: requirements delta is received
      definition: Event indicating a typed requirements change is ready for planning and validation.
      aliases: [requirements change received]
    - id: EVT-REQUIREMENTS-DELTA-APPLY-REQUESTED
      name: requirements delta apply is requested
      definition: Event indicating a validated requirements change should replace the canonical document.
      aliases: [requirements apply requested]

  states:
    - id: STATE-MODEL-VALID
      name: model is valid
      definition: State where authored model passes validation checks.
      aliases: [valid]
    - id: STATE-MODEL-INVALID
      name: model is invalid
      definition: State where validation diagnostics include one or more errors.
      aliases: [invalid]
    - id: STATE-ARTIFACTS-FRESH
      name: generated artifacts are fresh
      definition: State where generated outputs reflect the latest authored model inputs.
      aliases: [up to date]

  features:
    - id: FEAT-MCP-SERVER
      name: mcp server is enabled
      definition: Feature enabling MCP runtime APIs for model-aware tooling.
      aliases: [mcp enabled]
    - id: FEAT-THREAT-EXPORT
      name: threat export is enabled
      definition: Feature enabling Threat Dragon and Open OTM exports.
      aliases: [threat modeling export]
    - id: FEAT-STRUCTURIZR-EXPORT
      name: structurizr export is enabled
      definition: Feature enabling Structurizr DSL generation and validation.
      aliases: [dsl export]
    - id: FEAT-SYSML-EXPORT
      name: sysml export is enabled
      definition: Feature enabling SysML v2 textual and project interchange generation.
      aliases: [sysml generation]
    - id: FEAT-NAF-PROFILE
      name: naf profile authoring is enabled
      definition: Feature enabling NATO Architecture Framework stakeholder, concern, and viewpoint metadata in the architecture model.
      aliases: [naf authoring]
    - id: FEAT-NAF-EXPORT
      name: naf export is enabled
      definition: Feature enabling NATO Architecture Framework architecture document generation.
      aliases: [naf generation]
    - id: FEAT-TRACEABILITY-EXPORT
      name: traceability export is enabled
      definition: Feature enabling TRLC and LOBSTER generation flows.
      aliases: [trace export]
    - id: FEAT-GEMARA-EXPORT
      name: gemara export is enabled
      definition: Feature enabling OpenSSF Gemara catalog and evaluation log generation.
      aliases: [gemara generation]
    - id: FEAT-SYSTEM-COMPOSITION
      name: system composition is enabled
      definition: Feature enabling recursive composition of subsystem models (local or external git) into a system-of-systems.
      aliases: [system of systems]
    - id: FEAT-HARDWARE-INTERFACES
      name: hardware interfaces are authored
      definition: Feature enabling hardware items and hardware/software interface modeling.
      aliases: [hw interfaces]
    - id: FEAT-ARCHITECTURE-DECISION-RECORDS
      name: architecture decision records are authored
      definition: Feature indicating the architecture model includes first-class ADR entries.
      aliases: [adrs authored]

  modes:
    - id: MODE-LOCAL-DEVELOPMENT
      name: local development mode is active
      definition: Local developer mode for iterative model and code updates.
      aliases: [local mode]
    - id: MODE-CI-VALIDATION
      name: ci validation mode is active
      definition: Automated pipeline mode focused on deterministic checks and artifacts.
      aliases: [ci mode]
    - id: MODE-DRY-RUN
      name: dry run mode is active
      definition: Change-planning mode that computes and validates a candidate without writing canonical files.
      aliases: [preview mode]

  conditions:
    - id: COND-CATALOG-REFERENCES-RESOLVE
      name: catalog references resolve successfully
      definition: Condition requiring all authored references to match known catalog entries.
      aliases: [catalog resolved]
    - id: COND-REQUIREMENT-TRACE-COMPLETE
      name: requirement trace is complete
      definition: Condition requiring requirements to map to implementation and verification evidence.
      aliases: [trace complete]
    - id: COND-EXTERNAL-SCHEMA-AVAILABLE
      name: external schema dependencies are available
      definition: Condition requiring external schema artifacts to be present for validation.
      aliases: [schema available]

  dataTerms:
    - id: DATA-SYSML-V2-METAMODEL
      name: sysml v2 metamodel
      definition: Pinned formal SysML 2.0 and KerML 1.0 abstract syntax used to derive semantic coverage and schema constraints.
      aliases: [sysml metamodel, kerml metamodel]
    - id: DATA-ARCHITECTURE-MODEL
      name: architecture model
      definition: Authored architecture source describing functional intent and mappings.
      aliases: [architecture yml, candidate architecture model]
    - id: DATA-CANONICAL-SEMANTIC-MODEL
      name: canonical semantic model
      definition: SysML v2 and KerML aligned semantic representation used by validation and every output projection.
      aliases: [semantic model, canonical model]
    - id: DATA-MODEL-AUTHORING-CONTRACT
      name: model authoring contract
      definition: Machine-readable description of canonical YAML documents, schema versions, explicit references, top-level sections, identifier conventions, and authoring order.
      aliases: [authoring manifest, input contract]
    - id: DATA-CATALOG-DOCUMENT
      name: catalog document
      definition: Canonical authored vocabulary YAML document used by strict requirement and model validation.
      aliases: [catalog yml]
    - id: DATA-DESIGN-DOCUMENT
      name: design document
      definition: Canonical authored design-view YAML document.
      aliases: [design yml]
    - id: DATA-DECISIONS-DOCUMENT
      name: decisions document
      definition: Canonical authored architecture decision YAML document.
      aliases: [decisions yml]
    - id: DATA-REQUIREMENTS-DELTA
      name: requirements delta
      definition: Versioned add, whole-entity update, and remove operations keyed by requirement stable ID.
      aliases: [requirements change]
    - id: DATA-REQUIREMENTS-DOCUMENT
      name: requirements document
      definition: Canonical authored requirements YAML document.
      aliases: [requirements yml]
    - id: DATA-REQUIREMENTS-DIFF
      name: requirements change summary
      definition: Deterministic human-readable summary of added, updated, and removed requirements.
      aliases: [requirements diff]
    - id: DATA-MCP-TOOL-RESULT
      name: mcp tool result
      definition: Structured MCP tool response payload carrying model-aware query results.
      aliases: [tool result]
    - id: DATA-STRUCTURIZR-DSL
      name: structurizr dsl artifact
      definition: Generated Structurizr workspace DSL document.
      aliases: [dsl]
    - id: DATA-SYSML-V2-MODEL
      name: sysml v2 model artifact
      definition: Generated SysML v2 textual or project interchange representation of the canonical semantic model.
      aliases: [sysml artifact, sysml model]
    - id: DATA-NAF-V4-ARCHITECTURE
      name: naf v4.1 architecture document
      definition: Generated NATO Architecture Framework v4.1 architecture document assembled from profile metadata and canonical model views.
      aliases: [naf document, naf architecture]
    - id: DATA-THREAT-DRAGON-JSON
      name: threat dragon json artifact
      definition: Generated threat model artifact for OWASP Threat Dragon.
      aliases: [threat dragon output]
    - id: DATA-TRLC-PACKAGE
      name: trlc package
      definition: Generated TRLC requirements package and model metadata.
      aliases: [trlc output]
    - id: DATA-LOBSTER-TRACE-REPORT
      name: lobster trace report
      definition: Traceability report output generated from TRLC and test links.
      aliases: [lobster report]
    - id: DATA-OSCAL-SSP
      name: oscal ssp artifact
      definition: Generated OSCAL system security plan JSON output.
      aliases: [ssp json]
    - id: DATA-ARCHITECTURE-DECISION-RECORDS
      name: architecture decision records document
      definition: Generated document containing authored architecture decision records.
      aliases: [adr document, decisions document]
